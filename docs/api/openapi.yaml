# Relay Control API — OpenAPI 3.1 specification (ADR-0010).
#
# This file is the PUBLISHED CONTRACT for /api/v1. It is not documentation
# generated after the fact and hoped to be current: relay's openapi_test.go
# loads this file, validates it, and compares its paths and methods against
# api.Routes() — the route table the server actually mounts. Adding, renaming,
# or removing a route without editing this file fails CI, and vice versa.
#
# Versioning (ADR-0010, ADR-0014): the surface is /api/v1. Once v1.0.0 freezes
# it, changes here are additive-only; a breaking change requires /api/v2 served
# in parallel.
#
# Scope boundary (invariant 11): every operation below manages a RUNTIME
# OBJECT — Enrollment Tokens, Nodes, Accounts, API Tokens, the Freeze, Jobs.
# None reads or writes Relay configuration. Blast-radius caps, CA/TLS material,
# listeners, and the auth bootstrap live in a root-owned local file and have no
# endpoint here by design: the Control API can never raise its own limits.
openapi: 3.1.0

info:
  title: Relay Control API
  version: "1.0.0"
  summary: Fleet-administration control plane for Relay.
  description: |
    The REST half of Relay's control plane. It is one of three thin surfaces
    (MCP, this API, the Admin Console) over a single capability layer
    (ADR-0009/0010): every execution request here runs the same
    Selector → authz → blast-cap → dispatch → audit pipeline the MCP surface
    uses, so both inherit identical Freeze, authorization, cap, and audit
    behaviour rather than re-deriving it.

    **Authorization** is a role ladder enforced centrally, never per surface:

    | Role | May |
    |---|---|
    | `viewer` | read |
    | `operator` | + run structured Operations (the typed path) |
    | `admin` | + Raw Exec, and all identity management |

    Raw Exec being admin-only is the centrally-enforced half of ADR-0001's
    safety model. Node Policy still gates every command that arrives and
    remains the last line of defense (ADR-0002); this ladder decides who may
    even *ask* for the arbitrary-command path.

    **Errors** are `application/problem+json` (RFC 7807) on every non-2xx.

servers:
  - url: https://{host}:{port}
    description: A Relay's control-plane listener (separate from the node-plane gRPC listener).
    variables:
      host:
        default: localhost
      port:
        default: "9443"

security:
  - apiToken: []

tags:
  - name: Execution
    description: |
      Run Operations and Raw Exec against a Selector's matched Nodes, or preview
      the outcome with a Policy preflight. Every route here goes through the shared
      capability layer.
  - name: Jobs
    description: Re-read a Job's per-Node results, or cancel one in flight (ADR-0013).
  - name: Enrollment
    description: Mint and revoke Enrollment Tokens; revoke Nodes.
  - name: Freeze
    description: The Relay-wide emergency stop (ADR-0013).
  - name: Tags
    description: |
      Add or remove `tag:` labels on Nodes (ADR-0050). A human Account at
      `operator` or above; machine Accounts are refused.
  - name: Identity
    description: Accounts and API Tokens (ADR-0010). Admin-only.
  - name: Approvals
    description: |
      The out-of-band decision channel for gated dispatches (ADR-0027).

      A dispatch that a root-owned gate rule covers **parks** instead of
      running: no Job and no Tasks are created, and the caller gets a
      `409 pending approval` carrying the request id and plan hash. A human then
      answers here — on an authenticated endpoint, carrying a credential the
      requesting session does not hold — and the same dispatch proceeds the next
      time it is driven.

      That separation is the guarantee. The agent proposing an action is
      structurally outside the trust path, and the Relay (never the agent)
      authors every word the approver reads.
paths:
  # ---------------------------------------------------------------------------
  # Execution
  # ---------------------------------------------------------------------------
  /api/v1/operations:
    post:
      tags: [Execution]
      operationId: runOperation
      summary: Run a structured Operation (or plan it)
      description: |
        Runs a typed, native-argv Operation (ADR-0001 — never a shell) against
        every Node the Selector matches. Requires the `operator` role.

        With `plan: true` this resolves, authorizes, and checks exactly as a
        real run would but **executes nothing**, returning per-Node Policy
        verdicts instead (ADR-0011). A plan creates no Job, so its response
        carries no `job_id`. A Selector that matches no Nodes is refused with
        `422`; with `plan: true` it is reported instead as
        `would_be_rejected.reason: no_nodes_matched`.

        Argument NAMES are validated against the Operation's published
        constraints before dispatch, so a misspelled argument is a `400` rather
        than a Policy denial. See `GET /api/v1/operations`… (vocabulary
        discovery is an MCP surface today; the argument names and constraints
        are the same on both).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunOperationRequest'
      responses:
        "200":
          description: |
            The dispatch completed (every matched Node's Task reached a terminal
            outcome), or — with `plan: true` — the plan was computed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionResponse'
                  - $ref: '#/components/schemas/PlanResponse'
        "202": { $ref: '#/components/responses/PendingApproval' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Frozen' }
        "422": { $ref: '#/components/responses/GuardrailRejected' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/raw-exec:
    post:
      tags: [Execution]
      operationId: rawExec
      summary: Run an arbitrary argv (or plan it) — admin only
      description: |
        ADR-0001's regex-gated escape hatch. `argv` runs verbatim — no shell, no
        client-side splitting — and the daemon's Policy regex decides per Node
        whether it is allowed.

        **Requires the `admin` role**, enforced centrally in the capability
        layer. Always risk class `mutate` regardless of what the command does,
        so it always takes the strict mutate blast cap (ADR-0012): a
        read-only-looking command is still unclassifiable, and "this command
        only reads" is exactly the claim an arbitrary-command path cannot make
        on its own behalf.

        Prefer `POST /api/v1/operations` whenever a structured Operation
        expresses the task.

        A Selector that matches no Nodes is refused with `422`; with
        `plan: true` it is reported instead as
        `would_be_rejected.reason: no_nodes_matched`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawExecRequest'
      responses:
        "200":
          description: The dispatch completed, or the plan was computed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ExecutionResponse'
                  - $ref: '#/components/schemas/PlanResponse'
        "202": { $ref: '#/components/responses/PendingApproval' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403":
          description: |
            The caller's role is below `admin`. This is the ladder refusing the
            arbitrary-command path, and it is audited as a refusal.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "409": { $ref: '#/components/responses/Frozen' }
        "422": { $ref: '#/components/responses/GuardrailRejected' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Jobs
  # ---------------------------------------------------------------------------
  /api/v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobID'
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Re-read a Job's per-Node results
      description: |
        Returns the Job and every Task's outcome. Use it to poll a Job started
        earlier, or to re-read one after cancelling it.

        **This read is audited** (ADR-0025). It returns captured Task output, so
        a caller can read back command output somebody else produced; the access
        trail records who read which Job and when — never the content. If the
        audit record cannot be written the read is refused rather than served
        invisibly.
      responses:
        "200":
          description: The Job and its per-Node results.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/JobNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobID'
    post:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a Job's Tasks
      description: |
        ADR-0013 cancellation: undispatched Tasks are marked cancelled without
        ever being sent, in-flight Tasks are asked to cancel over their Tunnels,
        and already-resolved Tasks keep their truthful outcome.

        Best-effort for in-flight Tasks by design — a Task that completes before
        the cancel reaches it reports its real outcome, never a fabricated
        `cancelled`. Cancelling an already-finished Job is therefore a clean
        `200` no-op.

        **Requires the `operator` role or above.** That floor is not
        human-only — an AI-agent may cancel its own dispatch — but who it may
        cancel differs by Account kind: a **human** Account may cancel any
        Job. A **machine** Account may cancel only a Job recorded as
        requested by that same Account; a Job with no recorded requester, or
        one requested by a different Account, is refused `403`. The requester
        is recorded on the Job when it is created, so a machine Account may
        cancel its own Job while it is still in flight.
      responses:
        "200":
          description: The cancel was applied (or was a no-op on a finished Job).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelledJob' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/JobNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Approvals (ADR-0027)
  # ---------------------------------------------------------------------------
  /api/v1/approvals:
    get:
      tags: [Approvals]
      operationId: listApprovals
      summary: List dispatches parked for approval
      description: |
        The approval queue: every request still awaiting a decision, oldest
        deadline first. Requests already past their deadline are omitted even if
        the expiry sweeper has not retired them yet, so the queue never
        advertises something undecidable.

        Any authenticated caller may read it. A rule's `audience` restricts who
        may **decide**, not who may see that a decision is owed.
      responses:
        "200":
          description: The pending approval queue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/ApprovalID'
    get:
      tags: [Approvals]
      operationId: getApproval
      summary: Read one approval request
      description: |
        Returns the request in whatever state it is in, including terminal ones
        — "what became of that request?" is exactly the question asked after an
        answer arrives too late.
      responses:
        "200":
          description: The approval request, with every decision recorded so far.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/ApprovalNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/approvals/{id}/decision:
    parameters:
      - $ref: '#/components/parameters/ApprovalID'
    post:
      tags: [Approvals]
      operationId: decideApproval
      summary: Approve or deny a parked dispatch
      description: |
        The authenticated out-of-band decision. `plan_hash` is **required**: an
        approval binds to the content-addressed dispatch (Operation, arguments, and
        resolved fan-out) the decider was shown, so a client working from a
        stale queue entry is told its view moved rather than silently approving
        today's version.

        **Deciding does not dispatch.** A satisfied requirement lets the *same*
        dispatch proceed the next time it is driven. If the fleet drifted in the
        meantime the resolved fan-out differs, the hash differs, and the
        dispatch parks again for re-approval.

        Rules enforced below this route, all of them returning `409` except the
        two genuine authorization failures:

        | Rule | Result |
        |---|---|
        | Role below what the Action needed to be **requested** | `403` |
        | Decider outside the rule's `audience` | `403` |
        | Request already decided, or expired | `409` |
        | Requester deciding their own request under `requester_allowed: false` | `409` |
        | A **machine** Account deciding its own request, under any configuration | `409` |
        | The same Account filling a second quorum slot | `409` |
        | `plan_hash` no longer matches | `409` |

        One denial is terminal: deny beats approve, mirroring Policy's
        deny-beats-allow, so a second approver cannot override a colleague's
        refusal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        "200":
          description: The decision was recorded. The body is the request's resulting state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Approval' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/ApprovalNotFound' }
        "409": { $ref: '#/components/responses/ApprovalNotDecidable' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Enrollment
  # ---------------------------------------------------------------------------
  /api/v1/enrollment-tokens:
    post:
      tags: [Enrollment]
      operationId: mintEnrollmentToken
      summary: Mint an Enrollment Token
      description: |
        Mints an expiring Enrollment Token (ADR-0006). The mint must
        name its use limit: either a positive `max_uses` or `unlimited: true`.
        A mint naming neither, naming a positive `max_uses` together with
        `unlimited: true`, or naming a negative `max_uses` is refused with
        `400`. There is no default (ADR-0031). The token's
        `initial_tags` are written as the enrolling Node's first tags, as the
        minting Account's act, and are ordinary tags afterwards (ADR-0050).
        Enrollment itself stamps only `relay:node-id`.

        A `relay:` label in `initial_tags` is refused with `400` naming the
        label, whoever mints. A machine Account naming any well-formed initial
        tag is refused with `403`: only a human Account writes tags. A machine
        Account naming none is unaffected.

        The plaintext credential is returned **once, here**, in `token` and
        inside `join_string` — it is never persisted, logged, or audited. Store
        it in a vault at this moment or mint a new one.

        **Requires the `admin` role** (ADR-0032 §5). Minting admits Nodes that
        carry the named tags, so it is an act the control plane vouches for; a
        refusal is recorded in the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintEnrollmentTokenRequest' }
      responses:
        "201":
          description: The token was minted. This is the only response carrying the plaintext, in `token` and inside `join_string`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedEnrollmentToken' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/enrollment-tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The Enrollment Token's non-secret id (never the plaintext).
        schema: { type: string }
    delete:
      tags: [Enrollment]
      operationId: revokeEnrollmentToken
      summary: Revoke an Enrollment Token
      description: |
        Revokes the token and cascade-revokes the Nodes already enrolled with
        it, tearing down their live Tunnels. The cascade also writes one Node
        revocation audit record per Node, attributed to the calling Account
        with a derived reason naming the token (#557) — a cascade-revoked
        Node is as attributable as one revoked directly.

        **Requires the `admin` role**: revocation is the middle rung of
        ADR-0020's incident ladder, and this route reaches every Node the
        token enrolled.
      responses:
        "204":
          description: Revoked.
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: No such token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500":
          description: |
            Revoke failed, OR the token and its Nodes were revoked but one or
            more of their per-Node revocation records could not be written
            (the revocation still took effect; retrying will not restore the
            missing records).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/nodes/{node_id}:
    parameters:
      - name: node_id
        in: path
        required: true
        description: The Node's id (its client-certificate CN).
        schema: { type: string }
    get:
      tags: [Enrollment]
      operationId: getNode
      summary: Read one Node
      description: |
        Everything the registry holds about one Node: its Facts, both label
        namespaces, reported fingerprints, and the certificate provenance the
        Relay issued.

        `connected` is whether the Node holds a live Tunnel **right now**, and is
        not inferable from `last_seen`: a Node that reported seconds ago and then
        dropped its stream resolves `unreachable` for dispatch immediately
        (ADR-0004).

        Any authenticated Account may call this — the read floor is `viewer`.
        **The read is audited** before any content is returned, and the call
        fails closed if the trail cannot be written (ADR-0025): `read` means
        "cannot change Node state", not "safe to see". A Node id that is
        empty or longer than 256 bytes is refused as a bad request before
        anything is read or recorded.
      responses:
        "200":
          description: The Node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404":
          description: No such Node.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/nodes/{node_id}/revoke:
    parameters:
      - name: node_id
        in: path
        required: true
        description: The Node's id (its client-certificate CN).
        schema: { type: string }
    post:
      tags: [Enrollment]
      operationId: revokeNode
      summary: Revoke a Node
      description: |
        Revokes a single Node's identity and tears down its live Tunnel
        immediately. The Node cannot reconnect until it re-enrolls.

        **Requires the `admin` role** (ADR-0020's incident ladder:
        quarantine < revoke < Freeze).

        **Requires a non-empty `reason`**, which is recorded in the audit
        trail (except in the one case below, where an earlier cascade record
        already answers why). Revocation is irreversible, and a trail that can say who and
        when but not why leaves the irreversible rung unattributed (#487).

        Repeat calls stay idempotent — 204 either way. If this Relay process
        already recorded this Node's revocation as part of an Enrollment
        Token cascade, this call revokes (or re-applies the revocation to)
        the Node but does not write a second revocation record, for the
        lifetime of this Relay process — regardless of which operator calls
        this endpoint or what reason they give: the record the cascade wrote
        stays the one that answers who ordered the revocation and why. A
        Node with no such cascade record gets a record on every call,
        including a repeat one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeNodeRequest' }
      responses:
        "204":
          description: Revoked.
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/nodes/{node_id}/tags:
    parameters:
      - name: node_id
        in: path
        required: true
        description: The Node's id (its client-certificate CN).
        schema: { type: string }
    post:
      tags: [Tags]
      operationId: writeNodeTag
      summary: Add or remove a tag on one Node
      description: |
        Adds a `tag:key=value` label (replacing the value if the Node already
        carries the key) or removes a `tag:key` label.

        **Requires the `operator` role or above, and a human Account.** A
        machine Account is refused at every role, `admin` included, and a
        `viewer` is refused (ADR-0050). No step-up re-authentication is
        needed, because a tag gates nothing. No MCP tool writes a tag.

        Only `tag:` labels are written on request: a `node:`, `relay:` or
        `state:` label is refused with 400, and the `tag:` prefix is mandatory.
        A tag's key and value follow the stored-Label allowlist exactly: the key
        non-empty, and every byte of key and value one of `A-Z a-z 0-9 . _ -`
        (an empty value is allowed). A key is at most 63 characters and a value
        at most 255; a longer one is refused with 400, never truncated. A Node
        carries at most 64 tags.

        Each Node that changes gets one audit record naming the Account, the
        Node and the old and new values, committed in the same transaction as the
        change. A Node already in the requested state is reported in `unchanged`
        and records nothing. If anything cannot be written, nothing is: the whole
        write is all or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TagWriteRequest' }
      responses:
        "200":
          description: The write was applied, or every Node already held the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagWriteResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: The Node is not in the registry. Nothing was changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "409":
          description: |
            A tag changed while the write was being made (reload and retry), or
            the write would leave a Node over 64 tags. Nothing was changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/tags:
    post:
      tags: [Tags]
      operationId: writeTags
      summary: Add or remove a tag on a list of Nodes
      description: |
        The same write as `writeNodeTag`, over a list of Node ids the caller
        has already resolved. A Selector is not accepted here: resolve it with
        `list_nodes` or the Console first, so the Nodes written are the Nodes
        the caller saw.
        One write names at most 256 Node ids, duplicates counted; a longer
        list is refused with 400 and nothing is changed.

        **Requires the `operator` role or above, and a human Account.** A
        machine Account is refused at every role, `admin` included, and a
        `viewer` is refused (ADR-0050). No step-up re-authentication is
        needed, because a tag gates nothing. No MCP tool writes a tag.

        Only `tag:` labels are written on request: a `node:`, `relay:` or
        `state:` label is refused with 400, and the `tag:` prefix is mandatory.
        A tag's key and value follow the stored-Label allowlist exactly: the key
        non-empty, and every byte of key and value one of `A-Z a-z 0-9 . _ -`
        (an empty value is allowed). A key is at most 63 characters and a value
        at most 255; a longer one is refused with 400, never truncated. A Node
        carries at most 64 tags.

        Each Node that changes gets one audit record naming the Account, the
        Node and the old and new values, committed in the same transaction as the
        change. A Node already in the requested state is reported in `unchanged`
        and records nothing. If anything cannot be written, nothing is: the whole
        write is all or nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkTagWriteRequest' }
      responses:
        "200":
          description: The write was applied, or every Node already held the requested state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagWriteResult' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404":
          description: A named Node is not in the registry. Nothing was changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "409":
          description: |
            A tag changed while the write was being made (reload and retry), or
            the write would leave a Node over 64 tags. Nothing was changed.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Freeze
  # ---------------------------------------------------------------------------
  /api/v1/freeze/engage:
    post:
      tags: [Freeze]
      operationId: engageFreeze
      summary: Engage the Relay-wide Freeze
      description: |
        Halts **all** new dispatch, every risk class, regardless of who asks
        (ADR-0013). A Policy preflight still answers while frozen, so an operator
        can keep investigating. Deliberately cheap and reason-free: engaging the
        emergency stop must never be the slower path.

        Persisted across Relay restarts.

        **Requires the `operator` role or above, and a human Account.** The
        role floor is ADR-0013's "engage cheap". The human requirement is not
        a role question at all: a machine Account halting the fleet — a
        jailbroken AI-agent switching off its overseers — is a denial of
        service, not a fire alarm, so a machine Account is refused at every
        role including `admin`. Use the host-side lever (a signal on the Relay
        host) for automated engagement.
      responses:
        "200":
          description: The Freeze is engaged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreezeResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/freeze/release:
    post:
      tags: [Freeze]
      operationId: releaseFreeze
      summary: Release the Relay-wide Freeze
      description: |
        Requires a non-empty `reason`, and **the `admin` role**. The asymmetry
        with engage is deliberate (ADR-0013): stopping the fleet is cheap,
        restarting it is a deliberate act that must say why, and the reason
        lands in the audit trail. Unlike engage, release is not human-only —
        an incident must have an automated way back.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReleaseFreezeRequest' }
      responses:
        "200":
          description: The Freeze is released.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FreezeResponse' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/InternalError' }

  # ---------------------------------------------------------------------------
  # Identity — every route below requires the admin role.
  # ---------------------------------------------------------------------------
  /api/v1/accounts:
    post:
      tags: [Identity]
      operationId: createAccount
      summary: Create an Account (admin)
      description: |
        Creates a human or machine Account with a role. Machine Accounts are how
        orchestrators (an AI-agent such as Gleipnir) get an identity whose role
        gates what they may dispatch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountRequest' }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "409":
          description: The name is already taken, or is reserved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500": { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Identity]
      operationId: listAccounts
      summary: List Accounts (admin)
      responses:
        "200":
          description: Every Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    get:
      tags: [Identity]
      operationId: getAccount
      summary: Get one Account (admin)
      responses:
        "200":
          description: The Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/accounts/{id}/role:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      tags: [Identity]
      operationId: setAccountRole
      summary: Change an Account's role (admin)
      description: |
        A token inherits its Account's role at verification time, so a role
        change takes effect immediately for every existing token — no
        re-issuance, no synchronization step.

        Two refusals converge on 409 here (see `AccountConflict`): an admin
        cannot change their **own** role — a lockout guard only, any other
        admin still can — and demoting the **last enabled admin** is refused
        for every caller, which is a real security boundary rather than a
        convenience: the control plane must always keep at least one enabled
        admin Account.

        On this route only, a third 409 is possible: if the Account's role
        changed in the instant between the Relay reading it and writing it,
        nothing is written. Read the Account and retry.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleRequest' }
      responses:
        "200":
          description: The updated Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "409": { $ref: '#/components/responses/AccountConflict' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/accounts/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      tags: [Identity]
      operationId: enableAccount
      summary: Enable an Account (admin)
      responses:
        "200":
          description: The updated Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/accounts/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      tags: [Identity]
      operationId: disableAccount
      summary: Disable an Account (admin)
      description: |
        A disabled Account's live tokens stop working immediately without being
        revoked; re-enabling restores them. Disablement and revocation are
        distinct levers on purpose.

        Two refusals converge on 409 here (see `AccountConflict`): an admin
        cannot disable their own Account (see `setAccountRole`) — a lockout
        guard only — and disabling the **last enabled admin** is refused for
        every caller, a real security boundary: the control plane must always
        keep at least one enabled admin Account.
      responses:
        "200":
          description: The updated Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "409": { $ref: '#/components/responses/AccountConflict' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/accounts/{id}/tokens:
    parameters:
      - $ref: '#/components/parameters/AccountID'
    post:
      tags: [Identity]
      operationId: mintAPIToken
      summary: Mint an API Token for an Account (admin)
      description: |
        The plaintext credential (`glp_<id>.<secret>`) is returned **once,
        here** (in `token` and inside each `harness_setup` block that embeds
        it), and in no other response — only its SHA-256 is stored. It is never
        persisted in the clear, logged, or audited; the audit record keeps the
        token's non-secret id.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintAPITokenRequest' }
      responses:
        "201":
          description: Minted. The only response carrying the plaintext.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintedAPIToken' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Identity]
      operationId: listAPITokens
      summary: List an Account's API Tokens (admin)
      description: |
        The redacted view: no field here can carry a secret or its hash, so
        listing tokens never hands back anything a caller could authenticate
        with or crack offline.
      responses:
        "200":
          description: The Account's tokens, redacted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/APITokenList' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404": { $ref: '#/components/responses/AccountNotFound' }
        "500": { $ref: '#/components/responses/InternalError' }

  /api/v1/api-tokens/{token_id}:
    parameters:
      - name: token_id
        in: path
        required: true
        description: The API Token's non-secret id.
        schema: { type: string }
    delete:
      tags: [Identity]
      operationId: revokeAPIToken
      summary: Revoke an API Token (admin)
      description: |
        Immediate: the next request presenting it is refused. Revoking your own
        token is permitted — it is a normal, sometimes urgent act.
      responses:
        "204":
          description: Revoked.
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/AdminRequired' }
        "404":
          description: No such token.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        "500": { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: |
        An Account API Token (`glp_<id>.<secret>`), presented as
        `Authorization: Bearer <token>`. The token inherits its Account's role
        at verification time.

        Interactive humans may instead authenticate through the OAuth 2.1
        protected-resource flow on the MCP endpoint (ADR-0024); the Relay is a
        resource server and never an authorization server.

  parameters:
    JobID:
      name: id
      in: path
      required: true
      description: The Job id, as returned in `job_id` by a dispatch.
      schema: { type: string }
    AccountID:
      name: id
      in: path
      required: true
      description: The Account id.
      schema: { type: string }
    ApprovalID:
      name: id
      in: path
      required: true
      description: The approval request id, as returned in `request_id` when a dispatch parks.
      schema: { type: string }

  responses:
    BadRequest:
      description: |
        Malformed request — a body not declared `Content-Type: application/json`,
        bad JSON, an unknown field, an invalid Selector, or an invalid Operation
        argument name.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The caller's role is below what this action requires.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AdminRequired:
      description: Identity management requires the `admin` role.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Frozen:
      description: |
        The Relay-wide Freeze is engaged, so all new dispatch is refused
        (ADR-0013). A Policy preflight still answers while frozen.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    GuardrailRejected:
      description: |
        A `422` guardrail refusal on an otherwise well-formed, authorized
        request. There is no machine-readable problem `type`, so a client
        branches on `title` alone, which is stable; `detail` is
        human-readable and is not a contract.

        - `title: "no nodes matched"` — the Selector resolved to zero Nodes.
          It was refused before anything ran, so no Job exists and there is
          no `job_id` to read. It is audited as a refusal (principal,
          Selector, Action). `detail` carries `no_nodes_matched` and the
          Selector in canonical form, so a typo is visible. With
          `plan: true` it is not refused: a `200` `PlanResponse` reports
          `would_be_rejected.reason: no_nodes_matched` (ADR-0011).
        - `title: "blast radius cap exceeded"` — the Selector matched more
          Nodes than the applicable blast-radius cap allows (ADR-0004/0012).
          The request was well-formed and authorized; a guardrail refused it
          before anything ran. Narrow the Selector or split the work into
          batches. The cap is Relay configuration and cannot be raised
          through this API (invariant 11).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    JobNotFound:
      description: No Job with that id. A plan creates no Job, so a plan's action has no id to read.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountNotFound:
      description: No Account with that id.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    AccountConflict:
      description: |
        One of two refusals, both a 409 because both describe a control plane
        that would be left with no way back in:

        - **Self-targeting.** An admin may not change their own role or
          disable their own Account — a lockout guard, not a security
          boundary against every OTHER admin: any other admin can still do
          either.
        - **The last enabled admin.** Demoting or disabling the last enabled
          admin is refused for **every** caller, including another admin —
          this one IS a security boundary: it guarantees the control plane
          always keeps at least one enabled admin Account.

        The role route alone (`setAccountRole`) has a third: **a concurrent
        change** of the Account's role between the Relay reading and writing
        it, with nothing written; read the Account and retry. The enabled
        route never returns it.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PendingApproval:
      description: |
        The dispatch is **parked for approval** (ADR-0027). Nothing was denied
        and nothing ran: a root-owned gate rule requires a human to answer
        first, and no Job or Task was created.

        This is a `2xx` because it is not a failure — the request was accepted
        and is suspended awaiting a decision it may well receive. It is not a
        `200` because nothing executed. A caller re-drives the same request once
        the requirement is satisfied; if the fleet drifted in between, the
        resolved fan-out differs, the plan hash differs, and it parks again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PendingApproval' }
    ApprovalNotFound:
      description: No approval request with that id.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ApprovalNotDecidable:
      description: |
        The credential is fine and the route is the caller's to call — the
        **request's state** refuses the decision: already decided, expired,
        already signed by this Account, self-decided when the rule (or the
        Account being a machine) forbids it, or bound to a different plan hash.

        A `403` would tell an approver to go find a bigger token, which is the
        wrong lesson; `detail` states which rule refused.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: An unexpected server-side failure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Node:
      type: object
      description: |
        One Node's registry record. Every field is either Relay-knowledge or
        Node-reported, never both — see the per-field notes.
      properties:
        node_id: { type: string }
        node_labels:
          type: object
          additionalProperties: { type: string }
          description: |
            The `node:` namespace: set on the machine by config management and
            immutable to the Relay. A compromised Node can forge its own.
        relay_labels:
          type: object
          additionalProperties: { type: string }
          description: |
            The `relay:` namespace: Relay-set and immutable to the Node. The only
            namespace the security lane may target.
        tag_labels:
          type: object
          additionalProperties: { type: string }
          description: |
            The `tag:` namespace: written by a human Account at `operator` or
            above, never by the Node or an AI-agent (ADR-0050). `{}` when a Node
            carries none.
        facts:
          type: object
          description: |
            Self-reported by the daemon. Never a targeting axis — a compromised
            Node can report anything it likes.
          properties:
            hostname: { type: string }
            os: { type: string }
            kernel: { type: string }
            arch: { type: string }
            ip_addresses:
              type: array
              items: { type: string }
        last_seen:
          type: string
          format: date-time
        connected:
          type: boolean
          description: |
            Whether the Node holds a live Tunnel right now. NOT inferable from
            `last_seen`: a Task dispatched to a Node that is not connected
            resolves `unreachable` without being sent.
        enrolling_token_id: { type: string }
        policy_fingerprint:
          type: string
          description: |
            SHA-256 of the Policy the daemon reports having loaded. Report-only:
            the Relay never sets a Node's Policy (ADR-0002).
        template_set_fingerprint:
          type: string
          description: |
            Empty means no templates installed; the literal `unloadable` means
            the Node's template set failed to load and it has no Template
            Operations (fail closed).
        daemon_version: { type: string }
        outdated:
          type: boolean
          description: |
            Derived: the daemon is below the Relay's dispatch minimum, so every
            dispatch to it returns `version_refused` (ADR-0014).
        revoked: { type: boolean }
        revoked_at:
          type: string
          format: date-time
        state_labels:
          type: array
          items: { type: string }
          description: |
            The `state:` namespace (ADR-0034): Relay-derived, evaluated at read
            time, and set by nobody — not the Node, not an operator, not an
            admin. Rendered in Selector syntax with the `state:` prefix (e.g.
            `state:offline`, `state:daemon-version=1.4.2`) and targetable
            verbatim in `RunOperationRequest.selector`/`RawExecRequest.selector`.
            Closed vocabulary. Always an array, `[]` when a Node carries none.
        certificate:
          type: object
          description: |
            The identity the Relay issued. All Relay-knowledge — a daemon cannot
            influence any value here.
          properties:
            recorded:
              type: boolean
              description: |
                **Read this first.** False means the Relay has not recorded this
                Node's certificate provenance, and every other field here is then
                meaningless — NOT an expiry in the past. Nodes that enrolled
                before provenance was stored fill in at their next renewal.
            fingerprint: { type: string }
            not_after:
              type: string
              format: date-time
              description: When this identity stops working. Nothing else warns first.
            enrolled_at:
              type: string
              format: date-time
              description: |
                When the Node FIRST joined. Survives every renewal, so it anchors
                an unbroken provenance chain back to `enrolling_token_id`.
            renewal_count: { type: integer }
            last_renewed_at:
              type: string
              format: date-time

    Problem:
      type: object
      description: RFC 7807 problem detail. Never carries a credential or captured command output.
      required: [status, title]
      properties:
        status:
          type: integer
          description: The HTTP status code, repeated in the body.
        title:
          type: string
          description: A short, stable summary of the problem class.
        detail:
          type: string
          description: Human-readable specifics, safe to disclose to the caller.

    RiskClass:
      type: string
      enum: [read, mutate]
      description: |
        Chooses the blast-radius cap (ADR-0012). It is NEVER an authorization
        input — the role floor is chosen by action kind, or a `read`-class Raw
        Exec would authorize as though it were a structured read.

    Outcome:
      type: string
      enum:
        - success
        - failure
        - timeout
        - denied_by_policy
        - cancelled
        - unreachable
        - version_refused
        - unsupported
        - unspecified
      description: |
        A Task's terminal state, and the authoritative answer to "did this run".
        `denied_by_policy` is the Node's live Policy engine refusing;
        `unreachable` is an offline Node (never dispatched, ADR-0004);
        `version_refused` is the Relay's minimum-daemon-version gate (ADR-0014);
        `unsupported` is a name outside that Node's vocabulary (ADR-0021).

    Verdict:
      type: string
      enum: [allow, deny, unsupported, unknown]
      description: |
        A plan-mode per-Node verdict from that Node's live Policy engine
        (ADR-0011). `unknown` means the Node is offline and was not asked — the
        Relay never guesses a verdict from a cached snapshot.

    RunOperationRequest:
      type: object
      required: [operation]
      properties:
        selector:
          type: string
          description: |
            Selector filter, e.g. `node:role=web` or `tag:env=prod`. Every term
            must carry a `node:`, `relay:`, `tag:` or `state:` prefix. `state:`
            is a closed, Relay-derived vocabulary (ADR-0034): the boolean
            markers `state:offline`, `state:outdated`, `state:template-unloadable`,
            `state:cert-expiring`, and the facts `state:daemon-version=`,
            `state:policy-fingerprint=`, `state:template-fingerprint=` — any
            other `state:` key is a parse error, not an empty match. Empty or
            omitted matches every Node — subject to the blast cap.
          examples: ["node:role=web"]
        operation:
          type: string
          description: The Operation name.
          examples: ["service.restart"]
        args:
          type: object
          additionalProperties: { type: string }
          description: |
            Named Operation arguments. Names are validated against the
            Operation's published constraints before dispatch; an unknown or
            missing-required name is a `400`, never a Policy denial. Values are
            the daemon's to accept or refuse.
          examples: [{ unit: "nginx" }]
        timeout_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
          description: Per-Task timeout. 0 or omitted uses the daemon/engine default.
        plan:
          type: boolean
          description: Preview per-Node verdicts without executing (ADR-0011).

    RawExecRequest:
      type: object
      required: [argv]
      properties:
        selector:
          type: string
          description: See `RunOperationRequest.selector`.
        argv:
          type: array
          minItems: 1
          items: { type: string }
          description: |
            Executed verbatim on each matched Node — no shell, no client-side
            splitting (ADR-0001).
          examples: [["/usr/bin/systemctl", "status", "nginx"]]
        timeout_seconds:
          type: integer
          format: int32
          minimum: 0
          maximum: 86400
        plan:
          type: boolean

    PerNodeResult:
      type: object
      required: [node_id, outcome, duration_ms]
      properties:
        node_id: { type: string }
        outcome: { $ref: '#/components/schemas/Outcome' }
        exit_code:
          type: integer
          format: int32
          description: |
            **Present only when a process really ran and exited with a status.**
            A Task that never executed (`denied_by_policy`, `unreachable`,
            `version_refused`) or was killed without one (`timeout`,
            `cancelled`, spawn failure) has no `exit_code` key at all — reading
            an absent code as `0` would turn "did not run" into "succeeded".
            `outcome` is the authoritative state. A Task whose daemon report
            the Relay refused as a protocol violation also has no `exit_code`
            key and is neither of those: it may well have executed, and what
            actually happened is unknown — `stderr` on that row is
            Relay-authored, not the daemon's own bytes.
        stdout: { type: string }
        stderr: { type: string }
        stdout_truncated:
          type: boolean
          description: Output exceeded the render cap and was truncated.
        stderr_truncated: { type: boolean }
        duration_ms:
          type: integer
          format: int64
          description: 0 when the Task was never dispatched, never a fabricated value.
        refusal_explanation:
          type: string
          description: |
            Relay-authored explanation of which boundary refused this Task and what
            this control plane can and cannot change about it. Present when a named
            boundary refused the Task and nothing executed (`denied_by_policy`,
            `version_refused`); absent otherwise — absence means "no boundary
            refusal", not "succeeded". `outcome` remains authoritative.
            It explains the boundary, never the specific rule: on a
            `denied_by_policy` row `stderr` carries the Node's own verbatim reason
            and this field carries the Relay's framing — two different authors. On a
            `version_refused` row the Relay authored both and this repeats `stderr`.
            Byte-identical to the MCP surface's field (ADR-0009/0010).
            This field is keyed on `outcome`. For `denied_by_policy`, `outcome`
            on this (apply) path is the Node's own self-reported value — so
            its lead clause ("nothing executed") is only as trustworthy as
            `outcome`/`stderr` already are on this same row, not a new
            guarantee; the boundary text it is built from (no code path to
            write Policy, no caller identity on the wire) holds unconditionally
            regardless of what any Node reports. From #632 onward, `unreachable`
            and `version_refused` are Relay-authored on every path: a daemon
            reporting either is refused at the wire boundary and recorded as
            `failure` instead, so a `version_refused` row's "the Task was
            never sent" is always this control plane's own claim, never a
            Node's. A `version_refused` row a pre-#632 Relay already persisted
            against this same store predates that boundary and is not covered
            by this guarantee.

    ExecutionResponse:
      type: object
      required: [results]
      properties:
        job_id:
          type: string
          description: |
            **Present on every completed dispatch.** A plan (`PlanResponse`)
            carries none. A Selector matching no Nodes never produces this
            response: it is refused with `422` `no nodes matched` and
            creates no Job.
        results:
          type: array
          items: { $ref: '#/components/schemas/PerNodeResult' }
          description: One entry per matched Node, sorted by `node_id`. Always an array, never null.
        halt:
          $ref: '#/components/schemas/JobHalt'
          description: |
            Present only when a mutate Job halted on its first failure or
            timeout (execution.md, Halting a failing mutation); a read Job
            never halts. Tasks not yet sent resolve `cancelled` with `reason`
            as their `stderr`; Tasks already in flight report their own
            outcomes.

    JobHalt:
      type: object
      required: [node_id, outcome, resolved, reason]
      properties:
        node_id:
          type: string
          description: The Node whose Task's outcome halted the Job.
        outcome:
          type: string
          enum: [failure, timeout]
        resolved:
          type: boolean
          description: |
            True when `outcome` is the Task's recorded result. False when the
            engine reported this outcome with no recorded result; the Task's
            real outcome may still arrive.
        reason:
          type: string
          description: Relay-authored. Also the `stderr` of every Task the halt left unsent.

    PerNodeVerdict:
      type: object
      required: [node_id, verdict]
      properties:
        node_id: { type: string }
        verdict: { $ref: '#/components/schemas/Verdict' }
        deciding_rule:
          type: string
          description: The Policy rule text behind a deny, verbatim from the daemon's engine.
        pass:
          type: string
          enum: [precondition, deny, guard, allow, default]
          description: |
            The pass of the daemon's Policy evaluation that produced the verdict,
            verbatim from the daemon and never evaluated by the Relay. Also absent
            when the answering daemon does not report it (a daemon older than this
            field), so absence is not "no rule decided": only `default` says
            deny-by-default.
        rule_section:
          type: string
          enum: [operation, deny, raw_exec_allow, raw_exec_deny]
          description: |
            The section of the Node's Policy file holding the rule that decided.
            Present only when a rule decided; with `rule_index` and `rule_line` it
            is the reference `relay-daemon policy explain` prints. Verbatim from
            the daemon and never evaluated by the Relay. Also absent when the
            answering daemon does not report it, so absence is not "no rule decided".
        rule_index:
          type: integer
          minimum: 0
          description: The deciding rule's index within `rule_section`. Present only with `rule_section`; the daemon's answer, verbatim.
        rule_line:
          type: integer
          minimum: 1
          description: The deciding rule's 1-based line in the Policy file. Absent when the daemon did not know the line; the daemon's answer, verbatim.
        matched_on:
          type: string
          description: What the deciding pass matched on, in the daemon's words. Positions and indices only, never an argument value; verbatim from the daemon.
        reason: { type: string }
        refusal_explanation:
          type: string
          description: |
            Relay-authored explanation of the boundary that would refuse this
            verdict. Present only on `verdict=deny`; nothing would be dispatched.
            `deciding_rule` remains the daemon's rule text, verbatim — keeping it
            true is the point of this separate field. Byte-identical to the MCP
            surface's field (ADR-0009/0010).
            This field is keyed on `verdict`, itself the Node's own live answer
            to a plan-mode Policy query — the same trust boundary `deciding_rule`
            already carries, not a new one.
        outdated:
          type: boolean
          description: The Node's relay-daemon is below the Relay's minimum version (ADR-0014).

    WouldBeRejected:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [exceeds_cap, frozen, no_nodes_matched]
          description: |
            Only `exceeds_cap` carries `matched`/`cap`/`class`. `frozen` and
            `no_nodes_matched` carry neither — the Freeze is Relay-wide, and
            the zero count is already the top-level `matched`.
            `no_nodes_matched` is what a real run would refuse with `422`
            `no nodes matched`.
        matched: { type: integer }
        cap: { type: integer }
        class: { $ref: '#/components/schemas/RiskClass' }

    PlanResponse:
      type: object
      required: [matched, verdicts, advisory]
      properties:
        matched:
          type: integer
          description: How many Nodes the Selector resolved to.
        verdicts:
          type: array
          items: { $ref: '#/components/schemas/PerNodeVerdict' }
          description: Sorted by `node_id`. Empty when the plan would be rejected before any Node was asked.
        would_be_rejected:
          $ref: '#/components/schemas/WouldBeRejected'
        advisory:
          type: string
          description: |
            A fixed point-in-time disclaimer. A plan's verdicts are a snapshot,
            not a guarantee: Policy may change between the plan and a real run.

    JobResponse:
      type: object
      required: [job_id, results]
      properties:
        job_id: { type: string }
        created_at: { type: string, format: date-time }
        results:
          type: array
          items: { $ref: '#/components/schemas/PerNodeResult' }
        halt:
          $ref: '#/components/schemas/JobHalt'
          description: |
            Present only when a mutate Job halted on its first failure or
            timeout (execution.md, Halting a failing mutation); a read Job
            never halts. Tasks not yet sent resolve `cancelled` with `reason`
            as their `stderr`; Tasks already in flight report their own
            outcomes.

    CancelledJob:
      type: object
      required: [job_id]
      properties:
        job_id: { type: string }

    MintEnrollmentTokenRequest:
      type: object
      required: [ttl_seconds]
      properties:
        initial_tags:
          type: array
          maxItems: 64
          items: { type: string }
          description: |
            Zero or more tags written as the first tags of every Node enrolling
            with this token, each in the form `tag:key=value`. The key is at most
            63 bytes and the value at most 255, every byte in `[A-Za-z0-9._-]`;
            a key may be named once. A violating entry is refused with `400` and
            never sanitised, and a `relay:` label is refused with `400` naming
            it. A machine Account naming any tag is refused with `403`.
          examples: [["tag:env=prod"]]
        ttl_seconds:
          type: integer
          format: int64
          description: Lifetime in seconds. Greater than 0 and at most one year (31536000).
        max_uses:
          type: integer
          description: |
            The number of Nodes the token may enroll: a positive integer.
            Required unless `unlimited` is `true`, and omitted or 0 when it is.
            A negative value is refused with `400`.
        unlimited:
          type: boolean
          description: |
            Asks explicitly for unlimited use within the TTL. Exclusive with a
            positive `max_uses`. A mint naming neither is refused with `400`;
            `max_uses: 0` on its own does not mean unlimited.

    MintedEnrollmentToken:
      type: object
      required: [id, token, join_string, initial_tags, expires_at, max_uses, unlimited]
      properties:
        id:
          type: string
          description: The token's non-secret id, used to revoke it.
        token:
          type: string
          description: The plaintext credential — returned once, here, and never again.
        join_string:
          type: string
          description: |
            A `glp_join_`-prefixed join string carrying the advertised
            node-plane address, the CA fingerprint (SHA-256 over the CA
            certificate DER) and this token (ADR-0031). It is a secret,
            returned once, here, and never again.
        initial_tags:
          type: array
          items: { type: string }
          description: The initial tags the token writes, as minted; an empty array when it names none.
        expires_at: { type: string, format: date-time }
        max_uses:
          type: integer
          description: The token's use limit; 0 when `unlimited` is `true`.
        unlimited:
          type: boolean
          description: Whether the token has no use limit within its TTL.

    TagWriteRequest:
      type: object
      required: [op, label]
      properties:
        op:
          type: string
          enum: [add, remove]
          description: '`add` sets the tag; `remove` removes it.'
        label:
          type: string
          description: |
            The tag in written form, with the mandatory `tag:` prefix:
            `tag:key=value` to add, `tag:key` (no value) to remove.
          examples: ["tag:team=payments"]

    BulkTagWriteRequest:
      type: object
      required: [node_ids, op, label]
      properties:
        node_ids:
          type: array
          minItems: 1
          maxItems: 256
          items: { type: string }
          description: |
            The Node ids to write, already resolved by the caller, at most 256.
            Duplicates are written once.
        op:
          type: string
          enum: [add, remove]
          description: '`add` sets the tag; `remove` removes it.'
        label:
          type: string
          description: |
            The tag in written form, with the mandatory `tag:` prefix:
            `tag:key=value` to add, `tag:key` (no value) to remove.
          examples: ["tag:team=payments"]

    TagWriteResult:
      type: object
      required: [changed, unchanged]
      properties:
        changed:
          type: array
          items: { $ref: '#/components/schemas/TagChange' }
          description: One entry per Node whose tag changed. `[]` when none did.
        unchanged:
          type: array
          items: { type: string }
          description: |
            Ids of Nodes that already held the requested state, which recorded
            nothing. `[]` when none did.

    TagChange:
      type: object
      required: [node_id, label, old, new]
      properties:
        node_id: { type: string }
        label:
          type: string
          description: The tag's key with the `tag:` prefix.
        old:
          type: [string, "null"]
          description: The value before, or null when the Node did not carry the tag.
        new:
          type: [string, "null"]
          description: The value after, or null when the tag was removed.

    RevokeNodeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          description: |
            Why this Node is being revoked. Recorded in the audit trail and
            shown on the Node's detail screen.

            Trimmed of surrounding whitespace, then required to be non-empty,
            at most 512 **bytes**, valid UTF-8, and free of control, bidi and
            zero-width characters. Anything else is a 400.

            `minLength`/`maxLength` are deliberately NOT declared here: the
            server bounds bytes while JSON Schema counts characters, so a
            machine-readable `maxLength: 512` would call a 200-character CJK
            reason valid and then be refused, and a `minLength: 1` would do the
            same for `"   "`. An approximate constraint a generated client
            enforces is worse than none, because it disagrees with the server
            in the direction that says yes.

            The reason is readable by any `viewer` on the Activity screen and in
            its CSV export: do not put a credential, token or private key in it.

    ReleaseFreezeRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          description: Why the fleet is being un-frozen. Recorded in the audit trail.

    FreezeResponse:
      type: object
      required: [engaged]
      properties:
        engaged: { type: boolean }

    Account:
      type: object
      required: [id, name, kind, role, enabled, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin]
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }

    CreateAccountRequest:
      type: object
      required: [name, kind, role]
      properties:
        name: { type: string }
        kind:
          type: string
          enum: [human, machine]
        role:
          type: string
          enum: [viewer, operator, admin]

    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [viewer, operator, admin]

    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/Account' }

    APIToken:
      type: object
      description: The redacted view of a stored API Token — no secret, no hash.
      required: [id, account_id, name, created_at, revoked]
      properties:
        id: { type: string }
        account_id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time }
        revoked: { type: boolean }

    MintAPITokenRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 128
          description: An operator-facing label, echoed into audit reasons.
        ttl_seconds:
          type: integer
          format: int64
          description: Omitted or null means no expiry.

    MintedAPIToken:
      type: object
      required: [api_token, token]
      properties:
        api_token: { $ref: '#/components/schemas/APIToken' }
        token:
          type: string
          description: The plaintext credential — returned once, here, and never again.
        harness_setup:
          $ref: '#/components/schemas/HarnessSetup'

    HarnessSetup:
      type: object
      description: |
        What a Harness needs to reach this Relay's MCP endpoint, rendered at mint
        beside the plaintext. Present when the Relay can render it, which it can
        whenever its control plane is serving; absent otherwise. A failure to render
        never fails the mint.
      required: [mcp_url, ca_certificate, claude_code, claude_code_mcp_json, check]
      properties:
        mcp_url:
          type: string
          description: The Relay's MCP endpoint; its host is a name on the server certificate.
        ca_certificate:
          type: string
          description: The Relay CA certificate (PEM). Public; save it as `relay-ca.pem`.
        claude_code:
          type: string
          description: The `claude mcp add` line and the line that trusts the CA for one `claude` process (with a comment saying why). Embeds the plaintext credential.
        claude_code_mcp_json:
          type: string
          description: The equivalent `.mcp.json` file. Embeds the plaintext credential.
        gleipnir:
          type: string
          description: The values to register Relay in Gleipnir. Present for a machine Account only. Embeds the plaintext credential.
        check:
          type: string
          description: One command that proves the connection works; its output contains `serverInfo`. Embeds the plaintext credential.

    APITokenList:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items: { $ref: '#/components/schemas/APIToken' }

    ApprovalDecision:
      type: object
      description: One recorded answer to a parked dispatch (ADR-0027).
      required: [account, approve, channel, human, at]
      properties:
        account:
          type: string
          description: The deciding Account's name — the verified lane.
        account_id: { type: string }
        approve:
          type: boolean
          description: false is a denial, and one denial is terminal.
        reason: { type: string }
        channel:
          type: string
          enum: [in-band, out-of-band, unspecified]
          description: |
            How the answer arrived. `in-band` means it came back over the same
            session that requested the action, so it is only as trustworthy as
            the harness; `out-of-band` means it landed on an authenticated Relay
            endpoint. In-band is an assumption about the client; out-of-band is
            evidence. Every decision made through this API is `out-of-band`.
        human:
          type: boolean
          description: |
            Whether a human Account answered. The second approver of a `count: 2`
            request is entitled to know what kind of signature is already on it.
        at: { type: string, format: date-time }

    Approval:
      type: object
      description: |
        A parked dispatch and everything decided about it so far.

        `summary` is **Relay-authored**: the requesting agent chose the Action,
        but not one word a human reads about it. Render this text — a client
        that re-derives its own description from the fields around it
        reintroduces the approval-view fidelity gap this design closes.
      required:
        [request_id, state, plan_hash, summary, action_kind, risk_class,
         requested_by, matched_rules, required_count, requester_allowed,
         channel, progress, decisions, created_at, expires_at]
      properties:
        request_id: { type: string }
        state:
          type: string
          enum: [pending, approved, denied, expired]
          description: Every terminal state is final; there is no path back to pending.
        plan_hash:
          type: string
          description: |
            Content-addresses the Operation, its arguments, and the RESOLVED
            fan-out. A decision must cite it, and a dispatch is released only
            against an exact match — which is what makes registry drift re-park
            automatically rather than run against a fleet the approver never saw.
        summary: { type: string }
        action_kind:
          type: string
          enum: [operation, raw_exec, unspecified]
          description: |
            What is being released. It is what the decision's role floor is
            computed from — approving a `raw_exec` needs `admin`, the same role
            it needed to be requested.
        risk_class:
          type: string
          enum: [read, mutate, unspecified]
        requested_by:
          type: string
          description: The verified requester. `requester_allowed` is evaluated against it.
        requested_by_id: { type: string }
        matched_rules:
          type: array
          items: { type: string }
          description: |
            Which gate rules parked this dispatch — the answer to "why am I being
            asked?". A gate that cannot explain itself trains operators to
            disable it.
        required_count:
          type: integer
          description: Distinct approvals needed. Quorum means distinct Accounts.
        audience:
          type: array
          items: { type: string }
          description: Account names that may decide. Absent means unrestricted.
        requester_allowed: { type: boolean }
        channel:
          type: string
          enum: [in-band, out-of-band, unspecified]
          description: The minimum channel strength a decision must arrive over.
        progress:
          type: string
          description: Partial quorum, rendered for a human ("1 of 2").
        decisions:
          type: array
          items: { $ref: '#/components/schemas/ApprovalDecision' }
        job_id:
          type: string
          description: |
            The Job this approval released, bound after the dispatch actually
            ran. Absent while pending — a parked dispatch creates no Job.
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: |
            Parked requests and granted approvals both stop being redeemable
            here. Enforced by the clock at read time, so it holds even if the
            expiry sweeper is not running.
        resolved_at: { type: string, format: date-time }

    ApprovalList:
      type: object
      required: [approvals]
      properties:
        approvals:
          type: array
          items: { $ref: '#/components/schemas/Approval' }

    ApprovalDecisionRequest:
      type: object
      required: [approve, plan_hash]
      properties:
        approve:
          type: boolean
          description: true approves, false denies. A denial is terminal.
        plan_hash:
          type: string
          description: |
            The plan hash from the approval request. Required — a decision binds
            to the dispatch it was shown, never to "the request" in the abstract.
        reason:
          type: string
          maxLength: 1024
          description: The decider's note, recorded in the audit trail.

    PendingApproval:
      type: object
      description: |
        A dispatch that parked instead of running. It carries no `job_id` and no
        `results` field at all — a parked dispatch creates no Job, so there is
        nothing to poll and nothing to read back.
      required: [status, request_id, plan_hash, summary, matched_rules, progress, expires_at, decision_path]
      properties:
        status:
          type: string
          const: pending_approval
          description: A stable constant to branch on, rather than the absence of other fields.
        request_id: { type: string }
        plan_hash: { type: string }
        summary:
          type: string
          description: The Relay-authored description of what is waiting.
        matched_rules:
          type: array
          items: { type: string }
        progress:
          type: string
          description: Partial quorum ("0 of 2").
        expires_at: { type: string, format: date-time }
        decision_path:
          type: string
          description: |
            Where an approver answers. A convenience for building a link, never
            a capability — following it still requires an Account credential the
            requesting session does not hold.
