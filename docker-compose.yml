# Relay dev fleet — DEV-ONLY (docs/dev-fleet.md).
#
# One `relay` container plus three `relay-daemon` containers by default (nine
# under `--profile demo`, see below) that auto-enroll over CA-pinned mTLS and
# are drivable through the control plane (MCP + /api/v1). This is a laptop
# demo / dogfooding environment; it makes NO production posture claims.
# Docker is never a CI dependency — this file only affects `docker compose`,
# not `make build/test/lint`.
#
# The `demo` compose profile (#452) adds six more daemons, `daemon-4..9`, for
# a fleet-scale stage demo — varied `node:` labels, a third Policy fixture,
# and a fan-out that returns `success` beside `denied_by_policy`. It is
# strictly additive: every one of the six carries `profiles: ["demo"]`, so a
# plain `docker compose up` still means exactly what it means today, and
# nothing above `daemon-3` is touched. See "The demo profile" in
# docs/dev-fleet.md.
#
# Startup order:
#   relay (healthy) -> credential (mints the control-plane credential with
#   `relay bootstrap-token`) -> approver (creates the dev-approver Account that
#   the approval gate names as its audience) + bootstrap (mints a relay:
#   Enrollment Token + exports the public CA cert) -> daemon-1..3 (enroll, then
#   go healthy); daemon-4..9 join them the same way under `--profile demo`.

# All nine daemon services are byte-identical except for their per-Node
# environment, their private state volume, and — for `daemon-4..9`, the
# `demo` profile's Nodes — their `profiles:` key. This anchor factors out
# ONLY the non-mapping fields they share. NOTE: the YAML merge key `<<`
# REPLACES a mapping wholesale (it does not deep-merge), so each daemon's
# `environment:` and `volumes:` are written inline below — they must never
# live in this anchor.
x-daemon-base: &daemon-base
  build:
    context: .
    dockerfile: docker/daemon.Dockerfile
  restart: unless-stopped
  depends_on:
    bootstrap:
      # Daemons start only after the token + CA cert exist on the shared volume.
      condition: service_completed_successfully
  healthcheck:
    # The daemon writes the `node_id` file only after a successful enrollment
    # (identity.persist_identity), so this gates health on enrollment success.
    #
    # Deliberately NOT extended to also probe the dev-fleet demo service
    # (#389): gating container health on that fixture would make a Node look
    # broken exactly when #622 injects the fault it exists to demonstrate. A
    # down demo service is observed through `dev-fleet-service status`, never
    # through `docker compose ps`.
    test: ["CMD", "test", "-f", "/var/lib/relay-daemon/node_id"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  relay:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    restart: unless-stopped
    environment:
      # Node-plane gRPC listener (relay-daemon dial-home).
      RELAY_ADDR: ":7654"
      # Control-plane HTTPS listener (MCP + /api/v1) — the #154 execution flip is
      # ON because the control plane is enabled. Distinct port from the node
      # plane: listener separation.
      RELAY_CONTROL_ENABLED: "true"
      RELAY_CONTROL_ADDR: ":9443"
      # Server cert SAN = the in-fleet DNS name daemons and bootstrap dial, so
      # mTLS verification succeeds without any insecure flag inside the fleet.
      RELAY_HOSTNAME: "relay"
      RELAY_CA_DIR: "/var/lib/relay/ca"
      RELAY_STORE_PATH: "/var/lib/relay/store/relay.db"
      # The approval gate (ADR-0027), baked into the image root-owned 0644 —
      # Relay CONFIGURATION, not a runtime object, so no Account of any role can
      # loosen it through the API (invariant 11). It parks fleet-wide mutates
      # (fan-out >= 2) and every Raw Exec; a single-Node mutate still runs
      # straight through, so the fleet exercises BOTH paths. Loading it is
      # fail-closed: a malformed file fails startup rather than silently
      # meaning "nothing needs approval".
      #
      # DEV_FLEET_APPROVAL_GATE_CONFIG picks WHICH baked-in gate file, and
      # nothing else: both candidates are in the image, root-owned 0644. Unset,
      # it is the dev gate above (out-of-band, `dev-approver` only). Only
      # scripts/demo-fleet.sh sets it, to the demo fleet's in-band gate
      # (docker/fixtures/approval-gates.demo.json). A path that is not in the
      # image fails startup, like any other unloadable gate file.
      RELAY_APPROVAL_GATE_CONFIG: "${DEV_FLEET_APPROVAL_GATE_CONFIG:-/etc/relay/approval-gates.json}"
      # The Admin Console (ADR-0009), served on the SAME control-plane listener
      # as MCP and /api/v1 — no new listener and no new auth path (invariant
      # 10). Browser sessions are one of the authenticator's credential lanes,
      # beside API Tokens and OAuth, rather than the Console authenticating its
      # own requests.
      #
      # Its TLS is the control plane's TLS, which is the point of the hard
      # prerequisite in the Console specs: both listeners share one server
      # certificate (ADR-0031), so the Console's own reachability rides on that
      # certificate rotating. #446 fixed the rotation; this fleet is where you
      # would notice if it regressed.
      RELAY_CONSOLE_ENABLED: "true"
    ports:
      # Distinct published host ports: node plane vs control plane, each bound
      # to 127.0.0.1 (loopback) by default and each opted out of it separately.
      # Nothing inside the fleet uses these host ports; daemons and bootstrap
      # dial the compose DNS name `relay` over the private network.
      #
      # RELAY_PUBLISH_ADDR publishes the CONTROL plane (MCP, /api/v1, the
      # Console) — what a client on another host needs. It is an execution
      # surface, so anything but loopback makes it network-reachable RCE for
      # whoever holds a credential or the Console password. The
      # console-password service refuses to set the committed default password
      # when this is not loopback, so an exposed fleet needs a real
      # CONSOLE_ADMIN_PASSWORD or its Console cannot be signed in to.
      #
      # RELAY_NODE_PUBLISH_ADDR publishes the NODE plane, needed only by a
      # relay-daemon running outside this compose project. Leave it on loopback
      # unless you have one.
      - "${RELAY_NODE_PUBLISH_ADDR:-127.0.0.1}:7654:7654"
      - "${RELAY_PUBLISH_ADDR:-127.0.0.1}:9443:9443"
    volumes:
      # CA state (ca-cert.pem + ca-key.pem) and the SQLite store persist here, so
      # `compose down` / `up` keeps the same Node identities and audit trail.
      - relay-data:/var/lib/relay
    healthcheck:
      # A full TLS 1.3 handshake with each listener, verified against the
      # Relay's CA and the `relay` SAN, then a clean close. A raw TCP connect
      # (the old nc probe) left a "TLS handshake error ... EOF" in the Relay log
      # every interval. The node plane is gRPC, which requires ALPN h2.
      test:
        - "CMD"
        - "sh"
        - "-c"
        - >-
          for p in 7654:h2 9443:http/1.1; do
          openssl s_client -quiet -no_ign_eof -tls1_3
          -connect 127.0.0.1:$${p%%:*} -servername relay -verify_hostname relay
          -CAfile /var/lib/relay/ca/ca-cert.pem -verify_return_error
          -alpn $${p#*:} </dev/null >/dev/null 2>&1 || exit 1; done
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # One-shot: mints the founding admin's control-plane credential with
  # `relay bootstrap-token` (ADR-0023) and writes it to the shared volume.
  #
  # There is no committed credential fixture any more: since #298 the control
  # plane accepts only per-Account API Tokens, and the first one is minted
  # locally against the Relay's own store. This service uses the relay image
  # because it needs that binary, and mounts relay-data READ-WRITE because
  # minting is a store write — the only service other than the Relay itself
  # that does.
  credential:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
    entrypoint: ["sh", "/mint-credential.sh"]
    volumes:
      - ./docker/mint-credential.sh:/mint-credential.sh:ro
      - relay-data:/var/lib/relay
      # Its OWN volume, deliberately NOT bootstrap-shared: that one is mounted
      # by every daemon, and a control-plane admin credential readable by every
      # Node is exactly the shape a compromised Node would exploit. Only the
      # minting service and the bootstrap service see this one.
      - control-credential:/credential

  # One-shot: creates the `dev-approver` human Account and mints its credential
  # (docker/mint-approver.sh).
  #
  # The dev gate leaves `requester_allowed` unset — the strict default — so the
  # Account that requests a parked dispatch may NOT approve it. Without a second
  # Account the fleet could park a dispatch and never release it. This is the
  # human half of that pair, and its credential deliberately lands on the
  # control-credential volume that daemons never mount. (The demo fleet's gate,
  # selected by scripts/demo-fleet.sh, names no audience, so dev-approver is
  # one Account among several that may decide there — still created, still
  # usable.)
  approver:
    image: curlimages/curl:8.11.1
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
      credential:
        condition: service_completed_successfully
    entrypoint: ["sh", "/mint-approver.sh"]
    volumes:
      - ./docker/mint-approver.sh:/mint-approver.sh:ro
      # Read-only, and only for the PUBLIC ca-cert.pem it pins its API calls to.
      - relay-data:/relay-data:ro
      - control-credential:/credential

  # One-shot: creates the human Account that signs in to the Admin Console.
  #
  # A DISTINCT Account from `dev-approver` and from the founding admin, because
  # the Console is a per-human identity (ADR-0009) and a shared "the admin
  # account" is exactly the attribution hole the audit trail exists to close —
  # every act in the Console is attributed to the person who did it.
  console-admin:
    image: curlimages/curl:8.11.1
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
      credential:
        condition: service_completed_successfully
    environment:
      CONSOLE_ADMIN_NAME: "${CONSOLE_ADMIN_NAME:-admin}"
    entrypoint: ["sh", "/console-admin.sh"]
    volumes:
      - ./docker/console-admin.sh:/console-admin.sh:ro
      # Read-only, and only for the PUBLIC ca-cert.pem it pins its API calls to.
      - relay-data:/relay-data:ro
      - control-credential:/credential:ro

  # One-shot: sets that Account's Console sign-in password.
  #
  # Separate from console-admin because the two acts have different authorities:
  # creating an Account is a control-plane request carrying a bearer token, and
  # setting the first Console password is local root on the Relay's own store
  # (there is no API for it — reaching the Console requires a password, so the
  # first one cannot be set through the Console). This service therefore mounts
  # relay-data READ-WRITE and holds no credential at all, and its sibling holds
  # the credential and no store access.
  #
  # The Relay refuses a password shorter than 12 bytes. The Console's throttle
  # has no hard lockout by design (spec 12), so an attacker gets slow unlimited
  # attempts in front of a fleet-execution surface, and length is the only thing
  # that makes that safe.
  console-password:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    user: "0:0"
    restart: "no"
    depends_on:
      console-admin:
        condition: service_completed_successfully
    environment:
      CONSOLE_ADMIN_NAME: "${CONSOLE_ADMIN_NAME:-admin}"
      CONSOLE_ADMIN_PASSWORD: "${CONSOLE_ADMIN_PASSWORD:-admin1234567}"
      # So the script can refuse the committed default password once the
      # control plane is published beyond loopback (docker/console-password.sh).
      RELAY_PUBLISH_ADDR: "${RELAY_PUBLISH_ADDR:-127.0.0.1}"
    entrypoint: ["sh", "/console-password.sh"]
    volumes:
      - ./docker/console-password.sh:/console-password.sh:ro
      - relay-data:/var/lib/relay

  # One-shot: mints the Enrollment Token and exports the public CA cert, then
  # exits. Runs as root (0:0) so it can read the root-owned CA volume and write
  # the shared bootstrap volume. See docker/bootstrap.sh for the security notes
  # (relay:-scoped token; daemons receive ONLY ca-cert.pem, never ca-key.pem).
  bootstrap:
    image: curlimages/curl:8.11.1
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
      credential:
        condition: service_completed_successfully
    entrypoint: ["sh", "/bootstrap.sh"]
    volumes:
      - ./docker/bootstrap.sh:/bootstrap.sh:ro
      - relay-data:/relay-data:ro
      - control-credential:/credential:ro
      - bootstrap-shared:/bootstrap

  # daemon-1 and daemon-2 are the `role=web` Nodes: docker/daemon-entrypoint.sh
  # starts the dev-fleet demo service (#389) on each. It binds 127.0.0.1:8080
  # INSIDE its own container only — deliberately not published as a compose
  # `ports:` mapping, so only that Node's own Tasks (via Raw Exec, or
  # `service.restart` through the entrypoint's DEV-ONLY systemctl shim) ever
  # reach it.
  daemon-1:
    <<: *daemon-base
    # Sets the container's kernel hostname, which gather_facts() reads as the
    # authoritative Facts.hostname source (issue #188). The HOSTNAME env var
    # below is now only an explicit fallback for an unreadable /proc.
    hostname: "dev-node-1"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-1"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      # Private per-Node state volume => stable identity across down/up, no
      # re-enrollment storm.
      - daemon1-state:/var/lib/relay-daemon

  daemon-2:
    <<: *daemon-base
    hostname: "dev-node-2"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-2"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon2-state:/var/lib/relay-daemon

  # role=db deliberately diverges from daemon-1/daemon-2: it runs no demo
  # service and its Policy (policy.db.toml) omits the dev-fleet-service
  # raw-exec allow, so deny-by-default refuses the repair here and a
  # fleet-wide Raw Exec returns `success` beside `denied_by_policy` (#389).
  daemon-3:
    <<: *daemon-base
    hostname: "dev-node-3"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.db.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-3"
      RELAY_NODE_LABELS: "role=db"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon3-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-4 is `role=web, env=prod`: demo
  # service + policy.web.toml, exactly like daemon-1/daemon-2.
  daemon-4:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-4"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-4"
      RELAY_NODE_LABELS: "role=web,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon4-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-5 is `role=web, env=prod`: demo
  # service + policy.web.toml, exactly like daemon-1/daemon-2/daemon-4.
  daemon-5:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-5"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-5"
      RELAY_NODE_LABELS: "role=web,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon5-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-6 is `role=web, env=staging`: demo
  # service + policy.web.toml, the same Policy as daemon-1/2/4/5 with a
  # different `env` label.
  daemon-6:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-6"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-6"
      RELAY_NODE_LABELS: "role=web,env=staging"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon6-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-7 is `role=db, env=prod`: no demo
  # service, policy.db.toml, exactly like daemon-3 with an added `env` label.
  daemon-7:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-7"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.db.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-7"
      RELAY_NODE_LABELS: "role=db,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon7-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-8 is `role=bastion, env=prod` — THE
  # NARROW NODE the demo's refusal beat depends on: no demo service, and
  # policy.bastion.toml, the strictly-narrowest fixture (exactly one
  # `file.read` path, no `service.restart`, no `[raw_exec]` section at all).
  daemon-8:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-8"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.bastion.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-8"
      RELAY_NODE_LABELS: "role=bastion,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon8-state:/var/lib/relay-daemon

  # `demo` profile only (#452). daemon-9 is `role=web, env=staging`: demo
  # service + policy.web.toml, the same shape as daemon-6.
  daemon-9:
    <<: *daemon-base
    profiles: ["demo"]
    hostname: "dev-node-9"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-9"
      RELAY_NODE_LABELS: "role=web,env=staging"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon9-state:/var/lib/relay-daemon

# All named => persist across `compose down`; wiped only with `compose down -v`.
volumes:
  relay-data:
  bootstrap-shared:
  # Holds ONLY the control-plane admin credential. Separate from
  # bootstrap-shared so daemons never mount it (see the credential service).
  control-credential:
  daemon1-state:
  daemon2-state:
  daemon3-state:
  # `demo` profile only (#452).
  daemon4-state:
  daemon5-state:
  daemon6-state:
  daemon7-state:
  daemon8-state:
  daemon9-state:
