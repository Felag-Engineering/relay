# Relay dev fleet — DEV-ONLY (docs/dev-fleet.md).
#
# One `relay` container plus three `relay-daemon` containers that auto-enroll
# over CA-pinned mTLS and are drivable through the control plane (MCP + /api/v1).
# This is a laptop demo / dogfooding environment; it makes NO production posture
# claims. Docker is never a CI dependency — this file only affects
# `docker compose`, not `make build/test/lint`.
#
# Startup order:
#   relay (healthy) -> credential (mints the control-plane credential with
#   `relay bootstrap-token`) -> approver (creates the dev-approver Account that
#   the approval gate names as its audience) + bootstrap (mints a relay:
#   Enrollment Token + exports the public CA cert) -> daemon-1..3 (enroll, then
#   go healthy).

# The three daemon services are byte-identical except for their per-Node
# environment and their private state volume. This anchor factors out ONLY the
# non-mapping fields they share. NOTE: the YAML merge key `<<` REPLACES a
# mapping wholesale (it does not deep-merge), so each daemon's `environment:` and
# `volumes:` are written inline below — they must never live in this anchor.
x-daemon-base: &daemon-base
  build:
    context: .
    dockerfile: docker/daemon.Dockerfile
  restart: unless-stopped
  depends_on:
    bootstrap:
      # Daemons start only after the token + CA cert exist on the shared volume.
      condition: service_completed_successfully
  healthcheck:
    # The daemon writes the `node_id` file only after a successful enrollment
    # (identity.persist_identity), so this gates health on enrollment success.
    test: ["CMD", "test", "-f", "/var/lib/relay-daemon/node_id"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  relay:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    restart: unless-stopped
    environment:
      # Node-plane gRPC listener (relay-daemon dial-home).
      RELAY_ADDR: ":7654"
      # Control-plane HTTPS listener (MCP + /api/v1) — the #154 execution flip is
      # ON because the control plane is enabled. Distinct port from the node
      # plane: listener separation.
      RELAY_CONTROL_ENABLED: "true"
      RELAY_CONTROL_ADDR: ":9443"
      # Server cert SAN = the in-fleet DNS name daemons and bootstrap dial, so
      # mTLS verification succeeds without any insecure flag inside the fleet.
      RELAY_HOSTNAME: "relay"
      RELAY_CA_DIR: "/var/lib/relay/ca"
      RELAY_STORE_PATH: "/var/lib/relay/store/relay.db"
      # The approval gate (ADR-0027), baked into the image root-owned 0644 —
      # Relay CONFIGURATION, not a runtime object, so no Account of any role can
      # loosen it through the API (invariant 11). It parks fleet-wide mutates
      # (fan-out >= 2) and every Raw Exec; a single-Node mutate still runs
      # straight through, so the fleet exercises BOTH paths. Loading it is
      # fail-closed: a malformed file fails startup rather than silently
      # meaning "nothing needs approval".
      RELAY_APPROVAL_GATE_CONFIG: "/etc/relay/approval-gates.json"
    ports:
      # Distinct published host ports: node plane vs control plane. Bound to
      # 127.0.0.1 (loopback) ONLY: the control plane is an execution surface,
      # so publishing on 0.0.0.0 would make it LAN-reachable RCE — anyone who
      # obtained the dev credential could drive it. Nothing inside the
      # fleet uses these host ports; daemons and bootstrap dial the compose DNS
      # name `relay` over the private network.
      - "127.0.0.1:7654:7654"
      - "127.0.0.1:9443:9443"
    volumes:
      # CA state (ca-cert.pem + ca-key.pem) and the SQLite store persist here, so
      # `compose down` / `up` keeps the same Node identities and audit trail.
      - relay-data:/var/lib/relay
    healthcheck:
      # busybox nc: a raw TCP connect proves each listener is accepting. This is
      # a dev convenience, not a correctness check; -w1 bounds the probe.
      test:
        - "CMD"
        - "sh"
        - "-c"
        - "nc -w1 127.0.0.1 7654 </dev/null && nc -w1 127.0.0.1 9443 </dev/null"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # One-shot: mints the founding admin's control-plane credential with
  # `relay bootstrap-token` (ADR-0023) and writes it to the shared volume.
  #
  # There is no committed credential fixture any more: since #298 the control
  # plane accepts only per-Account API Tokens, and the first one is minted
  # locally against the Relay's own store. This service uses the relay image
  # because it needs that binary, and mounts relay-data READ-WRITE because
  # minting is a store write — the only service other than the Relay itself
  # that does.
  credential:
    build:
      context: .
      dockerfile: docker/relay.Dockerfile
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
    entrypoint: ["sh", "/mint-credential.sh"]
    volumes:
      - ./docker/mint-credential.sh:/mint-credential.sh:ro
      - relay-data:/var/lib/relay
      # Its OWN volume, deliberately NOT bootstrap-shared: that one is mounted
      # by every daemon, and a control-plane admin credential readable by every
      # Node is exactly the shape a compromised Node would exploit. Only the
      # minting service and the bootstrap service see this one.
      - control-credential:/credential

  # One-shot: creates the `dev-approver` human Account and mints its credential
  # (docker/mint-approver.sh).
  #
  # The dev gate leaves `requester_allowed` unset — the strict default — so the
  # Account that requests a parked dispatch may NOT approve it. Without a second
  # Account the fleet could park a dispatch and never release it. This is the
  # human half of that pair, and its credential deliberately lands on the
  # control-credential volume that daemons never mount.
  approver:
    image: curlimages/curl:8.11.1
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
      credential:
        condition: service_completed_successfully
    entrypoint: ["sh", "/mint-approver.sh"]
    volumes:
      - ./docker/mint-approver.sh:/mint-approver.sh:ro
      # Read-only, and only for the PUBLIC ca-cert.pem it pins its API calls to.
      - relay-data:/relay-data:ro
      - control-credential:/credential

  # One-shot: mints the Enrollment Token and exports the public CA cert, then
  # exits. Runs as root (0:0) so it can read the root-owned CA volume and write
  # the shared bootstrap volume. See docker/bootstrap.sh for the security notes
  # (relay:-scoped token; daemons receive ONLY ca-cert.pem, never ca-key.pem).
  bootstrap:
    image: curlimages/curl:8.11.1
    user: "0:0"
    restart: "no"
    depends_on:
      relay:
        condition: service_healthy
      credential:
        condition: service_completed_successfully
    entrypoint: ["sh", "/bootstrap.sh"]
    volumes:
      - ./docker/bootstrap.sh:/bootstrap.sh:ro
      - relay-data:/relay-data:ro
      - control-credential:/credential:ro
      - bootstrap-shared:/bootstrap

  daemon-1:
    <<: *daemon-base
    # Sets the container's kernel hostname, which gather_facts() reads as the
    # authoritative Facts.hostname source (issue #188). The HOSTNAME env var
    # below is now only an explicit fallback for an unreadable /proc.
    hostname: "dev-node-1"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.toml"
      HOSTNAME: "dev-node-1"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      # Private per-Node state volume => stable identity across down/up, no
      # re-enrollment storm.
      - daemon1-state:/var/lib/relay-daemon

  daemon-2:
    <<: *daemon-base
    hostname: "dev-node-2"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.toml"
      HOSTNAME: "dev-node-2"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon2-state:/var/lib/relay-daemon

  daemon-3:
    <<: *daemon-base
    hostname: "dev-node-3"
    environment:
      RELAY_ADDR: "https://relay:7654"
      RELAY_DOMAIN: "relay"
      RELAY_CA_BUNDLE_PATH: "/bootstrap/ca-cert.pem"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.toml"
      HOSTNAME: "dev-node-3"
      RELAY_NODE_LABELS: "role=db"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon3-state:/var/lib/relay-daemon

# All named => persist across `compose down`; wiped only with `compose down -v`.
volumes:
  relay-data:
  bootstrap-shared:
  # Holds ONLY the control-plane admin credential. Separate from
  # bootstrap-shared so daemons never mount it (see the credential service).
  control-credential:
  daemon1-state:
  daemon2-state:
  daemon3-state:
