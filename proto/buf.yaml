version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Service names follow domain vocabulary (Enrollment, Tunnel) without the redundant
    # "Service" suffix — the meaning is unambiguous in context (CONTEXT.md).
    - SERVICE_SUFFIX
    # The Tunnel.Connect RPC uses DaemonMessage/RelayMessage (role-based names,
    # per ADR-0005) rather than the ConnectRequest/ConnectResponse convention.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
# Additive-only /proto contract (ADR-0014): FILE is the strictest breaking category —
# it rejects field renumber/delete, type changes, and file moves. Enforced by
# `make proto-breaking` and the "Proto breaking" CI job.
breaking:
  use:
    - FILE
