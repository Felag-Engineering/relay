version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Service names follow domain vocabulary (Enrollment, Tunnel) without the redundant
    # "Service" suffix — the meaning is unambiguous in context (GLOSSARY.md).
    - SERVICE_SUFFIX
    # The Tunnel.Connect RPC uses DaemonMessage/RelayMessage (role-based names,
    # per ADR-0005) rather than the ConnectRequest/ConnectResponse convention.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
# Additive-only /proto contract (ADR-0014): FILE is the strictest breaking category —
# it rejects field renumber/delete, type changes, and file moves. Enforced by
# `make proto-breaking` and the "Proto breaking" CI job.
breaking:
  use:
    - FILE
  except:
    # go_package names where Go code is generated, not anything on the wire. The generated
    # package is under relay/internal/, which no module outside this repository can import,
    # so a change here breaks no consumer; it moves only with the module path (ADR-0016).
    - FILE_SAME_GO_PACKAGE
