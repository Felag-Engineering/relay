syntax = "proto3";

// The Relay contract: the single source of truth for the wire protocol
// between the Relay and relay-daemons, and for the Operation vocabulary. Both the
// Go Relay and the Rust relay-daemon generate their types from this file. See
// ../../GLOSSARY.md for the meaning of every term and ../../docs/adr/ for the why.
//
// This is a DRAFT spine for v0.0.1. Expect it to evolve as milestones land; it
// captures the shapes implied by ADRs 0001-0013, not a frozen API.
package relay.v1;

option go_package = "github.com/Felag-Engineering/relay/relay/internal/relay/v1;relayv1";

// ---------------------------------------------------------------------------
// Enrollment (ADR-0006): a daemon presents a reusable, scoped Enrollment Token
// over server-authenticated TLS and submits a CSR; the Relay CA returns a
// per-Node client certificate. Subsequent connections use mTLS.
//
// Auth model note: Enroll is token-authenticated and certless (no client cert).
// Renew is cert-authenticated over mTLS (different auth models, same service).
// Renew is intentionally absent from the certless allowlist, making it
// mTLS-required with no interceptor changes needed.
// ---------------------------------------------------------------------------
service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc Renew(RenewRequest) returns (RenewResponse);
}

message EnrollRequest {
  string enrollment_token = 1;   // reusable, scoped, expiring, revocable
  bytes  csr              = 2;    // PEM-encoded certificate signing request
  repeated Label self_labels = 3; // node-space labels the daemon self-reports
  Facts  facts           = 4;     // descriptive, self-reported
}

message EnrollResponse {
  string node_id          = 1;
  bytes  certificate      = 2;    // PEM client cert; the Node's identity
  bytes  ca_bundle        = 3;    // PEM CA chain the daemon pins the Relay against
  repeated Label assigned_labels = 4; // relay-space labels stamped from token scope
}

// RenewRequest carries a PEM CSR. The CSR supplies ONLY the new public key;
// node_id and CN are derived from the verified TLS peer cert (never the CSR).
// Requires an active mTLS connection — the certless allowlist does not include Renew.
message RenewRequest {
  bytes csr = 1;
}

// RenewResponse mirrors the certificate/ca_bundle shape of EnrollResponse.
// node_id is echoed from the verified peer cert so the daemon can assert it
// equals its persisted node_id and refuse a mismatched cert (defense in depth).
message RenewResponse {
  string node_id     = 1;
  bytes  certificate = 2;   // PEM renewed client cert; same node_id, new public key
  bytes  ca_bundle   = 3;   // PEM CA bundle (unchanged, but included for completeness)
}

// JoinString is the one pasteable artifact that enrolls a Node (ADR-0031). Its text
// form is "glp_join_" followed by the unpadded base64url of this message's
// serialization. It carries a live Enrollment Token and is handled as a secret. No RPC
// carries it. format_version 1 is the only version: a decoder refuses any other, and
// refuses a version 1 message carrying any field beyond these four.
message JoinString {
  uint32 format_version        = 1;  // 1; a decoder refuses any other value, 0 included
  string relay_address         = 2;  // host:port the daemon dials to enroll
  bytes  ca_fingerprint_sha256 = 3;  // SHA-256 over the Relay CA certificate's DER; 32 bytes
  string enrollment_token      = 4;  // the Enrollment Token plaintext
}

// ---------------------------------------------------------------------------
// The persistent bidirectional stream (ADR-0005). The daemon opens it after
// mTLS; the Relay pushes RelayMessages down, the daemon sends DaemonMessages up.
// ---------------------------------------------------------------------------
service Tunnel {
  // Named Open, not Connect: tonic generates a client constructor `connect()`, so an
  // RPC named Connect collides with it in the generated Rust client (E0592). Do not
  // rename back to Connect without solving that on the daemon side. (ADR-0005)
  rpc Open(stream DaemonMessage) returns (stream RelayMessage);
}

message DaemonMessage {
  oneof body {
    Hello       hello       = 1;
    Heartbeat   heartbeat   = 2;
    TaskResult  task_result = 3;
    StreamChunk stream_chunk = 4; // reserved for future live output
    PolicySnapshot policy   = 5;   // effective Policy, for the Relay to display only
    PolicyVerdict policy_verdict = 6; // daemon's answer to a PolicyQuery; evaluated by the real enforcement engine (ADR-0011)
    TemplateSnapshot templates = 7;  // this Node's loaded Template Operation vocabulary, for the Relay to display only (ADR-0021)
  }
}

message RelayMessage {
  oneof body {
    Ping        ping        = 1;
    TaskRequest task        = 2;
    TaskCancel  task_cancel = 3;   // cancel an in-flight Task by id; Relay→daemon; best-effort (ADR-0013)
    PolicyQuery policy_query = 4;  // read-only "would Policy allow" probe; executes nothing (ADR-0011)
  }
}

message Hello {
  string node_id          = 1;
  string daemon_version   = 2;
  Facts  facts            = 3;
  repeated Label labels   = 4;   // node-space + relay-space (relay-space is authoritative)
  string policy_fingerprint = 5; // hash of the loaded Policy; report-only, for the Relay to detect drift/display; the Relay never sets Policy (ADR-0002)
  string template_set_fingerprint = 6; // hash of the loaded Template Operation set, beside policy_fingerprint; report-only drift signal, never settable over the wire (ADR-0021/ADR-0002). Empty = no templates loaded; the literal "unloadable" = the local template set failed to load and the Node's template vocabulary is empty (fail closed)
}

message Heartbeat { int64 unix_millis = 1; }
message Ping      { int64 unix_millis = 1; }

// ---------------------------------------------------------------------------
// Execution (ADR-0001, ADR-0004). A Task is one Operation or Raw Exec on one
// Node, carrying a unique id for at-most-once execution.
// ---------------------------------------------------------------------------
message TaskRequest {
  string task_id          = 1;   // unique; daemon dedups on it
  oneof action {
    Operation operation   = 2;   // structured, typed, native (argv, no shell)
    RawExec   raw_exec    = 3;   // arbitrary command, gated by Policy regex
  }
  int32  timeout_seconds  = 4;   // Policy may cap the effective value
  // risk_class is the class this Task was recorded under (ADR-0012,
  // ADR-0042): a Native's from /proto, Raw Exec always MUTATE, and for a
  // Template THIS NODE'S OWN reported class — deliberately not the Job's
  // most-restrictive class. The daemon refuses, without executing and before
  // Policy, a Task declared READ whose action it classifies as MUTATE: the
  // Node's Template catalog changed (a daemon restart) after the report the
  // Relay resolved against. UNSPECIFIED (an older Relay) is not checked, and
  // an older daemon ignores the field, so the check holds only where both
  // sides carry it.
  RiskClass risk_class    = 5;
}

// TaskCancel asks the daemon to stop an in-flight Task and kill its process
// group; the daemon then reports OUTCOME_CANCELLED. Best-effort by definition
// (ADR-0013): carries only the id — cancellation has no execution payload, and
// is NOT a Task (at-most-once dedup treats the cancelled id as still seen).
message TaskCancel {
  string task_id = 1;   // id of the Task to cancel
}

message Operation {
  string name             = 1;   // e.g. "system.facts", "service.restart", "pkg.install"
  map<string, string> args = 2;   // typed per Operation; validated against schema
}

// Risk class of an Operation, used only for blast-radius control (ADR-0012):
// read = cannot change Node state, mutate = can. NOT a trust/Policy substitute —
// Policy (deny-by-default, argument-level) applies identically to both classes.
enum RiskClass {
  RISK_CLASS_UNSPECIFIED = 0;
  RISK_CLASS_READ        = 1;   // cannot change Node state (e.g. system.facts, file.read)
  RISK_CLASS_MUTATE      = 2;   // can change Node state (e.g. service.restart); Raw Exec is always mutate
}

// OperationDescriptor is the wire-visible declaration of one Operation in the
// vocabulary: its name and its risk class. Forward-compatible — it will feed
// list_operations in v0.0.6 (do not build that here). Field 3 onwards is
// intentionally unassigned; earmarked for a future argument-schema description.
//
// The v1 Operation vocabulary and its classes:
//   system.facts     -> RISK_CLASS_READ    (self-reported Node facts; no state change)
//   file.read        -> RISK_CLASS_READ    (reads file contents; no state change)
//   service.restart  -> RISK_CLASS_MUTATE  (changes Node state)
//   pkg.install      -> RISK_CLASS_MUTATE  (installs a package; changes Node state)
// Raw Exec is not an Operation and has no descriptor; it is ALWAYS mutate by
// definition (arbitrary commands are unclassifiable, so they take the strict lane).
//
// pkg.install args (Operation.args map): "name" (required, package name,
// validated against a strict charset before argv is built) and "version"
// (optional, validated; empty/absent installs the latest version).
message OperationDescriptor {
  string    name       = 1;   // Operation name, e.g. "system.facts"
  RiskClass risk_class = 2;
}

message RawExec {
  repeated string argv    = 1;   // no implicit shell unless argv explicitly invokes one
}

message TaskResult {
  string task_id          = 1;
  Outcome outcome         = 2;
  int32  exit_code        = 3;
  bytes  stdout           = 4;   // size-capped
  bytes  stderr           = 5;   // size-capped
  bool   truncated        = 6;
  int64  duration_millis  = 7;
}

enum Outcome {
  OUTCOME_UNSPECIFIED   = 0;
  OUTCOME_SUCCESS       = 1;
  OUTCOME_FAILURE       = 2;   // something ran and failed — or the daemon refused the Task for a protocol reason without executing it (missing action, overloaded, class mismatch); stderr says which
  OUTCOME_TIMEOUT       = 3;
  OUTCOME_DENIED_BY_POLICY = 4;
  OUTCOME_CANCELLED     = 5;   // Task killed by TaskCancel before it finished; a Task that already completed reports its real outcome, never a retroactive cancel (ADR-0013)
  OUTCOME_UNREACHABLE   = 6;   // Relay-synthesized: the Node was offline at dispatch, so the Task was never sent; a daemon never emits this (ADR-0004 fail-fast, no store-and-forward)
  OUTCOME_VERSION_REFUSED = 7; // Relay-synthesized: the Node's daemon is below the Relay's configured minimum version (ADR-0014), so the Task was refused at dispatch and never sent; a daemon never emits this.
  OUTCOME_UNSUPPORTED   = 8;   // daemon-reported: the Operation name is not in THIS Node's vocabulary (an unloaded Template Operation, or an unknown name) — the Task was never executed and Policy was never asked to decide. Distinct from OUTCOME_DENIED_BY_POLICY (Policy decided) and OUTCOME_FAILURE (something ran and failed, or a protocol refusal). Vocabulary is per-Node once templates exist (ADR-0021); discover it with describe_node/list_operations.
}

message StreamChunk {
  string task_id          = 1;
  bytes  data             = 2;
  bool   is_stderr        = 3;
}

// ---------------------------------------------------------------------------
// Shared value types.
// ---------------------------------------------------------------------------
message Label {
  string key   = 1;   // includes namespace prefix: "node:role" or "relay:env"
  string value = 2;
}

message Facts {
  string hostname = 1;
  string os       = 2;
  string kernel   = 3;
  string arch     = 4;
  repeated string ip_addresses = 5;
}

// Effective Policy is reported by the daemon for display only; it is enforced
// solely on the daemon and is never settable over the wire (ADR-0002).
message PolicySnapshot {
  bool raw_exec_enabled        = 1;
  repeated string raw_allow_patterns = 2;
  repeated string raw_deny_patterns  = 3;
  repeated string allowed_operations = 4; // operation names permitted on this Node
  string policy_fingerprint    = 5;   // hash of the effective Policy this snapshot describes; display-only (ADR-0002)

  // raw mirror of the loaded Policy for legibility; the Relay never evaluates
  // these (ADR-0011). Unlike allowed_operations (deduped names only),
  // operation_rules preserves EVERY [[operation]] block in file order — a
  // name may repeat with different allowed_args.
  repeated OperationRule operation_rules = 6;
  // raw mirror of the loaded Policy's [[deny]] blocks, verbatim, in file
  // order; display-only (ADR-0002). The Relay never evaluates these (ADR-0011).
  repeated DenyRule      deny_rules      = 7;
}

// One [[operation]] allow rule, mirrored for display (ADR-0002). allowed_args is
// positional: allowed_args[i] is the permitted-value set at argv position i; an
// empty list means the Operation is allowed with zero arguments.
message OperationRule {
  string name = 1;
  repeated ArgMatcher allowed_args = 2;
}

// One [[deny]] rule, mirrored for display. args is positional like allowed_args;
// an empty list denies the whole Operation regardless of arguments. Deny rules
// never carry a "*" wildcard (they list explicit values) — deny-beats-allow.
message DenyRule {
  string name = 1;
  repeated ArgMatcher args = 2;
}

// ---------------------------------------------------------------------------
// Per-Node Template Operation vocabulary (ADR-0021). Templates are loaded from
// root-owned local files on the Node (same trust root as Policy, ADR-0002): the
// Relay may READ a Node's template set, never set or modify it. Reported for
// display and discovery only — the daemon remains the sole enforcer.
// ---------------------------------------------------------------------------

// TemplateSnapshot is the daemon's report of its loaded Template Operations.
// Sent after PolicySnapshot on every (re)connect, so the Relay's view is
// refreshed the same way the Policy view is.
message TemplateSnapshot {
  // Same value as Hello.template_set_fingerprint, from the same loaded set —
  // the drift signal an operator confirms a template rollout with.
  string template_set_fingerprint = 1;
  // Every loaded Template Operation, in canonical (name-sorted) order. Empty
  // when the Node has no templates — which is also what an unloadable template
  // set reports (fail closed: an unreadable set yields NO vocabulary, and the
  // fingerprint then reads "unloadable").
  repeated TemplateDescriptor templates = 2;
}

// TemplateDescriptor declares one Template Operation on one Node: the name it
// registers in the Policy vocabulary, its mandatory risk class (ADR-0012), and
// its typed parameter slots. The template BODY is deliberately absent: the
// Relay never needs the command to route or display it, and shipping it would
// invite Relay-side rendering — substitution happens only on the daemon.
message TemplateDescriptor {
  string name              = 1;   // Operation name, e.g. "proc.list"
  RiskClass risk_class     = 2;   // mandatory on every template (ADR-0012)
  repeated TemplateSlot slots = 3; // parameter slots, in declaration order (= positional order for Policy args)
}

// TemplateSlot is one typed parameter slot. `type` is the daemon's slot-type
// name — "identifier", "integer", "path", or "enum" — carried as a string
// rather than an enum so a daemon that grows a slot type stays legible to an
// older Relay (which displays vocabulary, never validates it: validation is
// the daemon's, at execution time). enum_values is populated only for "enum".
message TemplateSlot {
  string name = 1;
  string type = 2;
  repeated string enum_values = 3;
}

// The value set permitted (allow) or denied (deny) at ONE argument position.
// Carried as a message so PolicySnapshot can express the repeated-of-repeated
// shape proto3 cannot nest directly. In an allow rule, a values entry of "*"
// marks a wildcard position; deny rules use only explicit values.
message ArgMatcher {
  repeated string values = 1;
}

// ---------------------------------------------------------------------------
// Plan mode (ADR-0011): read-only "would Policy allow" probes. No execution
// occurs; no Policy is modified (ADR-0002).
// ---------------------------------------------------------------------------

// PolicyQuery asks the daemon whether its Policy WOULD allow an action —
// executing nothing (ADR-0011). Deliberately not a flag on TaskRequest and
// deliberately carries no task_id: query_id is correlation-only and cannot
// collide with at-most-once dedup or trigger execution. Read-only: it can
// never set or change Policy (ADR-0002).
message PolicyQuery {
  string query_id = 1;          // correlation only; NOT a task_id
  oneof action {
    Operation operation = 2;    // structured, typed, native (argv, no shell)
    RawExec   raw_exec  = 3;    // arbitrary command, gated by Policy regex
  }
}

// PolicyPass is the stage of the daemon's decide that produced a verdict.
enum PolicyPass {
  POLICY_PASS_UNSPECIFIED  = 0;  // not decided by Policy (unsupported, no action), or a daemon that does not report it
  POLICY_PASS_PRECONDITION = 1;
  POLICY_PASS_DENY         = 2;
  POLICY_PASS_GUARD        = 3;
  POLICY_PASS_ALLOW        = 4;
  POLICY_PASS_DEFAULT      = 5;
}

// PolicyRuleSection names the part of a Node's Policy file holding the rule
// that decided.
enum PolicyRuleSection {
  POLICY_RULE_SECTION_UNSPECIFIED    = 0;  // no rule decided, or a daemon that does not report it
  POLICY_RULE_SECTION_OPERATION      = 1;  // [[operation]]
  POLICY_RULE_SECTION_DENY           = 2;  // [[deny]]
  POLICY_RULE_SECTION_RAW_EXEC_ALLOW = 3;  // [raw_exec].allow
  POLICY_RULE_SECTION_RAW_EXEC_DENY  = 4;  // [raw_exec].deny
}

// PolicyVerdict is the daemon's answer, from the same enforcement engine that
// decides at execution time (ADR-0011). `allowed` is a plain bool so the wire
// can express only allow/deny; unknown(offline) is a Relay-side conclusion
// about a disconnected Node, never a wire value. On deny, deciding_rule names
// the Policy rule that denied (acceptable extra detail per ADR-0011, since
// describe_node already exposes effective Policy to authorized callers).
//
// pass, rule_section, rule_index, rule_line and matched_on are the daemon's own
// account of which pass and rule decided. They are display-only on the Relay,
// which never evaluates them (ADR-0011, invariant 12). All of them stay zero
// when `unsupported` is set or the query had no action. They are also zero from
// a daemon older than these fields, which does not report them, so an empty
// pass never means "no rule decided": only POLICY_PASS_DEFAULT says
// deny-by-default.
message PolicyVerdict {
  string query_id      = 1;   // echoes the PolicyQuery
  bool   allowed       = 2;   // allow = true, deny = false
  string deciding_rule = 3;   // set only on deny; empty on allow
  // The queried Operation name is not in this Node's vocabulary, so Policy was
  // never asked to decide — the plan-mode mirror of OUTCOME_UNSUPPORTED, which
  // is what a real dispatch of the same action would report (ADR-0011 parity).
  // Always accompanied by allowed=false; deciding_rule then explains the
  // vocabulary miss rather than naming a Policy rule.
  bool   unsupported   = 4;
  PolicyPass        pass         = 5;  // the stage of the daemon's decide that produced the verdict
  uint32            rule_index   = 6;  // index within rule_section; meaningful only when rule_section is set
  uint32            rule_line    = 7;  // 1-based source line; 0 = the loader did not know it
  string            matched_on   = 8;  // the daemon's matched-on text: positions and indices, never an argument value
  PolicyRuleSection rule_section = 9;  // set exactly when a rule decided (pass DENY or ALLOW)
}
