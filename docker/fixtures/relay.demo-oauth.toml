# The Relay's configuration for the local Docker fleet — DEV-ONLY (docs/dev-fleet.md).
#
# Staged root:10001 0640 onto the relay-etc volume by the relay-config one-shot
# (docker/dev-fleet-config.sh); the Relay mounts that volume read-only at /etc/relay. It reads
# every setting from this one file and nothing from its environment (ADR-0043, invariant 11),
# so nothing a request can do reaches it.
#
# The approval gate (ADR-0027) is staged beside it, root-owned 0644. It is Relay
# CONFIGURATION, not a runtime object, so no Account of any role can loosen it through the
# API. The demo gate (docker/fixtures/approval-gates.demo.json) is the demo fleet's in-band
# gate. Loading it is fail-closed: a malformed file fails startup rather than silently
# meaning "nothing needs approval". `approval.gate_rules_path` names WHICH staged gate file;
# the Makefile chooses the fixture (DEV_FLEET_RELAY_CONFIG) per target.

# The Admin Console (ADR-0009) is served on the SAME control-plane listener as MCP and
# /api/v1: no new listener and no new auth path (invariant 10). Both listeners share one
# server certificate (ADR-0031), so the Console's reachability rides on that certificate
# rotating.

# Node-plane gRPC listener (relay-daemon dial-home).
[node_plane]
listen_address = ":7654"

# Control-plane HTTPS listener (MCP + /api/v1), on a distinct port from the node plane:
# listener separation. Enabled, so execution is on.
[control_plane]
enabled = true
listen_address = ":9443"

[console]
enabled = true

[ca]
dir = "/var/lib/relay/ca"

[store]
path = "/var/lib/relay/store/relay.db"

# Server certificate SAN = the in-fleet DNS name daemons and init dial, so mTLS
# verification succeeds without any insecure flag inside the fleet.
[tls]
hostname = "relay"

[approval]
gate_rules_path = "/etc/relay/approval-gates.demo.json"

# The OAuth resource-server half (ADR-0024), for `make demo-up-oauth`
# (docker-compose.oauth.yml). The issuer and audience are Relay CONFIGURATION (invariant 11),
# set on the host and unreachable from any API.
[oauth]
issuer = "http://127.0.0.1:8180/realms/relay-demo"
# The MCP URL clients dial. Claude Code checks the advertised `resource` against it, and
# the realm's audience mapper puts it in every token's `aud`.
audience = "https://relay:9443/mcp"
public_url = "https://relay:9443"
# Not the default `email`: an Account name is [A-Za-z0-9._-] only, so no email address can
# ever name one. Keycloak's `preferred_username` is the realm username, which the realm
# forbids users to edit.
account_claim = "preferred_username"
