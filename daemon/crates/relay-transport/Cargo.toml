[package]
name = "relay-transport"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The daemon's connection to the Relay: mTLS identity, enrollment, renewal and the Tunnel (ADR-0005/0006)."
license.workspace = true
publish.workspace = true

[features]
# Items the bin's tests reach across the crate boundary (identity::mode_assert).
# Only the bin's [dev-dependencies] may enable it (tests/clippy_write_ban.rs).
test-util = []

[dependencies]
relay-proto = { workspace = true }
relay-log = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt", "macros"] }
tonic = { workspace = true, features = ["transport", "tls-ring"] }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
prost = { workspace = true }
base64 = { workspace = true }
# SHA-256 over the presented CA's DER, matched against the join string's pin
# (ADR-0031). Already a workspace dependency of the bin.
ring = { workspace = true }
# Wipes the Enrollment Token a decoded join string holds, and the buffers that
# carried it, when they are dropped (DI-42). No new crate: it is already in the tree.
zeroize = { workspace = true }
# O_NOFOLLOW, O_NONBLOCK and ELOOP for opening the persisted Relay address.
libc = { workspace = true }
# The effective uid the state-file owner check compares against. No `features` key:
# the workspace manifest explains why none may be added.
rustix = { workspace = true }

[dev-dependencies]
relay-test-support = { workspace = true }
# Used only by tunnel.rs wrong-CA refusal test (wrong_ca_relay_is_refused).
# ABI-matched to the rustls = "0.23" runtime dependency. default-features = false
# prevents the dev build from re-enabling rustls/aws_lc_rs via tokio-rustls defaults.
tokio-rustls = { workspace = true }
# Used by renew.rs tests to construct rcgen certs with specific validity windows.
# (rcgen's not_before/not_after fields are time::OffsetDateTime.)
time = { workspace = true }
# The tunnel tests' raw listener. The fake Enrollment server the enroll tests use
# lives in relay-test-support.
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
