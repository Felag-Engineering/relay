[package]
name = "relay-policy"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "The relay-daemon's Policy engine and read-only loader (ADR-0002). Read-only by construction: clippy.toml bans filesystem writes."
license.workspace = true
publish.workspace = true

[features]
# Items the bin's tests reach across the crate boundary. Only the bin's
# [dev-dependencies] may enable it (tests/clippy_write_ban.rs).
test-util = []
# Compiles ban_probe.rs, which proves every clippy.toml entry fires
# (scripts/clippy-ban-probe.sh). Never enabled by a dependency.
ban-probe = []

[dependencies]
relay-proto = { workspace = true }
relay-log = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
ring = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
relay-test-support = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true
