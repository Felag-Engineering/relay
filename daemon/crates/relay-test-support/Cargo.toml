[package]
name = "relay-test-support"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
description = "Test fixtures shared by the daemon workspace. Dev-dependency ONLY (tests/clippy_write_ban.rs)."
license.workspace = true
publish.workspace = true

[dependencies]
relay-log = { workspace = true }
rustix = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "rt", "macros"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# fake_relay: a fake Relay Enrollment server over real TLS, for the enrollment and
# join tests. tonic's server half and the prost codec its hand-written service
# names are linked only into test binaries, because this crate is only ever a
# dev-dependency; the daemon stays a gRPC client.
relay-proto = { workspace = true }
tonic = { workspace = true, features = ["codegen", "transport", "tls-ring"] }
tonic-prost = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# Parses and checks the CSR the fake Relay signs. The verify feature uses ring,
# which is already in the tree, and is dev-only here.
x509-parser = { workspace = true, features = ["verify"] }

[lints]
workspace = true
