# nfpm manifest for the relay-read catalog .deb and .rpm (DI-29).
#
# A template, rendered by scripts/build-packages.sh exactly as relay-daemon.yaml is. The
# shipped read catalog is its own optional package: placing it is the operator's choice,
# never a side effect of installing the daemon (ADR-0021 as amended 2026-10-15).
#
# Its Templates are package-owned plain files: replaced on upgrade, removed with the package,
# never `config` or `config|noreplace`. A released Template name is bound to its body and risk
# class by the catalog ledger (DI-30), so an upgrade adds Templates and never changes what an
# allowed name does. Architecture-independent, so the release builds it once per pass.

name: relay-read
arch: all
platform: linux
version: "@VERSION@"
version_schema: semver
release: "1"
section: admin
priority: optional
maintainer: "Felag Engineering"
vendor: Felag Engineering
homepage: "https://github.com/Felag-Engineering/relay"
license: BUSL-1.1
description: |-
  Relay's shipped read catalog of Template Operations for the relay-daemon.
  Read-only Templates the shipped default Policy allows by name.
depends:
  - relay-daemon
mtime: "@MTIME@"
umask: 0o022

contents:
  - dst: /etc/relay-daemon/templates.d/relay-read
    type: dir
    file_info: {mode: 0o755, owner: root, group: root}
  - src: "@SRC@/daemon/packaging/templates.d/relay-read/catalog.toml"
    dst: /etc/relay-daemon/templates.d/relay-read/catalog.toml
    file_info: {mode: 0o644, owner: root, group: root}

deb:
  compression: gzip
rpm:
  compression: gzip
  buildhost: relay-release
  group: System Environment/Daemons
  summary: Relay's shipped read catalog of Template Operations
