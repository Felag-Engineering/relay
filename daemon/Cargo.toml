[package]
name = "relay-daemon"
version = "0.0.1"
edition = "2021"
description = "The Relay relay-daemon: the non-AI daemon that runs on each managed Node."
license = "Proprietary"

[[bin]]
name = "relay-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio-stream = "0.1"
# mTLS / crypto
# default-features = false drops aws_lc_rs + prefer-post-quantum, which together
# pulled aws-lc-sys (a C lib) into the tree. ring is the sole crypto backend —
# consistent with rcgen's ring feature below and the install_default() call in
# main.rs / tunnel.rs. Deliberate exclusion of aws-lc-rs: crypto-path consistency
# and small static musl fleet binary (ADR-0007).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# SHA-256 for Policy fingerprinting (ADR-0002 drift visibility). Already
# transitive via rustls + rcgen ring features (Cargo.lock), so promoting here
# adds zero new crates to the musl build.
ring = "0.17"
# CSR / keypair generation for enrollment bootstrap (ADR-0006).
# `ring` backend keeps crypto internally consistent with the rustls ring path above.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# PEM parsing for idempotency check and future mTLS identity loading (#28).
rustls-pemfile = "2"
# Parse cert NotBefore/NotAfter for renewal scheduling (issue #31).
x509-parser = "0.18"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Typed error enums for the identity/enroll/renew paths (Send+Sync across the
# renewal spawn boundary). No transitive deps; keeps the musl binary small.
thiserror = "2"
# Derive Deserialize/Default on the Policy on-disk structs (ADR-0002).
serde = { version = "1", features = ["derive"] }
# Deserialize-only TOML for the Policy file; default-features=false drops the
# serializer half, keeping the musl binary small (ADR-0007). The Relay may never
# modify the Policy file over the wire (ADR-0002 remotely-immutable invariant).
toml = { version = "0.8", default-features = false, features = ["parse"] }
# Regex gating for Raw Exec (ADR-0001): RE2-style linear-time engine, no ReDoS.
# Already transitive (regex 1.12.4 via the dependency tree); promoting to a
# direct dep makes the Raw Exec gate explicit without adding a new crate.
regex = "1"
# Safe geteuid() for the Policy-file owner check (uid must be 0 or daemon euid).
# Already transitive (rustix 1.1.4); only the `process` feature is added here.
# Using rustix instead of libc keeps the code safe (no `unsafe` block needed).
rustix = { version = "1", features = ["process"] }
# Process-group signalling for the Task executor: kill(-pgid, SIG..) to
# SIGTERM/SIGKILL a Task's whole process tree (ADR-0013 killable groups).
# Already present transitively via tokio -> signal-hook-registry, so this
# adds zero new crates to the musl build.
libc = "0.2"

[dev-dependencies]
# Enables the paused/virtual clock (tokio::time::pause / advance) used only by
# executor.rs's timeout_beats_buffered_cancel_biased test to deterministically
# tie the wait-arm and cancel-arm select branches without a process-timing
# race. test-util is dev-only: it does not ship in the production binary.
tokio = { version = "1", features = ["test-util"] }
# Used only by tunnel.rs wrong-CA refusal test (wrong_ca_relay_is_refused).
# ABI-matched to the rustls = "0.23" runtime dependency. default-features = false
# prevents the dev build from re-enabling rustls/aws_lc_rs via tokio-rustls defaults.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Used by renew.rs tests to construct rcgen certs with specific validity windows.
# (rcgen's not_before/not_after fields are time::OffsetDateTime.)
time = "0.3"
# Enables rcgen's CSR-parsing API (CertificateSigningRequestParams::from_pem /
# from_der) in tests so renewers can sign the CSR with a test CA, producing a
# cert whose public key matches the freshly generated keypair (FIX A tests).
# x509-parser is already a runtime dependency; this just enables rcgen's optional
# gate for it during test builds without affecting the production binary.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }
proptest = "1"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
# Small static binary for the fleet (ADR-0007). Build target: musl.
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
