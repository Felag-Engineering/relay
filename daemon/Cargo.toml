[package]
name = "relay-daemon"
# The single source of the SEMANTIC version for both binaries (issue #249).
# It names the release this working tree is developing toward; a build whose
# HEAD is the clean, exact `v<this version>` tag reports exactly this string,
# and every other build reports its numeric core as a `-0.dev` prerelease
# (numeric-first so it sorts below prerelease targets too — issue #261).
# `Hello.daemon_version`
# is derived from it (src/version.rs) and is the input to the Relay's ADR-0014
# minimum-version gate, so it must always be valid semver. Bump it to the next
# release immediately after a release tag is cut — see
# docs/operations/version-stamping.md.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "The Relay relay-daemon: the non-AI daemon that runs on each managed Node."
license.workspace = true
publish.workspace = true

[[bin]]
name = "relay-daemon"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]
# The fuzz crate is its own workspace root (cargo-fuzz needs nightly); it imports
# relay-proto by path.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
# MSRV (#667): the oldest rustc this daemon is *claimed* to build on. A floor,
# not a pin — the daemon tracks stable (AGENTS.md), so there is deliberately no
# rust-toolchain.toml. Read the number as advisory: every first-party build, CI
# and the fleet images alike, uses current stable (the release pins one exact
# stable, RELEASE_RUST_TOOLCHAIN in release.yml, still without a
# rust-toolchain.toml), so nothing ever compiles the
# daemon at exactly this version and the claim can go stale without anything
# noticing. Its two effects are real, though: cargo refuses an older rustc by
# naming this version instead of failing somewhere in the middle of a compile,
# and with no `msrv` in clippy.toml clippy reads it as its MSRV and stops suggesting
# constructs newer than it — a safe direction, but a real effect.
rust-version = "1.96"
license = "BUSL-1.1"
# Never published to a registry. Also what lets cargo-deny skip the license check for this
# crate itself: its own license (LICENSE) is not on the dependency allowlist (deny.toml).
publish = false

[workspace.dependencies]
# First-party members. Versioned path deps: deny.toml's `wildcards = "deny"` rejects a
# versionless one, and every member is `publish = false` so the version is never used.
relay-proto = { path = "crates/relay-proto", version = "0.0.0" }
relay-log = { path = "crates/relay-log", version = "0.0.0" }
relay-policy = { path = "crates/relay-policy", version = "0.0.0" }
relay-exec = { path = "crates/relay-exec", version = "0.0.0" }
relay-ops = { path = "crates/relay-ops", version = "0.0.0" }
relay-transport = { path = "crates/relay-transport", version = "0.0.0" }
relay-test-support = { path = "crates/relay-test-support", version = "0.0.0" }

# External dependencies, declared once; members opt in with `workspace = true`.
tokio = "1"
# Each member picks its features: relay-proto needs only codegen/transport, plus
# tonic-prost for the codec (no TLS stack in the fuzz build); the daemon adds
# `tls-ring`, tonic 0.14's name for 0.12's ring-backed `tls`. Deliberately not
# `tls-aws-lc` (one crypto backend) nor `tls-native-roots`/`tls-webpki-roots`: the
# pinned Relay CA stays the only trust root (ADR-0005, invariant 6).
tonic = { version = "0.14", default-features = false }
prost = "0.14"
# Unpadded base64url for the join string (ADR-0031). Already in the tree through tonic
# (Cargo.lock has 0.22.1), so the musl build gains no new crate.
base64 = "0.23"
# The prost codec the generated client stubs name (`tonic_prost::ProstCodec`), split
# out of tonic in 0.14 (#938).
tonic-prost = "0.14"
tokio-stream = "0.1"
# mTLS / crypto
# default-features = false drops aws_lc_rs + prefer-post-quantum, which together
# pulled aws-lc-sys (a C lib) into the tree. ring is the sole crypto backend —
# consistent with rcgen's ring feature below and the install_default() call in
# main.rs / tunnel.rs. Deliberate exclusion of aws-lc-rs: crypto-path consistency
# and small static musl fleet binary (ADR-0007).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# SHA-256 for Policy fingerprinting (ADR-0002 drift visibility). Already
# transitive via rustls + rcgen ring features (Cargo.lock), so promoting here
# adds zero new crates to the musl build.
ring = "0.17"
# CSR / keypair generation for enrollment bootstrap (ADR-0006).
# `ring` backend keeps crypto internally consistent with the rustls ring path above.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
# PEM parsing for the identity idempotency check and mTLS identity loading
# (#28). rustls-pemfile was retired here (#344): RUSTSEC flagged it unmaintained,
# and its PEM decoders now live in rustls-pki-types — the same crate whose
# CertificateDer/PrivateKeyDer types rustls already speaks, so this drops a
# dependency rather than adding one. `std` enables the pem module.
rustls-pki-types = { version = "1", features = ["std"] }
# Parse cert NotBefore/NotAfter for renewal scheduling (issue #31).
x509-parser = "0.18"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Typed error enums for the identity/enroll/renew paths (Send+Sync across the
# renewal spawn boundary). No transitive deps; keeps the musl binary small.
thiserror = "2"
# Derive Deserialize/Default on the Policy on-disk structs (ADR-0002).
serde = { version = "1", features = ["derive"] }
# Deserialize-only TOML for the Policy file; default-features=false drops the
# serializer half, keeping the musl binary small (ADR-0007). The Relay may never
# modify the Policy file over the wire (ADR-0002 remotely-immutable invariant).
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Regex gating for Raw Exec (ADR-0001): RE2-style linear-time engine, no ReDoS.
# Already transitive (regex 1.12.4 via the dependency tree); promoting to a
# direct dep makes the Raw Exec gate explicit without adding a new crate.
regex = "1"
# Safe geteuid() for the Policy-file owner check (uid must be 0 or daemon euid).
# Also provides the Task executor's setrlimit and process-group kill (#670): on
# Linux rustix selects its linux_raw backend and issues prlimit64 / kill directly,
# with no libc wrapper and no allocation, which is what keeps the pre_exec closure
# async-signal-safe. `use-libc` must never be enabled on rustix, by us or by any
# dependency — Cargo unifies features crate-graph-wide, and rustix's build.rs flips
# to the libc backend whenever `use-libc` is on, which would turn that `setrlimit`
# back into a libc wrapper (on musl, `__synccall` — not async-signal-safe after
# fork). Features unify across every workspace member, so no member may enable
# either one: the workspace must keep EXACTLY `features = ["process", "termios"]`, and members
# write `rustix = { workspace = true }` with no `features` key. Besides
# `use-libc`, the `fs` feature must never be enabled either — it is the only
# thing that keeps `daemon/tests/policy_never_opened_for_write.rs`'s rustix
# blind spot honest (see its header, ~:43-47: rustix exposes no filesystem-write
# API here only because `fs` is off), a guard on invariant 2. Already transitive
# (rustix 1.1.4); the `process` feature is added here. Using rustix instead
# of libc keeps the code safe (no `unsafe` block needed). `termios` (no further
# crate, neither `fs` nor `use-libc`) is the safe tcgetattr/tcsetattr that turns
# echo off while `relay-daemon join` reads the join string (DI-42).
rustix = { version = "1", features = ["process", "termios"] }
# Custom open(2) flags (O_NOFOLLOW/O_NONBLOCK on Policy/Template; O_NONBLOCK/
# O_NOCTTY, deliberately NOT O_NOFOLLOW, on file_read — ADR-0018) and ELOOP
# matching on the Policy/Template paths, getifaddrs for system facts (no
# rustix equivalent exists), and libc's test-only uses: the mkfifo and
# SIGTERM fixtures, plus policy_never_opened_for_write.rs's own scanner-test
# fixture strings. Already present transitively via tokio ->
# signal-hook-registry, so this adds zero new crates to the musl build.
libc = "0.2"
# Wipes the buffers that held the typed join string, and the token it carries
# (DI-42). Already resolved through rustls and rustls-pki-types with its default
# `alloc` feature, so this adds no crate and no feature to the build.
zeroize = "1"
# Test-only deps (see the dev-dependencies of the members that use them).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
time = "0.3"
proptest = "1"

[workspace.lints.clippy]
# Every `unsafe` block states why it is sound, in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# clippy.toml's disallowed-methods: Command::new outside executor.rs, and in the
# read-only crates the filesystem-write ban (AGENTS.md invariants 1 and 2).
disallowed_methods = "deny"

[dependencies]
relay-proto = { workspace = true }
relay-log = { workspace = true }
relay-policy = { workspace = true }
relay-exec = { workspace = true }
relay-ops = { workspace = true }
relay-transport = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true, features = ["codegen", "transport", "tls-ring"] }
prost = { workspace = true }
tokio-stream = { workspace = true }
rustls = { workspace = true }
ring = { workspace = true }
rcgen = { workspace = true }
rustls-pki-types = { workspace = true }
x509-parser = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
rustix = { workspace = true }
libc = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
relay-test-support = { workspace = true }
# The bin's tests read the decision-log journalctl pattern.
relay-policy = { workspace = true, features = ["test-util"] }
# Enables the paused/virtual clock (tokio::time::pause / advance, `start_paused`)
# the bin's scheduler and dispatch tests use to drive time without a wall-clock
# race. test-util is dev-only: it does not ship in the production binary.
tokio = { workspace = true, features = ["test-util"] }
proptest = { workspace = true }
# Items the bin's tests reach across the crate boundary
# (TemplateSet::{for_test, empty_static}, identity::mode_assert). Only
# dev-dependencies may enable test-util (tests/clippy_write_ban.rs).
relay-ops = { workspace = true, features = ["test-util"] }
relay-transport = { workspace = true, features = ["test-util"] }

# Lints that guard the root daemon itself, in every target and every editor, not only
# under `make lint-daemon`. clippy.toml holds the configuration they read.
[lints]
workspace = true

[profile.release]
# Small static binary for the fleet (ADR-0007). Build target: musl.
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
