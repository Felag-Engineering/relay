[package]
name = "gleipnir-relay-daemon"
version = "0.0.1"
edition = "2021"
description = "The Gleipnir Relay relay-daemon: the non-AI daemon that runs on each managed Node."
license = "Proprietary"

[[bin]]
name = "relay-daemon"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
tokio-stream = "0.1"
# mTLS / crypto
rustls = "0.23"
# CSR / keypair generation for enrollment bootstrap (ADR-0006).
# `ring` backend keeps crypto internally consistent with rustls' ring path.
# NOTE: aws-lc-rs is already in the tree via rustls 0.23 — this is not a
# size/aws-lc-rs-avoidance decision; it is a crypto-path consistency choice.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
# PEM parsing for idempotency check and future mTLS identity loading (#28).
rustls-pemfile = "2"
# Parse cert NotBefore/NotAfter for renewal scheduling (issue #31).
x509-parser = "0.18"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Used only by tunnel.rs wrong-CA refusal test (wrong_ca_relay_is_refused).
# ABI-matched to the rustls = "0.23" runtime dependency.
tokio-rustls = "0.26"
# Used by renew.rs tests to construct rcgen certs with specific validity windows.
# (rcgen's not_before/not_after fields are time::OffsetDateTime.)
time = "0.3"
# Enables rcgen's CSR-parsing API (CertificateSigningRequestParams::from_pem /
# from_der) in tests so renewers can sign the CSR with a test CA, producing a
# cert whose public key matches the freshly generated keypair (FIX A tests).
# x509-parser is already a runtime dependency; this just enables rcgen's optional
# gate for it during test builds without affecting the production binary.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring", "x509-parser"] }

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[profile.release]
# Small static binary for the fleet (ADR-0007). Build target: musl.
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
