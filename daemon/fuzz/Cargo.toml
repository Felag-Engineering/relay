# Coverage-guided wire fuzzing for the relay-daemon (issues #238/#252).
#
# This crate fuzzes the prost decode surface — the untrusted-bytes entry
# points the daemon parses off the wire — with cargo-fuzz (libFuzzer).
# It NEEDS the nightly Rust toolchain (cargo-fuzz passes -Z sanitizer flags),
# which is exactly why it is a standalone workspace root: the stable per-PR
# gate (`cd daemon && cargo build/test/clippy`) never sees this crate, and the
# only consumer is the nightly `make fuzz-daemon` target wired into
# .github/workflows/security-nightly.yml.
#
# Two further targets (#897) fuzz the Policy engine checks a Task's arguments
# reach: the Raw Exec argv gate (ADR-0019) and the canonical-path precondition
# (ADR-0018), both through the real `Policy::decide`.
#
# The crate also fuzzes the parsers a Node's root-owned files reach (Policy
# compose and lint, Template file parsing and compile) and the Native argument
# validators a Task's arguments reach, against their advertised schema. None of
# them opens a file or spawns a process, and none reaches Template render.
#
# Message types come from the daemon workspace's relay-proto crate, which
# generates them once from /proto (the single source of truth, ADR-0007) — never
# hand-copied and never hand-edited.
[package]
name = "relay-daemon-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
description = "cargo-fuzz targets over the relay-daemon's prost wire-decode surface, the Raw Exec argv gate and the canonical-path precondition, Policy compose/lint, Template file parsing/compilation and the Native Operation argument validators."
license = "BUSL-1.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Match the daemon's wire stack (daemon/Cargo.toml pins prost 0.14 via tonic 0.14).
prost = "0.14"
# The generated wire types. relay-proto declares tonic without `tls-*`, so no TLS
# stack enters the fuzz build.
relay-proto = { path = "../crates/relay-proto" }
# The Policy engine under test. No features: never test-util (its evaluate shims
# are not the production gate) and never ban-probe.
relay-policy = { path = "../crates/relay-policy" }
# The Operation vocabulary, used for Template compile and the Native argument
# validators. No features, so never test-util. relay-exec and tokio come in
# transitively and the fuzz crate never names them, so the executor is
# unreachable from here. Never add relay-transport or relay-test-support, which
# both write files.
relay-ops = { path = "../crates/relay-ops" }
# They back the mirror of the loader's private `[[template]]` file struct in
# src/template_oracle.rs; same specs as daemon/Cargo.toml's workspace dependencies.
serde = { version = "1", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }

# Standalone workspace root. Keeps this nightly-only crate out of the parent
# package's build graph so `make build`/`make test`/`make lint` stay stable-only.
[workspace]
members = ["."]

# One [[bin]] per fuzz target; cargo-fuzz enumerates targets from these.
# Keep each target small and focused on ONE externally-reachable parse or check.
[[bin]]
name = "fuzz_relay_message_decode"
path = "fuzz_targets/fuzz_relay_message_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_enroll_response_decode"
path = "fuzz_targets/fuzz_enroll_response_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_renew_response_decode"
path = "fuzz_targets/fuzz_renew_response_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_raw_exec_gate"
path = "fuzz_targets/fuzz_raw_exec_gate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_path_canonical"
path = "fuzz_targets/fuzz_path_canonical.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_policy_compose"
path = "fuzz_targets/fuzz_policy_compose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_template_compile"
path = "fuzz_targets/fuzz_template_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_operation_args"
path = "fuzz_targets/fuzz_operation_args.rs"
test = false
doc = false
bench = false
