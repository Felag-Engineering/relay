# nfpm manifest for the Relay .deb and .rpm (RC-23, RC-24, RC-25, RC-26).
#
# A template, rendered by scripts/build-packages.sh: the @NAME@ placeholders are substituted
# before nfpm reads it, and nothing else is. The package wraps the release's guarded binary
# byte for byte; packaging compiles, strips and rewrites nothing (ADR-0033).
#
# Reproducibility: mtime is set explicitly from SOURCE_DATE_EPOCH, every file is listed by
# name with its mode and owner (no directory globbing, which would read source mtimes and
# modes), and the rpm build host is fixed. The release builds this twice and compares.
#
# Nothing here is configuration the package manager preserves: /etc/relay/relay.toml is
# generated by postinst on a first install only, and is never a package-owned file
# (ADR-0033 as amended 2026-10-15). Nothing under /etc or /var is in the payload.

name: relay
arch: "@ARCH@"
platform: linux
version: "@VERSION@"
version_schema: semver
release: "1"
section: admin
priority: optional
maintainer: "Felag Engineering <michael.rapp@gleipnir.dev>"
vendor: Felag Engineering
homepage: "https://github.com/Felag-Engineering/relay"
license: BUSL-1.1
description: |-
  Relay, the fleet-administration control plane.
  The package installs the Relay, its Unix account and its hardened unit.
  It never starts the Relay and never runs the first-boot command.
mtime: "@MTIME@"
umask: 0o022

contents:
  - src: "@RELAY_BIN@"
    dst: /usr/bin/relay
    file_info: {mode: 0o755, owner: root, group: root}
  - src: "@SRC@/relay/packaging/relay.service"
    dst: /usr/lib/systemd/system/relay.service
    file_info: {mode: 0o644, owner: root, group: root}
  - src: "@SRC@/relay/packaging/relay.sysusers.conf"
    dst: /usr/lib/sysusers.d/relay.conf
    file_info: {mode: 0o644, owner: root, group: root}
  - dst: /usr/share/relay
    type: dir
    file_info: {mode: 0o755, owner: root, group: root}
  - src: "@SRC@/relay/packaging/relay.toml.in"
    dst: /usr/share/relay/relay.toml.in
    file_info: {mode: 0o644, owner: root, group: root}
  - src: "@SRC@/relay/packaging/relay.toml.example"
    dst: /usr/share/relay/relay.toml.example
    file_info: {mode: 0o644, owner: root, group: root}
  - src: "@SRC@/relay/packaging/configuration-guide.txt"
    dst: /usr/share/relay/configuration-guide.txt
    file_info: {mode: 0o644, owner: root, group: root}
  - dst: /usr/share/doc/relay
    type: dir
    file_info: {mode: 0o755, owner: root, group: root}
  - src: "@SRC@/relay/packaging/configuration-guide.txt"
    dst: /usr/share/doc/relay/configuration-guide.txt
    file_info: {mode: 0o644, owner: root, group: root}
  - src: "@SRC@/LICENSE"
    dst: /usr/share/doc/relay/LICENSE
    file_info: {mode: 0o644, owner: root, group: root}

scripts:
  preinstall: "@SRC@/relay/packaging/scripts/preinst.sh"
  postinstall: "@SRC@/relay/packaging/scripts/postinst.sh"
  preremove: "@SRC@/relay/packaging/scripts/prerm.sh"
  postremove: "@SRC@/relay/packaging/scripts/postrm.sh"

deb:
  compression: gzip
rpm:
  compression: gzip
  buildhost: relay-release
  group: System Environment/Daemons
  summary: Relay, the fleet-administration control plane
