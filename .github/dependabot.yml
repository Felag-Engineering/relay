# Dependabot version updates: one grouped PR per ecosystem per month.
#
# Dependabot itself costs no Actions minutes; every PR it opens costs a full CI run. So
# updates are batched — monthly, every update in an ecosystem in one PR — rather than one
# PR per dependency per week. Security updates are separate: when GitHub's Dependabot
# security updates are enabled for the repository, a fix for a known advisory still
# arrives as soon as it exists, outside this schedule.
#
# cooldown: a release must be a week old before it is proposed, so a compromised or
# yanked-within-days version (the usual shape of a registry supply-chain attack) is
# not what the monthly PR picks up.
#
# Every PR this opens edits a dependency manifest, which is on the security surface
# (docs/agents/security-surface.txt): a human reviews and merges it like any other.
# Tool pins in the Makefile (golangci-lint, buf, the scanners) are not covered here.
# The Go proto generators ARE covered: they are `tool` directives in relay/go.mod
# (#891), and protoc-gen-go is the protobuf runtime module itself. A PR that moves
# either goes red on proto-drift until someone runs `make proto` on its branch.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      relay-go:
        patterns: ["*"]
    commit-message:
      prefix: "deps(relay)"

  - package-ecosystem: cargo
    directories:
      - /daemon
      - /daemon/fuzz
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      daemon-rust:
        patterns: ["*"]
    commit-message:
      prefix: "deps(daemon)"

  # Every `uses:` is pinned to a commit SHA with the version in a trailing comment;
  # Dependabot updates both. The composite actions under .github/actions/ pin actions
  # of their own, so they are listed explicitly.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"

  # The Relay image's one shipped base (docker/relay.Dockerfile, `os` stage) is pinned by
  # digest; this refreshes the tag and the digest together. golang is a deliberate ceiling
  # (#667) that never ships, and the rust/busybox bases are dev-fleet only.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-name: alpine
    commit-message:
      prefix: "deps(image)"
