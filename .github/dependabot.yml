# Dependabot version updates: one grouped PR per ecosystem per month.
#
# Dependabot itself costs no Actions minutes; every PR it opens costs a full CI run. So
# updates are batched — monthly, every update in an ecosystem in one PR — rather than one
# PR per dependency per week. Security updates are separate: with GitHub's Dependabot
# security updates enabled for the repository, a fix for a known advisory arrives as soon
# as it exists, outside this schedule and without the cooldown. Each entry's `*-security`
# group batches them, so a burst of advisories in one ecosystem is one PR, not one per
# dependency. GitHub cannot group across entries, so advisories in two ecosystems are two PRs.
#
# cooldown: a release must be a week old before it is proposed, so a compromised or
# yanked-within-days version (the usual shape of a registry supply-chain attack) is
# not what the monthly PR picks up.
#
# Every PR this opens edits a dependency manifest, which is on the security surface
# (docs/agents/security-surface.txt): a human reviews and merges it like any other.
# The Go proto generators are `tool` directives in relay/go.mod, and protoc-gen-go is the
# protobuf runtime module itself. A PR that moves either goes red on proto-drift until
# someone runs `make proto` on its branch. The other dev tools (buf, golangci-lint, the
# scanners) are one module each under tools/ (#891). `go mod tidy` records a tool's own
# require as `// indirect`, and Dependabot's gomod default updates direct dependencies
# only — hence the explicit `allow` lists on the two entries that carry tool pins.
# Security updates ignore `allow`; tools/README.md says how to treat those PRs.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-type: direct
      - dependency-name: google.golang.org/grpc/cmd/protoc-gen-go-grpc
        dependency-type: all
    groups:
      relay-go:
        patterns: ["*"]
      relay-go-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(relay)"

  # Version updates bump only the tool itself: bumping a tool's transitive dependencies on
  # their own would drift its build list away from what upstream tested (the gitleaks /
  # charmbracelet-ansi class of break). The lint and scan tools are listed by directory, not
  # as /tools/*, because tools/nfpm is not one of them: it builds release packages and has its
  # own entry below. A new tool directory must be added to one list or the other.
  - package-ecosystem: gomod
    directories:
      - /tools/actionlint
      - /tools/buf
      - /tools/gitleaks
      - /tools/golangci-lint
      - /tools/govulncheck
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/bufbuild/buf
        dependency-type: all
      - dependency-name: github.com/golangci/golangci-lint/v2
        dependency-type: all
      - dependency-name: golang.org/x/vuln
        dependency-type: all
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
      - dependency-name: github.com/zricethezav/gitleaks/v8
        dependency-type: all
    groups:
      go-tools:
        patterns: ["*"]
      go-tools-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(tools)"

  # nfpm writes the daemon's .deb and .rpm, so a bump changes release bytes. It is never grouped
  # with the lint tools, and its PRs say so in their prefix.
  - package-ecosystem: gomod
    directory: /tools/nfpm
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-name: github.com/goreleaser/nfpm/v2
        dependency-type: all
    groups:
      nfpm-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(release)"

  - package-ecosystem: cargo
    directories:
      - /daemon
      - /daemon/fuzz
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      daemon-rust:
        patterns: ["*"]
      daemon-rust-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(daemon)"

  # Every `uses:` is pinned to a commit SHA with the version in a trailing comment;
  # Dependabot updates both. The composite actions under .github/actions/ pin actions
  # of their own, so they are listed explicitly.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"

  # The Relay image's one shipped base (docker/relay.Dockerfile, `os` stage) is pinned by
  # digest; this refreshes the tag and the digest together. golang is a deliberate ceiling
  # (#667) that never ships, and the rust/busybox bases are dev-fleet only.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    allow:
      - dependency-name: alpine
    groups:
      image-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(image)"

  # The install matrix's five base images (docker/install-matrix/, one per DI-33 platform) are
  # pinned by multi-arch index digest, with the tag beside each digest; this refreshes the
  # digests. A tag never moves: each tag names the platform its row tests, and changing a
  # platform is a DI-33 change, never a dependency bump. So major and minor tag bumps are
  # ignored (Ubuntu 24.04 to 26.04, or to the non-LTS 24.10).
  - package-ecosystem: docker
    directory: /docker/install-matrix
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      install-matrix-images:
        patterns: ["*"]
      install-matrix-images-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "deps(ci)"
