name: Save Go build and module cache
description: >-
  Save ~/.cache/go-build and ~/go/pkg/mod under the key go-cache-restore computed. The
  caller owns the save policy through its `if:` (ci.yml: main only, on a miss).
inputs:
  key:
    description: go-cache-restore's cache-primary-key output.
    required: true
runs:
  using: composite
  steps:
    # The path list must stay byte-identical to go-cache-restore's: it is part of the
    # cache version, so a mismatch saves an entry the restore never finds.
    - name: Save Go build and module cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ inputs.key }}
