name: Go tools
description: >-
  Restore the pinned Go tool binaries (~/go/bin), run `make tools` on a miss, and save
  them. Self-contained: it saves on a miss from any ref, as ci.yml always has. The relay
  and proto jobs both use it, so they share one key expression by construction. Needs
  the repository checked out and Go set up first.
runs:
  using: composite
  steps:
    # Keyed on relay/go.mod's go/toolchain lines and every `go install` line in the
    # Makefile, so bumping a pin or the toolchain rebuilds the binaries. The paths are
    # workspace-relative: a composite `run` step starts in $GITHUB_WORKSPACE.
    - name: Go tools cache key
      id: keys
      shell: bash
      run: |
        echo "tools=$( { grep -E '^(go|toolchain) ' relay/go.mod; grep -hE '^\s+go install ' Makefile; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore Go tools
      id: tools-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        key: go-tools-${{ steps.keys.outputs.tools }}

    - name: Install Go tools (pinned in the Makefile)
      if: steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      run: make tools

    - name: Save Go tools
      if: steps.tools-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/bin
        key: ${{ steps.tools-cache.outputs.cache-primary-key }}
