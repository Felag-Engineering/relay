name: Restore Cargo registry and build cache
description: >-
  Restore the Cargo registry, git db and daemon/target, keyed per prefix, rustc version
  and ISO week. Pair it with cargo-cache-save at the end of the job: a composite action
  has no post step, so the save is a separate step that the caller places and gates.
inputs:
  prefix:
    description: >-
      Key prefix, evaluated by the caller: `cargo-<job id>` for the per-job caches,
      `cargo-musl` for the release build.
    required: true
  rust-cachekey:
    description: >-
      dtolnay/rust-toolchain's `cachekey` output. Passed in because a composite action's
      `steps` context cannot see the caller's steps.
    required: true
outputs:
  cache-hit:
    description: actions/cache/restore's cache-hit (an exact primary-key match).
    value: ${{ steps.restore.outputs.cache-hit }}
  cache-primary-key:
    description: The primary key, to hand to cargo-cache-save.
    value: ${{ steps.restore.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Cache week
      id: keys
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

    # Keyed on the rustc version: a new stable invalidates every artifact, so a cache
    # from the previous toolchain is never worth restoring. hashFiles() resolves against
    # $GITHUB_WORKSPACE, not the action's directory.
    - name: Restore Cargo registry and build cache
      id: restore
      uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          daemon/target
        key: ${{ inputs.prefix }}-${{ inputs.rust-cachekey }}-${{ hashFiles('daemon/Cargo.lock') }}-${{ steps.keys.outputs.week }}
        restore-keys: |
          ${{ inputs.prefix }}-${{ inputs.rust-cachekey }}-${{ hashFiles('daemon/Cargo.lock') }}-
          ${{ inputs.prefix }}-${{ inputs.rust-cachekey }}-
