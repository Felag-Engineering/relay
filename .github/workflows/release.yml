# Release CD (issue #250, closes #44; hardened by #892): on a v* tag, build both stamped
# binaries for linux/amd64 and linux/arm64 TWICE, fail unless the two builds are
# byte-identical, then publish a checksummed GitHub Release, a GHCR Relay image, SBOMs,
# keyless signatures and provenance attestations.
#
# The daemon is distributed to the fleet by the customer's config management
# (ADR-0014: the Relay never pushes binaries), so the artifact set here is the
# contract config management pins against — naming, checksums, and the
# verify-then-install path are documented in docs/operations/release-artifacts.md.
# Change the convention there and here together.
#
# Job graph (a "dry run" is every run that is not a v* tag push: pull_request and
# workflow_dispatch; it does all the building and guarding and publishes nothing):
#
#   build (arch x pass) -> reproducible -+-> install-matrix -+-> sign-push -> github-release
#   4 jobs, no privilege    diff, SBOMs,  |   the release's   |   packages,     contents:write
#                           guards        |   packages and    |   id-token,     (only job that can
#                                         |   role, on every  |   attestations   write a Release)
#                                         |   platform        |       \-> latest (packages:write only)
#                                         +-> image ----------+
#                                             OCI archive + guards
#
# `build` also wraps each daemon binary and each Relay binary in .deb and .rpm packages, and
# `reproducible` compares both passes' packages, guards them against the release binaries,
# writes an SBOM for each, and stages the Ansible role as a tarball. The packages, their SBOMs
# and the role are attached to the Release under SHA256SUMS, with the standalone relay-daemon
# and Relay units and example configuration. `install-matrix` runs the install matrix
# (install-matrix.yml) on exactly those bytes, and `sign-push`, the first job that publishes
# anything, needs it: a failing matrix row publishes nothing. Packages carry no signature of
# their own before v1.0.0 (DI-24, ADR-0033); the signed SHA256SUMS and the provenance
# attestation over its files cover them.
#
# The three privileged jobs never start on a dry run (job-level `if:`), so a pull request
# or a dispatch never holds id-token, packages, attestations or contents:write. This file
# is never run under pull_request_target.
#
# Trust argument. Everything that is signed was built by unprivileged jobs and checked
# before any privileged job runs: the binaries are the primary pass of a build that a second
# runner, from a different checkout path, reproduced byte for byte; the image is built once
# as an OCI archive and guarded by reading that archive's own bytes
# (scripts/release-image-guard.sh). `sign-push` compiles nothing: it signs and moves bytes
# that were already guarded. Nothing carries a version tag until it is signed, attested and
# verified: the image is pushed by digest, and `:<version>` and `:latest` are the last
# registry writes, made by copying the verified digest.
# No build cache is used anywhere, including the setup-qemu and setup-buildx actions' own.
#
# Re-running. Use "Re-run failed jobs", never "Re-run all jobs". A re-run of a failed
# `sign-push` reuses the successful `image` job's archive, so it carries the same digest;
# "Re-run all jobs" rebuilds the image, whose bytes are not reproducible, and `sign-push`
# then refuses to move an already-published version tag to a new digest. That refusal is by
# design: a published version never moves. See docs/operations/release-artifacts.md.
#
# Two things only a human can do, because neither is configurable from this file: restrict
# who may create, move or delete `v*` tags (a tag push is the only thing that triggers
# signing), and, optionally, put `sign-push`, `github-release` and `latest` behind a
# protected `release` environment with required reviewers.

name: Release

on:
  push:
    # Tags only — never branch pushes. `v*` matches every release tag this
    # project cuts (vX.Y.Z and prerelease forms like vX.Y.Z-beta).
    tags: ['v*']
  # A maintainer's dry run, from a BRANCH. A dispatch on a tag is refused (see `build`).
  workflow_dispatch: {}
  # A dry run on every change to what a release builds, so a break shows on the PR
  # rather than on the tag. Drafts are skipped.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/install-matrix.yml
      - docker/relay.Dockerfile
      - docker/install-matrix/**
      - .dockerignore
      - Makefile
      - scripts/build-version.sh
      - scripts/release-image-guard.sh
      - scripts/license-change-date.sh
      - scripts/catalog-ledger.sh
      - scripts/build-packages.sh
      - scripts/package-guard.sh
      - scripts/package-guard-test.sh
      - scripts/install-matrix-*.sh
      - scripts/relay-package-scripts-test.sh
      - daemon/packaging/**
      - relay/packaging/**
      - daemon/policy.default.toml
      - docs/operations/daemon-privilege-posture.md
      - tools/nfpm/**
      - LICENSE
      - daemon/Cargo.toml
      - daemon/Cargo.lock
      - relay/go.mod
      - relay/go.sum

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing inherits: every job declares exactly what it holds.
permissions: {}

env:
  # The one place the release's Rust toolchain is named: an exact stable, never a channel,
  # bumped deliberately (the daemon otherwise tracks stable, and there is no
  # rust-toolchain.toml — AGENTS.md). CI keeps `stable`, so CI sees a new stable first.
  RELEASE_RUST_TOOLCHAIN: 1.99.0

jobs:
  build:
    name: Build ${{ matrix.arch }} (${{ matrix.pass }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        pass: [primary, rebuild]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            daemon_triple: x86_64-unknown-linux-musl
            platform: linux-amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            daemon_triple: aarch64-unknown-linux-musl
            platform: linux-arm64
    env:
      # The second pass builds from a different absolute path, which is what the diff
      # downstream proves the binaries do not depend on.
      SRC: ${{ matrix.pass == 'primary' && 'src' || 'rebuild/nested/src' }}
      ARCH: ${{ matrix.arch }}
      PASS: ${{ matrix.pass }}
      DAEMON_TRIPLE: ${{ matrix.daemon_triple }}
      # The published artifact suffix (linux-amd64, linux-arm64); DAEMON_TRIPLE is only the
      # compiler target, never part of a published name (release-artifacts.md).
      PLATFORM: ${{ matrix.platform }}
      IS_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      # A dispatch on a tag would take the dry-run path below, whose guard demands a -0.dev
      # stamp, and fail confusingly on a correctly stamped release build.
      - name: Refuse a dispatch from a tag
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
        run: |
          echo "::error::dispatch from a branch; a release runs only from the tag push"
          exit 1

      # fetch-depth: 0 is load-bearing, not a convenience: the version stamp
      # (scripts/build-version.sh) reports the release version ONLY when the
      # tag v<Cargo.toml version> is visible on a clean HEAD. A shallow,
      # tagless checkout would stamp `<base>-dev+g<sha>` and the guard below
      # would fail the release. Whether a default-depth checkout of a tag ref
      # exposes the tag to `git tag --points-at HEAD` is version-dependent
      # actions/checkout behaviour — so fetch everything, explicitly.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ${{ env.SRC }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ env.SRC }}/relay/go.mod
          cache: false

      - name: Set up Rust (pinned, musl target)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
          targets: ${{ matrix.daemon_triple }}

      - name: Assert the pinned toolchain is the one in use
        run: |
          set -euo pipefail
          rustc --version
          case "$(rustc --version)" in
            "rustc ${RELEASE_RUST_TOOLCHAIN} "*) ;;
            *) echo "::error::rustc is not ${RELEASE_RUST_TOOLCHAIN}"; exit 1 ;;
          esac

      # apt-get update is required on the arm image. Native on both arches: no cross
      # toolchain, because Ubuntu packages no aarch64 musl C compiler for ring.
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # No build caches here, deliberately (zizmor: cache-poisoning). A cache restored
      # into this job would feed objects built by some earlier run into the binaries
      # the fleet installs; a release is rare enough that a cold build costs nothing
      # worth that. The toolchain setups above are told not to cache for the same reason.

      # Pin the build date to the tagged commit's committer date so a rebuild of
      # the same tag reproduces the same bytes — and therefore the same SHA256.
      # Without this the stamp carries the wall-clock UTC date and a rebuild on
      # another day hashes differently, foreclosing rebuild-and-compare
      # verification (docs/operations/version-stamping.md, "Reproducibility
      # limit"). scripts/build-version.sh honours SOURCE_DATE_EPOCH.
      - name: Pin SOURCE_DATE_EPOCH to the tagged commit
        run: |
          cd "$SRC"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"

      # The BSL Change Date in LICENSE must be three years after this release ships, never
      # one left over from an earlier release (scripts/license-change-date.sh). The release
      # date is the day the tag push runs. A dry run measures from today and only warns, so a
      # stale date is visible on a pull request without blocking it; a tag push fails.
      - name: Check the license Change Date
        run: |
          set -euo pipefail
          cd "$SRC"
          if [ "$IS_RELEASE" = "true" ]; then
            scripts/license-change-date.sh "$(date -u +%F)" LICENSE
          else
            scripts/license-change-date.sh --warn "$(date -u +%F)" LICENSE
          fi

      # The release refuses a catalog Template name without an active ledger entry, and a
      # ledger changed other than by append or withdrawal since any release (DI-30, ADR-0021
      # amendment 2026-10-15). A refusal fails dry runs and tag pushes alike. No visible v* tag
      # (exit 3) means nothing has been released, so nothing is frozen: a dry run warns and goes
      # on, and a tag push fails, because the tag being released is always visible to it.
      - name: Check the catalog ledger
        run: |
          set -euo pipefail
          cd "$SRC"
          rc=0
          out=$(bash scripts/catalog-ledger.sh check 2>&1) || rc=$?
          if [ "$rc" -eq 3 ] && [ "$IS_RELEASE" != "true" ]; then
            echo "::warning::catalog-ledger: no release tag visible; nothing is frozen until the first v* tag"
            exit 0
          fi
          printf '%s\n' "$out"
          exit "$rc"

      # The script above compares the ledger across releases; these tests compare the shipped
      # catalog's bodies and risk classes with the ledger, so a tag pushed on a commit that
      # skipped CI cannot ship a changed Template under a released name. Once, on the primary
      # pass: the rebuild pass builds the same commit.
      - name: Check the catalog against the ledger
        if: matrix.pass == 'primary'
        run: |
          set -euo pipefail
          cd "$SRC"
          cargo test --locked --manifest-path daemon/Cargo.toml catalog::

      # What the build ran on, written next to the artifacts and echoed. Not a release
      # asset: it is what `reproducible` prints beside a mismatch, so a runner-image or
      # compiler difference is visible rather than a mystery. Outside the checkout, so it
      # can never make the tree dirty.
      - name: Record the build environment
        run: |
          set -uo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          {
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "machine: $(uname -m)"
            echo "gcc: $(gcc --version | head -1)"
            echo "musl-gcc: $(musl-gcc -v 2>&1 | tail -1)"
            dpkg-query -W musl-tools
            rustc -vV
            cargo -V
            go version
            echo "nfpm: $(GOWORK=off go -C "$SRC/tools/nfpm" list -m all | grep goreleaser/nfpm)"
            echo "SOURCE_DATE_EPOCH: ${SOURCE_DATE_EPOCH}"
            echo "commit: $(git -C "$SRC" rev-parse HEAD)"
          } | tee "$GITHUB_WORKSPACE/dist/BUILDENV.${ARCH}.${PASS}"

      # Both binaries via the Makefile's stamped targets — the same recipes as
      # local builds and CI, no parallel build path. (docker/daemon.Dockerfile is
      # deliberately NOT the release recipe: it builds unstamped, for the dev
      # fleet.)
      - name: Build relay (stamped, static)
        run: |
          cd "$SRC"
          make build-relay

      - name: Build relay-daemon (stamped, static musl)
        run: |
          cd "$SRC"
          make build-daemon-release RELEASE_DAEMON_TARGET="$DAEMON_TRIPLE"

      # ---- stamped-version-equals-tag guard ----
      # The single assertion that keeps "the published artifact reports its true
      # version" from being silently false. Asserting equality with the
      # triggering tag (not merely "no -dev") also catches the multi-tag case:
      # two v* tags on one commit would stamp whichever matches Cargo.toml, and
      # a CD run for the other tag must fail, not publish a mislabeled binary.
      # Failure modes this catches (see issue #250):
      #   - Cargo.toml not bumped to the tag's version -> stamp is X.Y.Z-dev+g<sha>
      #   - Cargo.toml bumped past the tag             -> stamp is a -dev of an unshipped version
      #   - tag invisible to the checkout              -> stamp takes the -dev path
      # On a dry run there is no tag: the expected stamp is the one the checkout
      # computes for itself, and it must be a -0.dev stamp, so a dry run can never be
      # mistaken for a release build.
      - name: Guard - stamped version equals tag
        run: |
          set -euo pipefail
          cd "$SRC"
          if [ "${IS_RELEASE}" = "true" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v$(bash scripts/build-version.sh | awk '{print $1}')"
            case "${tag}" in
              *-0.dev*) ;;
              *) echo "::error::a dry run must stamp a -0.dev version, got '${tag}'"; exit 1 ;;
            esac
          fi
          relay_v="$(relay/bin/relay --version | awk '{print $2}')"
          daemon_v="$("$(make -s print-release-daemon-bin RELEASE_DAEMON_TARGET="$DAEMON_TRIPLE")" --version | awk '{print $2}')"
          echo "tag=${tag} relay=${relay_v} relay-daemon=${daemon_v}"
          fail=0
          if [ "v${relay_v}" != "${tag}" ]; then
            echo "::error::relay stamped version '${relay_v}' does not equal tag '${tag}'"
            fail=1
          fi
          if [ "v${daemon_v}" != "${tag}" ]; then
            echo "::error::relay-daemon stamped version '${daemon_v}' does not equal tag '${tag}'"
            fail=1
          fi
          [ "${fail}" -eq 0 ] || exit 1
          echo "EXPECTED_TAG=${tag}" >> "$GITHUB_ENV"

      # Both artifacts must be static (ADR-0007): the daemon drops onto arbitrary fleet
      # Nodes with no libc expectations, and the Relay now runs in an alpine image and must
      # not depend on the runner's glibc. ldd prints "statically linked" (static-pie) or
      # "not a dynamic executable" depending on version; accept either, fail on anything else.
      - name: Guard - binaries are static
        run: |
          set -uo pipefail
          cd "$SRC"
          fail=0
          for bin in "$(make -s print-release-daemon-bin RELEASE_DAEMON_TARGET="$DAEMON_TRIPLE")" relay/bin/relay; do
            out="$(ldd "${bin}" 2>&1 || true)"
            echo "${bin}: ${out}"
            echo "${out}" | grep -Eq 'statically linked|not a dynamic executable' || { echo "::error::${bin} is not static"; fail=1; }
          done
          exit "${fail}"

      # ---- stage artifacts under the documented naming convention ----
      # <binary>-<version>-<target-triple>; <version> is the tag without the
      # leading v, so the filename, the tag, and `--version` all agree. The
      # convention is contract (docs/operations/release-artifacts.md).
      - name: Stage artifacts and generate SHA256SUMS
        run: |
          set -euo pipefail
          version="${EXPECTED_TAG#v}"
          daemon_bin="$(cd "$SRC" && make -s print-release-daemon-bin RELEASE_DAEMON_TARGET="$DAEMON_TRIPLE")"
          cp "${daemon_bin}" "dist/relay-daemon-${version}-${PLATFORM}"
          cp "$SRC/relay/bin/relay" "dist/relay-${version}-${PLATFORM}"
          cd dist
          # Bare filenames in SHA256SUMS so `sha256sum --check` works from any
          # download directory.
          sha256sum "relay-daemon-${version}-${PLATFORM}" \
                    "relay-${version}-${PLATFORM}" > "SHA256SUMS.${ARCH}"
          cat "SHA256SUMS.${ARCH}"

      # The packages wrap the binaries staged above, byte for byte: packaging compiles, strips
      # and rewrites nothing (DI-24, RC-23, ADR-0033). nfpm is the one pinned under tools/nfpm, and
      # every manifest's mtime comes from SOURCE_DATE_EPOCH, so the rebuild pass, from its
      # different checkout path, must produce the same bytes; `reproducible` compares them.
      - name: Build the packages from the staged binaries
        run: |
          set -euo pipefail
          version="${EXPECTED_TAG#v}"
          bash "$SRC/scripts/build-packages.sh" "${version}" "${ARCH}" \
            "dist/relay-daemon-${version}-${PLATFORM}" dist/packages \
            --relay "dist/relay-${version}-${PLATFORM}"
          (cd dist/packages && sha256sum -- * > "../SHA256SUMS.packages.${ARCH}")
          cat "dist/SHA256SUMS.packages.${ARCH}"

      # The package build and guards' own tests, once: the guards `reproducible` relies on
      # must refuse what they claim to refuse.
      - name: Test the package build and guards
        if: matrix.arch == 'x86_64' && matrix.pass == 'primary'
        run: |
          set -euo pipefail
          sudo apt-get install -y rpm rpm2cpio cpio
          cd "$SRC"
          bash scripts/relay-package-scripts-test.sh
          bash scripts/package-guard-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}-${{ matrix.pass }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Rebuild-and-diff. What this proves, and no more: the build is deterministic for this
  # commit, toolchain and runner-image family, and independent of the checkout path (the two
  # passes ran on separate VMs from different directories). It does NOT prove independence
  # from GitHub's infrastructure or from the toolchain downloads, which both passes share, nor
  # that the source is benign. It is the precondition for a third party's independent
  # rebuild, not a substitute for one.
  reproducible:
    name: Rebuild matches, SBOMs
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.assemble.outputs.version }}
      # The install matrix builds its old package set with the release's toolchain; `env` is
      # not available to a reusable workflow's `with:`, but it is here.
      rust_toolchain: ${{ env.RELEASE_RUST_TOOLCHAIN }}
      # The digest of the SHA256SUMS this job uploads in release-dist; the install matrix and
      # sign-push each refuse a downloaded SHA256SUMS that differs.
      sums_sha256: ${{ steps.sums.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bins

      - name: Diff the two passes
        run: |
          set -uo pipefail
          fail=0
          for arch in x86_64 aarch64; do
            a="bins/bin-${arch}-primary"
            b="bins/bin-${arch}-rebuild"
            echo "== ${arch}: build environments (empty diff is the expected case)"
            diff -y "${a}/BUILDENV.${arch}.primary" "${b}/BUILDENV.${arch}.rebuild" || true
            if ! diff "${a}/SHA256SUMS.${arch}" "${b}/SHA256SUMS.${arch}"; then
              echo "::error::${arch}: the rebuild's SHA256SUMS differs from the primary build's"
              fail=1
              continue
            fi
            for f in "${a}"/relay-*; do
              cmp "${f}" "${b}/$(basename "${f}")" || { echo "::error::${arch}: $(basename "${f}") differs"; fail=1; }
            done
            # The packages are compared exactly as the binaries are (DI-24).
            if ! diff "${a}/SHA256SUMS.packages.${arch}" "${b}/SHA256SUMS.packages.${arch}"; then
              echo "::error::${arch}: the rebuild's packages differ from the primary build's"
              fail=1
              continue
            fi
            want=4
            n="$(find "${a}/packages" -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)"
            if [ "${n}" -ne "${want}" ]; then
              echo "::error::${arch}: ${n} packages built, expected ${want}"
              fail=1
            fi
            for f in "${a}"/packages/*; do
              cmp "${f}" "${b}/packages/$(basename "${f}")" || { echo "::error::${arch}: $(basename "${f}") differs"; fail=1; }
            done
          done
          exit "${fail}"

      # The release set is the primary pass's. The rebuild existed only to be compared.
      - name: Assemble the release directory
        id: assemble
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in x86_64 aarch64; do
            cp bins/bin-"${arch}"-primary/relay-* dist/
          done
          ls -l dist
          # relay-[0-9]*: the Relay binary, never relay-daemon-*; a version starts with a digit.
          probe="$(basename dist/relay-[0-9]*-linux-amd64)"
          version="${probe#relay-}"
          version="${version%-linux-amd64}"
          if [ -z "${version}" ] || [ "${version}" = "${probe}" ]; then
            echo "::error::cannot derive the version from the artifact names"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      # SPDX JSON, one per binary. The Relay's come from the Go build info in the binary (the
      # exact module set). A stripped Rust binary carries no dependency metadata syft can
      # read, so the daemon's come from Cargo.lock: a superset (every target, dev and build
      # dependencies). SBOMs are not reproducible (timestamps, UUIDs) and are not part of
      # the diff above.
      - name: SBOMs for the binaries
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for f in dist/relay-*; do
            case "$(basename "${f}")" in
              relay-daemon-*) "${SYFT}" scan "file:daemon/Cargo.lock" -o "spdx-json=${f}.spdx.json" ;;
              *)              "${SYFT}" scan "file:${f}" -o "spdx-json=${f}.spdx.json" ;;
            esac
          done

      # A hand-built install verifies its units and example configuration like everything else
      # (DI-32), so they are release attachments under SHA256SUMS: the relay-daemon's unit and
      # environment example, and the Relay's unit and example configuration. Staged after the
      # SBOMs, which describe binaries only.
      - name: Stage the standalone units and example configuration
        run: |
          set -euo pipefail
          cp daemon/packaging/relay-daemon.service dist/relay-daemon.service
          cp daemon/packaging/relay-daemon.env.example dist/relay-daemon.env.example
          cp relay/packaging/relay.service dist/relay.service
          cp relay/packaging/relay.toml.example dist/relay.toml.example

      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install -y rpm rpm2cpio cpio

      # The packages are guarded by reading their own bytes (scripts/package-guard.sh):
      #   - each relay-daemon package's /usr/bin/relay-daemon and each Relay package's
      #     /usr/bin/relay is the release binary (DI-24, RC-23);
      #   - their units and the example configuration and environment example are the attached
      #     standalone files (DI-32);
      #   - each relay-daemon package carries the shipped catalog (DI-29), and no package
      #     declares configuration the package manager would preserve (ADR-0033);
      #   - every package's identity -- name, epoch, version and architecture, computed from
      #     this release's version and the pass's architecture, never read from the package --
      #     and its whole content -- payload listing with modes and owners, no setuid,
      #     setgid or file capability, maintainer scripts, triggers, relationships and control
      #     fields, and every file carried from the repository -- equals what the repository
      #     says (`content`, against daemon/packaging/expected and daemon/packaging/scripts);
      #   - every package is listed in the sums both passes agreed on.
      # `content` reads with dpkg-deb and rpm, never nfpm, because the two-pass comparison
      # above cannot catch a compromised or buggy packager: both passes run the same pinned
      # nfpm, so a deterministic fault produces the same wrong bytes twice. The comparison
      # proves determinism; `content` is the integrity check.
      #
      # A guarded package is copied into dist/, the release set, and so is attached to the
      # Release under SHA256SUMS. It is not signed on its own: the signed SHA256SUMS covers it.
      # `install-matrix` proves these same bytes on every supported platform (DI-33) before
      # `sign-push`, the first job that publishes anything, may run. A prerelease version's
      # "~" is written "." in the file name, because GitHub rewrites characters like it in an
      # asset's name; the package's own version metadata is unchanged.
      - name: Guard - packages wrap the release binary and the attached unit
        env:
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          guard=scripts/package-guard.sh
          for p in x86_64:linux-amd64 aarch64:linux-arm64; do
            arch="${p%%:*}"; platform="${p##*:}"
            bin="dist/relay-daemon-${VERSION}-${platform}"
            [ -f "${bin}" ] || { echo "::error::no release binary ${bin}"; exit 1; }
            relay_bin="dist/relay-${VERSION}-${platform}"
            [ -f "${relay_bin}" ] || { echo "::error::no release binary ${relay_bin}"; exit 1; }
            for f in bins/bin-"${arch}"-primary/packages/*; do
              case "$(basename "${f}")" in
                relay-daemon[_-]*)
                  bash "${guard}" same "${f}" /usr/bin/relay-daemon "${bin}"
                  bash "${guard}" same "${f}" /usr/lib/systemd/system/relay-daemon.service dist/relay-daemon.service
                  bash "${guard}" same "${f}" /usr/share/relay-daemon/relay-daemon.env.example dist/relay-daemon.env.example
                  bash "${guard}" content "${f}" relay-daemon "${VERSION}" "${arch}"
                  ;;
                relay_*.deb | relay-[0-9]*.rpm)
                  bash "${guard}" same "${f}" /usr/bin/relay "${relay_bin}"
                  bash "${guard}" same "${f}" /usr/lib/systemd/system/relay.service dist/relay.service
                  bash "${guard}" same "${f}" /usr/share/relay/relay.toml.example dist/relay.toml.example
                  bash "${guard}" content "${f}" relay "${VERSION}" "${arch}"
                  ;;
                *) echo "::error::unexpected package $(basename "${f}")"; exit 1 ;;
              esac
              bash "${guard}" no-config "${f}"
              # The digest both passes agreed on (compared above) is this package's.
              bash "${guard}" listed "bins/bin-${arch}-primary/SHA256SUMS.packages.${arch}" "${f}"
              asset="$(basename "${f}" | tr '~' '.')"
              cp "${f}" "dist/${asset}"
            done
          done
          n="$(find dist -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) | wc -l)"
          [ "${n}" -eq 8 ] || { echo "::error::${n} packages staged for the release, expected 8"; exit 1; }

      # The Ansible role is a release artifact (DI-45, ADR-0048). It compiles nothing and
      # carries repository files only, so it is checked by content rather than built twice: the
      # tarball is built from the tagged commit (sorted, owner 0, the commit's time as its
      # mtime), and what it extracts to must equal the role in the checkout. The name stays
      # outside the relay-* glob that the binaries' loops use.
      - name: Stage the Ansible role
        env:
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          tarball="dist/relay_daemon-${VERSION}.tar.gz"
          epoch="$(git log -1 --format=%ct HEAD)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            --mode='u=rwX,go=rX' --format=gnu -C daemon/packaging/ansible -cf - relay_daemon \
            | gzip -9n > "${tarball}"
          # Every member is a regular file or a directory, inside relay_daemon/ and with no
          # ".." component. awk reads all its input, so no pipe is cut short.
          tar -tzf "${tarball}" | awk '
            $0 !~ /^relay_daemon\// || $0 ~ /(^|\/)\.\.(\/|$)/ { print "::error::member outside relay_daemon/: " $0; bad = 1 }
            END { exit bad }'
          tar -tvzf "${tarball}" | awk '
            { t = substr($0, 1, 1) }
            t != "-" && t != "d" { print "::error::member that is neither a file nor a directory: " $0; bad = 1 }
            END { exit bad }'
          check="$(mktemp -d)"
          tar -xzf "${tarball}" --no-same-owner -C "${check}"
          diff -r "${check}/relay_daemon" daemon/packaging/ansible/relay_daemon
          rm -rf "${check}"

      # One SPDX SBOM per package. A package's lists the dependencies of the binary it wraps
      # byte for byte (the content guard above proves the wrap): the Relay's from the Go build
      # info in that binary, the daemon's from Cargo.lock, as for the binaries' own SBOMs. The
      # rest of a package's payload is repository files with no third-party dependency.
      - name: SBOMs for the packages
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          VERSION: ${{ steps.assemble.outputs.version }}
        run: |
          set -euo pipefail
          for f in dist/*.deb dist/*.rpm; do
            name="$(basename "${f}")"
            case "${name}" in
              *_amd64.deb | *.x86_64.rpm) platform=linux-amd64 ;;
              *_arm64.deb | *.aarch64.rpm) platform=linux-arm64 ;;
              *) echo "::error::cannot tell the architecture of ${name}"; exit 1 ;;
            esac
            case "${name}" in
              relay-daemon[_-]*) src="file:daemon/Cargo.lock" ;;
              relay_*.deb | relay-[0-9]*.rpm) src="file:dist/relay-${VERSION}-${platform}" ;;
              *) echo "::error::unexpected package ${name}"; exit 1 ;;
            esac
            "${SYFT}" scan "${src}" --source-name "${name}" --source-version "${VERSION}" \
              -o "spdx-json=${f}.spdx.json"
          done

      # The last step to touch dist/: SHA256SUMS lists everything the Release attaches. The
      # globs name each family explicitly, because `relay-*` alone matches neither relay.service,
      # relay.toml.example, the Relay's .deb nor the role tarball (`relay_*` does), and a file
      # attached without a line would not be verified by anyone. The completeness check then
      # refuses any file left unlisted. Every name must be one GitHub stores as given.
      # The sums' digest is this job's output, so later jobs can tell the artifact they download
      # is the one this step wrote.
      - name: Generate SHA256SUMS
        id: sums
        env:
          RELEASE_TAG_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          # A published release's names are ^[A-Za-z0-9._-]+$. A dry run's version may carry a
          # "+" (build metadata), which a tagged release's never does, so only a dry run allows it.
          pattern='^[A-Za-z0-9._+-]+$'
          [ "${RELEASE_TAG_PUSH}" != "true" ] || pattern='^[A-Za-z0-9._-]+$'
          odd="$(find dist -maxdepth 1 -type f -printf '%f\n' | { grep -vE "${pattern}" || true; })"
          [ -z "${odd}" ] || { echo "::error::file names GitHub may rewrite: ${odd}"; exit 1; }
          cd dist
          sha256sum relay-* relay_* relay.service relay.toml.example > SHA256SUMS
          cat SHA256SUMS
          cd ..
          mapfile -d '' -t attached < <(find dist -maxdepth 1 -type f ! -name SHA256SUMS -print0)
          bash scripts/package-guard.sh listed dist/SHA256SUMS "${attached[@]}"
          echo "sha256=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  image:
    name: Build and guard the Relay image
    needs: reproducible
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.reproducible.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      # The image carries the released binary byte for byte, supplied as a named build
      # context; the Dockerfile's `release` stage compiles nothing.
      - name: Prepare the binary build context
        run: |
          set -euo pipefail
          mkdir -p dist/image
          cp "dist/relay-${VERSION}-linux-amd64" dist/image/relay-linux-amd64
          cp "dist/relay-${VERSION}-linux-arm64" dist/image/relay-linux-arm64

      # Both actions default to restoring tool images and binaries from the Actions cache,
      # which would put a cache into the chain that produces the signed image. Off. Their
      # tool images are pinned by digest instead.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          cache-binary: false

      - name: Build the image as an OCI archive
        env:
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --file docker/relay.Dockerfile \
            --target release \
            --build-context "release-binary=${PWD}/dist/image" \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${REVISION}" \
            --provenance=false --sbom=false \
            --output type=oci,dest=relay-image.oci.tar \
            .

      # skopeo extracts a platform from the archive for the guard's --version step (through a
      # docker-archive file, not the Docker daemon API) and pushes the archive later.
      - name: Ensure skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      # The guards read THE ARCHIVE'S bytes — the same file `sign-push` will push — never a
      # separately built image: the binary's sha256 against SHA256SUMS, the config's User and
      # Entrypoint, and (on the image loaded from the archive itself) --version against the
      # stamp. arm64 runs under QEMU.
      - name: Guard - image binary, user, entrypoint and version
        run: |
          set -euo pipefail
          for p in amd64:x86_64 arm64:aarch64; do
            goarch="${p%%:*}"; arch="${p##*:}"
            sha="$(awk -v n="relay-${VERSION}-linux-${goarch}" '$2 == n {print $1}' dist/SHA256SUMS)"
            [ -n "${sha}" ] || { echo "::error::no SHA256SUMS line for the ${arch} relay"; exit 1; }
            bash scripts/release-image-guard.sh relay-image.oci.tar "linux/${goarch}" "${sha}" "${VERSION}"
          done

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.54.1

      - name: Image SBOMs and digest
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          for p in amd64 arm64; do
            "${SYFT}" scan oci-archive:relay-image.oci.tar --platform "linux/${p}" \
              -o "spdx-json=relay-image-${VERSION}-linux-${p}.spdx.json"
          done
          sha256sum relay-image.oci.tar > relay-image.oci.tar.sha256
          # The image index's digest, which is what the registry will report after a push.
          tar -xOf relay-image.oci.tar index.json \
            | jq -er 'if (.manifests | length) == 1 then .manifests[0].digest else error("index.json must name exactly one manifest") end' \
            > relay-image.digest
          cat relay-image.digest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: |
            relay-image.oci.tar
            relay-image.oci.tar.sha256
            relay-image.digest
            relay-image-*.spdx.json
          if-no-files-found: error
          retention-days: 7

  # The install matrix, on exactly the packages and role this release attaches: it takes them
  # from the release-dist artifact and checks each against the SHA256SUMS that gets signed
  # (DI-24). It holds no write privilege and has no `if:`, so a dry run rehearses it too.
  install-matrix:
    name: Install matrix (the release's packages and role)
    needs: reproducible
    permissions:
      contents: read
    uses: ./.github/workflows/install-matrix.yml
    with:
      rust-toolchain: ${{ needs.reproducible.outputs.rust_toolchain }}
      release-dist: release-dist
      release-version: ${{ needs.reproducible.outputs.version }}
      release-sums-sha256: ${{ needs.reproducible.outputs.sums_sha256 }}

  # Signs and publishes; builds nothing. Never gets an `always()` or `!cancelled()` job
  # condition: it runs only after every job above succeeded, on a tag push. It is the first job
  # that publishes anything (a Rekor entry, then GHCR), so needing the install matrix here
  # gates every publication: `latest` and `github-release` inherit it through their own needs.
  sign-push:
    name: Sign and push
    needs: [reproducible, image, install-matrix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      packages: write       # push to ghcr.io
      id-token: write       # Fulcio keyless certificate (cosign) and attestation signing
      attestations: write   # actions/attest-build-provenance
    env:
      IMAGE: ghcr.io/felag-engineering/relay
    steps:
      # Fail closed. Signing writes to the public Rekor log from a private repository
      # (cosign sign-blob does so before attestation can fail), and attestations on a private
      # repository need a plan that supports them, and the release attaches packages carrying
      # a unit whose syscall filter only a person on a real systemd host can check. Until the
      # owner records all three decisions as repository variables this job errors; an unset
      # variable is an error, never a skip, because a release without signatures must not look
      # like one. `vars` also resolves organization- and environment-level variables.
      - name: Decision gate
        env:
          REKOR: ${{ vars.RELEASE_PUBLIC_REKOR_ACCEPTED }}
          ATTEST: ${{ vars.RELEASE_ATTESTATIONS_AVAILABLE }}
          SYSCALL_FILTER: ${{ vars.RELEASE_UNIT_SYSCALL_FILTER_SIGNED_OFF }}
        run: |
          [ "${REKOR}" = "true" ] || { echo "::error::D1 unrecorded: set repository variable RELEASE_PUBLIC_REKOR_ACCEPTED=true once the owner accepts public Rekor entries for this private repository"; exit 1; }
          [ "${ATTEST}" = "true" ] || { echo "::error::D2 unrecorded: set RELEASE_ATTESTATIONS_AVAILABLE=true once the organization's plan supports artifact attestations on a private repository"; exit 1; }
          [ "${SYSCALL_FILTER}" = "true" ] || { echo "::error::D3 unrecorded: set repository variable RELEASE_UNIT_SYSCALL_FILTER_SIGNED_OFF=true once the owner has checked the unit's syscall filter by hand on a real systemd host (the release attaches packages carrying the unit)"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: image

      - name: Check the artifacts are the ones that were guarded
        env:
          SUMS_SHA256: ${{ needs.reproducible.outputs.sums_sha256 }}
        run: |
          set -euo pipefail
          # Before anything is appended to SHA256SUMS: the file signed is the one `reproducible`
          # wrote and the install matrix ran against.
          [[ "${SUMS_SHA256}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the reproducible job"; exit 1; }
          actual="$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)"
          [ "${actual}" = "${SUMS_SHA256}" ] \
            || { echo "::error::dist/SHA256SUMS is not the one the reproducible job wrote (${actual}, want ${SUMS_SHA256})"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [ -e "dist/relay-${version}-linux-amd64" ] \
            || { echo "::error::the built artifacts are not version ${version}"; exit 1; }
          (cd image && sha256sum --check relay-image.oci.tar.sha256)
          cp image/relay-image-*.spdx.json dist/
          (cd dist && sha256sum relay-image-*.spdx.json >> SHA256SUMS && sha256sum --check SHA256SUMS)
          # github-release attaches every file in dist/, so a file the sums do not list would
          # be attached unsigned. The checkout is not here to run package-guard.sh, so the same
          # completeness check is by name: --check proved every listed file's bytes, and the
          # files present must be exactly the files listed.
          present="$(cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort)"
          listed="$(awk '{print $2}' dist/SHA256SUMS | LC_ALL=C sort)"
          [ "${present}" = "${listed}" ] \
            || { echo "::error::dist/ and SHA256SUMS list different files:"; diff <(echo "${present}") <(echo "${listed}") || true; exit 1; }

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Steps that do not touch the registry come first, so a failure there leaves nothing
      # published; the registry steps then sign before anything is tagged.
      - name: Sign SHA256SUMS (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      # The identity is pinned to this workflow at this ref, so a signature from any other
      # workflow, repository or ref fails. --signer-workflow and --source-ref are always set
      # on gh attestation verify; without them any workflow in the repository satisfies it.
      - name: Verify what was just signed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob --bundle dist/SHA256SUMS.sigstore.json \
            --certificate-identity "${id}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
          for f in dist/relay-*-linux-amd64 dist/relay-*-linux-arm64; do
            case "${f}" in *.spdx.json) continue ;; esac
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-ref "${GITHUB_REF}"
          done

      # One login serves skopeo (which falls back to ~/.docker/config.json), cosign, and
      # attest-build-provenance's push-to-registry, which reads the docker config.
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Ensure skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      # A published version is never moved. Proceed only when the registry says specifically
      # that the version does not exist yet, or that it already holds exactly this digest (an
      # idempotent re-push). Any other inspect error — an outage, a denial — fails the job
      # rather than being read as "absent".
      - name: Refuse to retag
        id: digest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          digest="$(cat image/relay-image.digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::malformed image digest '${digest}'"; exit 1; }
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          set +e
          err="$(skopeo inspect --raw "docker://${IMAGE}:${version}" 2>&1 >existing.json)"
          rc=$?
          set -e
          if [ "${rc}" -eq 0 ]; then
            existing="sha256:$(sha256sum existing.json | awk '{print $1}')"
            if [ "${existing}" != "${digest}" ]; then
              echo "::error::${IMAGE}:${version} already points at ${existing}; a published version is never moved. Re-run with 'Re-run failed jobs' (it reuses this run's image artifact) or cut a new tag."
              exit 1
            fi
            echo "::notice::${IMAGE}:${version} already holds ${digest}; continuing"
          elif grep -Eqi 'manifest unknown|MANIFEST_UNKNOWN|name unknown|NAME_UNKNOWN' <<<"${err}"; then
            echo "${IMAGE}:${version} does not exist yet"
          else
            echo "::error::cannot tell whether ${IMAGE}:${version} exists: ${err}"
            exit 1
          fi

      # The archive that was guarded, pushed unchanged (same bytes, same digests) BY DIGEST:
      # no version tag exists yet, so nothing can pull an unsigned `:<version>`.
      - name: Push the image by digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          skopeo copy --all --preserve-digests \
            oci-archive:image/relay-image.oci.tar "docker://${IMAGE}@${DIGEST}"
          skopeo inspect --raw "docker://${IMAGE}@${DIGEST}" > pushed.json
          pushed="sha256:$(sha256sum pushed.json | awk '{print $1}')"
          [ "${pushed}" = "${DIGEST}" ] || { echo "::error::registry holds ${pushed}, pushed ${DIGEST}"; exit 1; }

      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"

      # create-storage-record: false — v4 would otherwise write a storage record, which
      # needs the artifact-metadata: write permission this job does not hold.
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify the image signature
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      # The version tag is the last registry write for this release: it is made only now that
      # the digest is signed, attested and verified, by copying that digest. The retag check
      # above already proved the tag is absent or already this digest.
      - name: Tag the verified digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          skopeo copy --all --preserve-digests "docker://${IMAGE}@${DIGEST}" "docker://${IMAGE}:${version}"
          skopeo inspect --raw "docker://${IMAGE}:${version}" > tagged.json
          tagged="sha256:$(sha256sum tagged.json | awk '{print $1}')"
          [ "${tagged}" = "${DIGEST}" ] || { echo "::error::${IMAGE}:${version} holds ${tagged}, want ${DIGEST}"; exit 1; }

      # The credential must not outlive the steps that used it, whether or not they passed.
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # :latest follows the highest version tag, prereleases included. Git's version sort, told
  # that a `-` suffix is a prerelease, orders v0.2.0-rc.1 below v0.2.0 (plain `sort -V` does
  # not); a tag pushed below the highest, such as a backport, leaves :latest where it is. A job of
  # its own, in its own concurrency group, so two tags cut close together cannot race on it;
  # a run superseded while pending loses only its :latest move, and the next run recomputes
  # the highest tag. It holds packages:write and nothing else, and only runs once the digest
  # has been signed and tagged.
  latest:
    name: Move :latest
    needs: [sign-push, image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-latest
      cancel-in-progress: false
    permissions:
      contents: read  # private repo: actions/checkout needs it for `git tag -l`
      packages: write
    env:
      IMAGE: ghcr.io/felag-engineering/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
          path: image

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Ensure skopeo
        run: command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }

      - name: Move :latest (highest version tag only)
        run: |
          set -euo pipefail
          digest="$(cat image/relay-image.digest)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::malformed image digest '${digest}'"; exit 1; }
          highest="$(git -c versionsort.suffix=- tag -l 'v*' --sort=v:refname | tail -1)"
          if [ "${highest}" != "${GITHUB_REF_NAME}" ]; then
            echo "${GITHUB_REF_NAME} is not the highest version tag (${highest}): :latest not moved"
            exit 0
          fi
          skopeo copy --all --preserve-digests "docker://${IMAGE}@${digest}" "docker://${IMAGE}:latest"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

  # The only job that can write a Release.
  github-release:
    name: Publish the GitHub Release
    needs: sign-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-dist
          path: dist

      - name: Check the signed artifacts
        run: cd dist && sha256sum --check SHA256SUMS

      # gh is preinstalled on the runner and uses the job's GITHUB_TOKEN — no
      # third-party release action to pin or audit. --verify-tag refuses to
      # invent a release for a tag the remote doesn't have. Pre-1.0 tags (0.x)
      # and any tag with a prerelease component publish as pre-releases.
      #
      # Idempotent by design: a Release for the tag may already exist because it
      # was drafted/published by hand in the GitHub UI (creating a release there
      # also creates the tag, and that tag push is what triggers this run), or
      # because an earlier attempt published and then failed. Uploading into the
      # existing Release is the safe resolution — the artifacts still come from
      # THIS verified build, and --clobber replaces any same-named asset rather
      # than silently keeping a stale one. The guards above are what protect the
      # artifacts' integrity, not the accident of who created the Release row.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=""
          case "${tag}" in
            v0.*|*-*) prerelease="--prerelease" ;;
          esac
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "::notice::release ${tag} already exists — uploading this build's artifacts into it"
            gh release upload "${tag}" dist/* --clobber
            # Keep the documented convention even for a hand-created Release:
            # every v0.* / prerelease tag is published as a pre-release.
            if [ -n "${prerelease}" ]; then
              gh release edit "${tag}" --prerelease
            fi
          else
            gh release create "${tag}" dist/* \
              --title "${tag}" \
              --generate-notes \
              --verify-tag \
              ${prerelease}
          fi
