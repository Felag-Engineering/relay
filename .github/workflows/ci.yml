name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ---- format: fast check, no compile ----
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Set up Rust (rustfmt only)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - run: make fmt

  # ---- relay: Go build, lint, race-detector tests ----
  relay:
    name: Relay (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Full module path required (v2 module); pin avoids supply-chain surprise.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - run: make build-relay
      - run: make lint-relay
      - run: make test-relay-race

  # ---- daemon: Rust build, clippy, tests ----
  daemon:
    name: Daemon (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt,clippy

      - name: Cache Cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: make build-daemon
      - run: make lint-daemon
      - run: make test-daemon

  # ---- strict-umask: the same hermetic test lanes, at a strict umask (#528).
  # Every other job here runs at the runner's default 0022, which made a whole
  # defect class invisible to the gate: fixtures that quietly stop being valid
  # inputs, and assertions pinning a mode the code never guarantees (#481,
  # #507, #508, #509, #510, #513, #514 — all found by scans, none by a red
  # build). Blocking, not advisory: a genuine umask-dependent failure is
  # exactly what this is for. Both toolchains, because the class showed up in
  # Go tests and Rust fixtures alike. `make test-strict-umask` owns the umask
  # and the `-count=1` that stops the Go test cache replaying another job's
  # default-umask `ok` — see the Makefile for why both are load-bearing. ----
  strict-umask:
    name: Tests (umask 077)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: make test-strict-umask

  # ---- proto-drift: /proto is the source of truth (ADR-0007) ----
  proto-drift:
    name: Proto drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - run: make proto-tools
      - run: make proto-check

  # ---- proto-breaking: /proto is additive-only past the #39 rename (ADR-0014).
  # A PR that breaks wire compatibility (field renumber/delete, type change, file
  # move) must fail CI. Runs the same check as `make proto-breaking`, against the
  # PR base revision. PR-only: main only advances via reviewed PRs (CLAUDE.md), and
  # a push event has no natural single base commit to diff against, so the gate has
  # nothing meaningful to run there. ----
  proto-breaking:
    name: Proto breaking
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - run: make proto-tools

      # github.event.pull_request.base.sha is a snapshot from the PR's last sync
      # event (push/rebase), not necessarily the current tip of the base branch —
      # a known, accepted limitation of this pattern (matches bufbuild's own
      # buf-breaking-action guidance).
      - name: Buf breaking against PR base
        run: make proto-breaking PROTO_BREAKING_REF=${{ github.event.pull_request.base.sha }}

  # ---- opschema-drift: the daemon is the single source of truth for what it
  # enforces (ADR-0015); the committed Operation-schema golden must never
  # drift from `dump-operation-schema`'s live output. This is a Rust build
  # (dump-operation-schema is a daemon subcommand), so it is modeled on the
  # `daemon` job above, not the Go-only proto-drift job.
  opschema-drift:
    name: Operation schema drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: make gen-opschema
      - run: git diff --exit-code -- relay/internal/opvocab/testdata/operations.schema.json

  # ---- openapi: the published /api/v1 contract must match what is served ----
  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Validates docs/api/openapi.yaml as a real OpenAPI 3.1 document AND
      # compares it against api.Routes() in both directions, so the published
      # contract cannot drift from the server that honours it.
      - run: make openapi-check

      # Generates a typed client from the committed spec, compiles it, and
      # asserts every operationId got a client method. The generated code is
      # not committed — this proves the published contract is consumable by a
      # real generator, which spec validation alone cannot.
      - run: make apiclient-check

  # ---- integration: smoke test against both built binaries ----
  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version-file: relay/go.mod

      - name: Cache Go modules
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - run: make test-integration

      # #112: cross-binary CI smoke test (real relay + real relay-daemon over
      # loopback TCP), driven through the devharness build-tag-gated control
      # socket. lint-devharness vets the gated files (they're excluded from
      # the default lint-relay); devharness-absent-check mechanically proves
      # the surface is absent from the normal binary before test-crossbinary
      # exercises it via the devharness-tagged one.
      - run: make lint-devharness
      - run: make devharness-absent-check
      - run: make test-crossbinary

  # ---- release-build: compile-check the musl static binary (main only) ----
  release-build:
    name: Release build (musl)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust stable (musl target)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get install -y musl-tools

      - name: Cache Cargo registry and build
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            daemon/target
          key: ${{ runner.os }}-cargo-musl-${{ hashFiles('daemon/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-musl-

      - run: make build-daemon-release
