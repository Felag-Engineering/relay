name: CI

on:
  pull_request:
    # The default three plus ready_for_review: a draft PR runs only the Docs job
    # (below), and marking it ready is what runs the toolchain jobs.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---- Cost shape (read before adding a job) ----
# Actions bills each job separately, rounded UP to the minute, and every job pays
# ~30-40s of checkout and toolchain setup before it does anything. So gates that
# share a toolchain run as steps of one job, reusing its build cache, rather than as
# jobs of their own. Every gate is still its own `make` target and `make verify`
# still runs them all; only the grouping differs. A step that used to be a job of
# its own carries `if: !cancelled()`, so an earlier failure in the same job does not
# hide its result.
#
# Caches: the build caches (Go build + modules, Cargo registry + target) are keyed
# per job and per ISO week, restored everywhere, and SAVED ONLY FROM main — so PRs
# never spend upload time or cache quota, and a week's staleness bounds how much
# recompiling a PR does. Pinned tool binaries are cached on the `go install` lines
# in the Makefile, so bumping a pin rebuilds them. The cache steps live once, as local
# composite actions under .github/actions/; a composite action has no post step, so
# each build cache is a restore action early in the job and a save action at its end,
# and the save's `if:` — the save policy — stays here in the job.
#
# Drafts: on a draft pull request only the Docs job runs. Every toolchain job is gated
# on `github.event.pull_request.draft != true` (null on a push, so main is unaffected),
# and marking the PR ready for review fires the run that gates the merge. Push to a
# draft as often as you like; it costs the Docs job. Branch protection must require
# the `CI OK` job (ci-ok, below), not the toolchain jobs: see why there.
#
# Timeouts: every job sets timeout-minutes at roughly three times its normal runtime.
# Without one, a hung test bills the platform default of six hours.
#
# Adding a gate: make it a step of the job that already has its toolchain and cache
# (the hardening gates — golangci's security linters, shellcheck, actionlint, zizmor,
# gitleaks, cargo-deny, the PR-time advisory scans — are all steps, not jobs). A new
# job is justified only by a toolchain no existing job has.
#
# GOFLAGS=-count=1: the restored Go build cache also holds test RESULTS, which do
# not key on everything a test depends on (the umask, for one — see the Makefile's
# strict-umask notes). CI never replays a cached pass; it only reuses compilation.
env:
  GOFLAGS: -count=1
  CARGO_INCREMENTAL: 0

jobs:

  # ---- docs: ADR-number uniqueness, every test a capability spec cites, which of the
  # jobs below this change needs, and the repo-wide hygiene gates (shell and workflow
  # lint, the secrets scan). The checks are shell + grep over the tree; Go is set up
  # only to run the pinned scanner binaries out of the shared tool cache. It is the one
  # job that always runs, drafts included — which is why the secrets scan lives here.
  # scripts/ci-changed-paths.sh fails open — pushes to main always run everything — and
  # the jobs below skip only on an explicit `false`, so a docs job that dies before
  # classifying runs every gate. They run on `!cancelled()`, so a docs-check failure
  # never hides a code-job result. ----
  docs:
    name: Docs & paths
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.paths.outputs.code }}
      proto: ${{ steps.paths.outputs.proto }}
      deps: ${{ steps.paths.outputs.deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # the PR merge commit and its base parent

      - name: Classify changed paths
        id: paths
        run: bash scripts/ci-changed-paths.sh >> "$GITHUB_OUTPUT"

      # GH_TOKEN lets check-crosslinks verify Designed-claim milestones against GitHub instead of
      # reporting that check as skipped.
      - run: make docs-check
        env:
          GH_TOKEN: ${{ github.token }}

      # The dev-loop's security-surface gate, proved against a fixture repo (#634). Shell + git
      # only, and self-contained, so the shallow checkout above is irrelevant to it.
      - name: Security-surface gate self-test
        if: ${{ !cancelled() }}
        run: make test-security-surface

      # scripts/demo-fleet.sh's reset/fault guard, proved against a stubbed docker
      # (#622). Shell only — no python3, no Docker — so it runs here alongside the
      # other guard self-test rather than in a toolchain job.
      - name: Demo-fleet reset guard self-test
        if: ${{ !cancelled() }}
        run: make test-demo-fleet

      # The release image guard (#892), proved against tiny OCI archives. tar, jq and
      # sha256sum only — no Docker, no toolchain.
      - name: Release image guard self-test
        if: ${{ !cancelled() }}
        run: make test-release-image-guard

      # scripts/codex-review.sh's structural verdict classifier, proved against a stubbed
      # companion (#694). Shell, git and node — the stub companion is a Node program and the
      # gate's classifier parses JSON with node. No Codex CLI, no network.
      - name: Codex-review gate self-test
        if: ${{ !cancelled() }}
        run: make test-codex-review

      # scripts/proto-tools-check.sh, proved against stub tools and a stub `go` (#710). Shell
      # only, no Go toolchain, no network — it belongs with the other gate self-tests rather
      # than in a toolchain job. The docs job has no `Set up Go` step, which is exactly why
      # the stub `go` is load-bearing here rather than a convenience.
      - name: Proto-tools pin check self-test
        if: ${{ !cancelled() }}
        run: make test-proto-tools-check

      # scripts/check-docs.sh's cited-test check, proved against a fixture repo: Go
      # Test/Benchmark/Fuzz names, and Rust test fns and cargo-fuzz targets in proof rows. Shell
      # only, no toolchain.
      - name: Docs-check self-test
        if: ${{ !cancelled() }}
        run: make test-check-docs

      # scripts/smoke-test.sh's mTLS verdict, proved against a stub Relay and a stub curl: it
      # cannot pass when nothing listens or when mTLS is off. Shell only; the real-binary run is
      # the integration job's make test-integration.
      - name: Smoke-test self-test
        if: ${{ !cancelled() }}
        run: make test-smoke-test

      # scripts/ci-changed-paths.sh, the classifier above that decides which jobs below run,
      # proved against throwaway fixture repos. Shell and git only. It runs here, in the one
      # job that always runs, because a classifier bug is exactly what would skip the others.
      - name: Changed-paths classifier self-test
        if: ${{ !cancelled() }}
        run: make test-ci-changed-paths

      # scripts/vuln-gate.sh, the relay job's PR govulncheck gate, proved against fixture
      # govulncheck streams (bash + jq). Here because the gate itself runs only on deps=.
      - name: Vulnerability-gate self-test
        if: ${{ !cancelled() }}
        run: make test-vuln-gate

      # scripts/maintainer-check.sh, the routines' "who may instruct" check, proved against a
      # stub gh (#910). Bash and jq only, no token, no network, so it runs here with the other
      # gate self-tests.
      - name: Maintainer-check self-test
        if: ${{ !cancelled() }}
        run: make test-maintainer-check

      # ---- Repo-wide hygiene gates. The scanners are pinned `go install`s in the
      # Makefile's lint-tools, so they ride the shared Go tool cache; zizmor is a Python
      # package, installed by pipx. ----
      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Go tools (pinned in the Makefile)
        if: ${{ !cancelled() }}
        uses: ./.github/actions/go-tools

      # Tracked files only, every run, drafts included: a credential pushed to a draft is
      # as leaked as one pushed anywhere else. security-nightly.yml scans the history.
      - name: Secrets scan (gitleaks)
        if: ${{ !cancelled() }}
        run: make secrets-scan

      - name: Install zizmor (pinned in the Makefile)
        if: ${{ !cancelled() }}
        run: make zizmor-tool

      # shellcheck (preinstalled on the runner image) over every tracked script,
      # actionlint over the workflows, and zizmor's workflow security audits. GH_TOKEN
      # turns on zizmor's online audits: impostor commits and known-vulnerable actions.
      - name: Shell and workflow lint
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: make lint-ci

  # ---- relay: Go format, build, lint, race-detector tests, the OpenAPI contract,
  # and the Go half of the strict-umask lane ----
  relay:
    name: Relay (Go)
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.code != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false # its built-in cache looks for go.sum at the repo root; cached below

      - name: Restore Go build and module cache
        id: go-cache
        uses: ./.github/actions/go-cache-restore
        with:
          prefix: go-${{ github.job }}

      - name: Go tools (pinned in the Makefile)
        uses: ./.github/actions/go-tools

      - run: make build-relay
      - run: make lint-relay
      - run: make test-relay-race

      # Validates docs/api/openapi.yaml as a real OpenAPI 3.1 document AND
      # compares it against api.Routes() in both directions, so the published
      # contract cannot drift from the server that honours it.
      - name: OpenAPI contract
        if: ${{ !cancelled() }}
        run: make openapi-check

      # Generates a typed client from the committed spec, compiles it, and
      # asserts every operationId got a client method. The generated code is
      # not committed — this proves the published contract is consumable by a
      # real generator, which spec validation alone cannot.
      - name: OpenAPI client generation
        if: ${{ !cancelled() }}
        run: make apiclient-check

      # Known vulnerabilities reachable from the Relay's code, on a pull request that
      # changes go.mod/go.sum, the exceptions list or the scanners' pins. Fails on a finding
      # relay/govulncheck-exceptions.txt does not list (scripts/vuln-gate.sh). Not on a
      # push to main: an advisory published against an unchanged tree is the nightly
      # scan's to report, not a reason to turn main red.
      - name: Vulnerability scan (govulncheck)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.docs.outputs.deps != 'false' }}
        run: make vuln-relay-gate

      # strict-umask (#528): the hermetic Go tests again at umask 077. Every other
      # gate runs at the runner's default 0022, which made a whole defect class
      # invisible: fixtures that quietly stop being valid inputs, and assertions
      # pinning a mode the code never guarantees (#481, #507, #508, #509, #510,
      # #513, #514 — all found by scans, none by a red build). Blocking, not
      # advisory. The target owns the umask and the `-count=1` that stops the Go
      # test cache replaying the default-umask `ok` — see the Makefile.
      - name: Tests (umask 077)
        if: ${{ !cancelled() }}
        run: make test-strict-umask-relay

      # Last, so a formatting slip never hides the lint and test results above.
      - name: Format (gofmt)
        if: ${{ !cancelled() }}
        run: make fmt-relay

      - name: Save Go build and module cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # ---- daemon: Rust build, fmt + clippy, tests, the Rust half of the strict-umask
  # lane, and Operation-schema drift ----
  daemon:
    name: Daemon (Rust)
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.code != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-musl # lint-daemon lints the shipped musl config

      - name: Install musl linker
        run: sudo apt-get install -y musl-tools # ring's build script compiles C for the musl clippy pass

      - name: Restore Cargo registry and build cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          prefix: cargo-${{ github.job }}
          rust-cachekey: ${{ steps.toolchain.outputs.cachekey }}

      - run: make build-daemon
      - run: make lint-daemon # includes cargo fmt --check
      - run: make check-daemon-bans
      - run: make test-daemon

      # cargo-deny, compiled once per pinned version and cached as a binary: the
      # install is minutes, a cache hit is seconds. The pin is CARGO_DENY_VERSION in
      # the Makefile, read here so there is one copy of it.
      - name: cargo-deny version
        if: ${{ !cancelled() }}
        id: deny
        run: echo "version=$(sed -n 's/^CARGO_DENY_VERSION := //p' Makefile)" >> "$GITHUB_OUTPUT"

      - name: Restore cargo-deny
        if: ${{ !cancelled() }}
        id: deny-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-${{ steps.deny.outputs.version }}

      - name: Install cargo-deny
        if: ${{ !cancelled() && steps.deny-cache.outputs.cache-hit != 'true' }}
        run: make deny-tool

      - name: Save cargo-deny
        if: ${{ !cancelled() && steps.deny-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ steps.deny-cache.outputs.cache-primary-key }}

      # daemon/deny.toml: licences, banned crates (a second crypto stack), sources.
      # Offline, so on every daemon change.
      - name: Dependency policy (cargo-deny)
        if: ${{ !cancelled() }}
        run: make deny-daemon

      # Known advisories, on the same pull-request deps= condition as the relay job's
      # govulncheck; daemon/deny.toml's [advisories].ignore is this gate's exceptions list.
      - name: Dependency advisories (cargo-deny)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.docs.outputs.deps != 'false' }}
        run: make deny-daemon-advisories

      # strict-umask (#528), Rust half: see the relay job's step of the same name.
      # Reuses the test binaries test-daemon just compiled.
      - name: Tests (umask 077)
        if: ${{ !cancelled() }}
        run: make test-strict-umask-daemon

      # opschema-drift: the daemon is the single source of truth for what it
      # enforces (ADR-0015); the committed Operation-schema golden must never
      # drift from `dump-operation-schema`'s live output. Reuses the debug binary
      # build-daemon produced.
      - name: Operation schema drift
        if: ${{ !cancelled() }}
        run: make opschema-check

      - name: Save Cargo registry and build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # ---- proto: /proto is the source of truth (ADR-0007) and additive-only past the
  # #39 rename (ADR-0014). Skipped on a PR that touches neither /proto nor the
  # generated Go it produces (scripts/ci-changed-paths.sh). ----
  proto:
    name: Proto (drift & breaking)
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.proto != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # proto-breaking reads the base revision out of .git

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Go tools (pinned in the Makefile)
        uses: ./.github/actions/go-tools

      - name: Proto drift
        run: make proto-check

      # A PR that breaks wire compatibility (field renumber/delete, type change,
      # file move) must fail CI. PR-only: main only advances via reviewed PRs
      # (AGENTS.md), and a push event has no natural single base commit to diff
      # against. github.event.pull_request.base.sha is a snapshot from the PR's
      # last sync event, not necessarily the current tip of the base branch — a
      # known, accepted limitation (matches bufbuild's buf-breaking-action guidance).
      - name: Proto breaking (against PR base)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: make proto-breaking PROTO_BREAKING_REF=${{ github.event.pull_request.base.sha }}

  # ---- integration: smoke test against both built binaries ----
  integration:
    name: Integration
    needs: docs
    if: ${{ !cancelled() && needs.docs.outputs.code != 'false' && github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false

      - name: Set up Rust stable
        id: toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Restore Go build and module cache
        id: go-cache
        uses: ./.github/actions/go-cache-restore
        with:
          prefix: go-${{ github.job }}

      - name: Restore Cargo registry and build cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          prefix: cargo-${{ github.job }}
          rust-cachekey: ${{ steps.toolchain.outputs.cachekey }}

      - run: make test-integration

      # #112: cross-binary CI smoke test (real relay + real relay-daemon over
      # loopback TCP), driven through the devharness build-tag-gated control
      # socket. lint-devharness vets the gated files (they're excluded from
      # the default lint-relay); devharness-absent-check mechanically proves
      # the surface is absent from the normal binary before test-crossbinary
      # exercises it via the devharness-tagged one.
      - run: make lint-devharness
      - run: make devharness-absent-check
      - run: make test-crossbinary

      - name: Save Go build and module cache
        if: github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Save Cargo registry and build cache
        if: github.ref == 'refs/heads/main' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # ---- ci-ok: the one check branch protection should require. ----
  # A job skipped by its `if:` reports as passing to a required status check. Draft gating
  # makes that matter: a draft run leaves the toolchain jobs *skipped* on the head commit,
  # and when the PR is marked ready, the new run's toolchain jobs only appear once Docs
  # finishes — so for those minutes, requiring them individually would see stale skips
  # as passes. This job fails closed instead: it is red on a draft run, and green only
  # when Docs passed and every other job either passed or was skipped for the one
  # legitimate reason (the classifier said the change cannot reach it). Require this
  # check alone; the jobs it names stay visible for diagnosis.
  ci-ok:
    name: CI OK
    needs: [docs, relay, daemon, proto, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate this change needs ran and passed
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          CODE: ${{ needs.docs.outputs.code }}
          PROTO: ${{ needs.docs.outputs.proto }}
          DOCS: ${{ needs.docs.result }}
          RELAY: ${{ needs.relay.result }}
          DAEMON: ${{ needs.daemon.result }}
          PROTO_JOB: ${{ needs.proto.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "::error::draft pull request: the toolchain gates did not run. Mark it ready for review."
            exit 1
          fi
          fail=0
          # check <job> <result> <the classifier output that may excuse a skip>
          check() {
            case "$2" in
              success) ;;
              skipped)
                if [ "$3" != "false" ]; then
                  echo "::error::$1 was skipped, but the change can reach it"; fail=1
                fi ;;
              *) echo "::error::$1: $2"; fail=1 ;;
            esac
          }
          [ "$DOCS" = "success" ] || { echo "::error::docs: $DOCS"; fail=1; }
          check relay "$RELAY" "$CODE"
          check daemon "$DAEMON" "$CODE"
          check integration "$INTEGRATION" "$CODE"
          check proto "$PROTO_JOB" "$PROTO"
          exit "$fail"

  # ---- release-build: compile-check the musl static binary (main only) ----
  release-build:
    name: Release build (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust stable (musl target)
        id: toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install musl linker
        run: sudo apt-get install -y musl-tools

      - name: Restore Cargo registry and build cache
        id: cargo-cache
        uses: ./.github/actions/cargo-cache-restore
        with:
          prefix: cargo-musl
          rust-cachekey: ${{ steps.toolchain.outputs.cachekey }}

      - run: make build-daemon-release

      # The job itself runs only on main, so this saves on every miss.
      - name: Save Cargo registry and build cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cargo-cache-save
        with:
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
