name: Security (nightly)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

# Read-only at the workflow level; the one job that files the tracking issue asks for
# issues:write itself, so no other job ever holds it.
permissions:
  contents: read

jobs:

  # The scan runs every night regardless of code changes: advisory databases move
  # even when the code does not. Two things are cached: cargo-audit's install (compiling
  # it from source was most of this job's runtime) and the Go build cache, which carries
  # the govulncheck and gitleaks that `go tool` builds from tools/. The advisory data
  # itself is fetched fresh on every run.
  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write # the report step creates or updates the security-scan tracking issue
    env:
      CARGO_AUDIT_VERSION: 0.22.2  # pinned for supply-chain reproducibility

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secrets scan reads the whole history

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false # its built-in cache looks for go.sum at the repo root

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Restore cargo-audit
        id: scanners
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: scanners-cargo-audit-${{ env.CARGO_AUDIT_VERSION }}

      - name: Install cargo-audit
        if: steps.scanners.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version "${CARGO_AUDIT_VERSION}" --locked

      - name: Save cargo-audit
        if: steps.scanners.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ steps.scanners.outputs.cache-primary-key }}

      # govulncheck is pinned in tools/govulncheck and built by `go tool` into this cache.
      # It reports standard-library vulnerabilities for the toolchain it runs under, and
      # that stays relay/go.mod's: make exports GOTOOLCHAIN from it, and the cache key
      # hashes it.
      - name: Restore Go build and module cache
        id: go-cache
        uses: ./.github/actions/go-cache-restore
        with:
          prefix: go-${{ github.job }}

      # Non-blocking: capture output and exit code; report step decides what to file.
      # NOTE: GH Actions `run:` runs under `bash -e`, so when a scan exits non-zero
      # the `echo $? > *.rc` line is never reached and no .rc file is written.
      # The report script's `|| echo 1` fallback (cat *.rc || echo 1) treats a
      # missing .rc as rc=1, which is correct — missing file means findings detected.
      - name: Scan Relay (govulncheck)
        id: vuln_relay
        continue-on-error: true
        run: |
          make vuln-relay > vuln-relay.txt 2>&1
          echo $? > vuln-relay.rc

      - name: Scan Daemon (cargo audit)
        id: vuln_daemon
        continue-on-error: true
        run: |
          make vuln-daemon > vuln-daemon.txt 2>&1
          echo $? > vuln-daemon.rc

      # Every commit in the history, not just the tree: a secret committed and deleted
      # later is still in every clone. Blocking — a leaked credential is rotated now,
      # not triaged with the advisories — so a finding turns this job red. gitleaks is
      # pinned in tools/gitleaks and built by `go tool` into the Go cache restored above.
      # Output is captured for the report step (redacted: rule, file, commit — never the
      # secret), and the step still fails on a finding.
      - name: Secrets scan, full history (gitleaks)
        id: secrets
        run: |
          set +e
          make secrets-scan-history > secrets-history.txt 2>&1
          rc=$?
          echo "$rc" > secrets-history.rc
          cat secrets-history.txt
          exit "$rc"

      # Always runs; creates or updates the single security-scan tracking issue.
      - name: Report findings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/security-nightly-report.sh

      # After the blocking gitleaks step, and on !cancelled(), so a night with a finding
      # still saves the cache. No ref check: Actions caches are scoped to the branch that
      # saved them, so a workflow_dispatch run on another branch cannot seed main's.
      - name: Save Go build and module cache
        if: ${{ !cancelled() && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/go-cache-save
        with:
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Whether tonight's fuzz jobs run: always on workflow_dispatch and on the
  # Wednesday/Sunday floor, otherwise only when something they exercise changed
  # since the last successful scheduled run. Fails open, here too: the fuzz jobs skip
  # only on an explicit `false`, so a plan job that dies still fuzzes.
  # See scripts/fuzz-plan.sh.
  fuzz-plan:
    name: Fuzz plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # gh run list: find the last successful scheduled run
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # diff against the last successful run's commit

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fuzz-plan.sh >> "$GITHUB_OUTPUT"

  # Bounded wire fuzzing (issue #217): native Go fuzz targets over the
  # certless-reachable CSR parser (ca.CA.SignCSR) and the Relay-side
  # proto-in/domain-out converters. Nightly-only (on the nights fuzz-plan picks)
  # and per-target time-capped via `make fuzz-relay` — PR CI (ci.yml) never runs
  # -fuzz open-endedly.
  fuzz:
    name: Wire fuzzing (bounded)
    needs: fuzz-plan
    if: ${{ !cancelled() && needs.fuzz-plan.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # six targets at FUZZTIME=120s, plus the build
    # Least-privilege: this job only reads the repo and runs the bounded fuzzers.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: false # its built-in cache looks for go.sum at the repo root

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('relay/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The coverage-grown corpus ($GOCACHE/fuzz) persists across runs, so each
      # run resumes where the last stopped instead of re-exploring from the in-code
      # f.Add seeds. A new key per run, restored by prefix: the newest wins.
      # Crash reproducers are written under testdata/fuzz in the tree, never here.
      # The corpus starts over each month: nothing minimizes it, and loading an
      # ever-growing corpus would eat into the fixed per-target time cap.
      - name: Corpus key
        id: corpus
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-go-${{ steps.corpus.outputs.month }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-go-${{ steps.corpus.outputs.month }}-

      - name: Bounded fuzz (per-target time cap)
        run: make fuzz-relay FUZZTIME=120s

      - name: Corpus size
        if: ${{ !cancelled() }}
        run: |
          echo "Go fuzz corpus: $(find ~/.cache/go-build/fuzz -type f 2>/dev/null | wc -l) inputs" | tee -a "$GITHUB_STEP_SUMMARY"

      # Saved even when a target crashed: what the others found is still coverage.
      - name: Save fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-go-${{ steps.corpus.outputs.month }}-${{ github.run_id }}

      # `make` stops at the first failing target (see Makefile), so a red run
      # surfaces the first crasher; dump its reproducer so it survives in the
      # Actions log without adding a new pinned action for artifact upload.
      - name: Dump any crash reproducers
        if: failure()
        run: |
          echo "Fuzz run failed — reproducers under testdata/fuzz:"
          find relay -path '*/testdata/fuzz/*' -type f -print -exec cat {} \; || true

  # Bounded wire fuzzing, Rust half (issues #238/#252): cargo-fuzz (libFuzzer)
  # over the prost decode surface — the untrusted-bytes entry points the daemon
  # parses off the wire (RelayMessage from the Tunnel stream; EnrollResponse /
  # RenewResponse from the Enrollment service). Coverage-guided complement to
  # the stable-toolchain proptest suite from #218. cargo-fuzz REQUIRES the
  # nightly Rust toolchain, which is exactly why this job lives here and never
  # in per-PR CI: ci.yml stays stable-only.
  fuzz-daemon:
    name: Wire fuzzing (Rust, bounded)
    needs: fuzz-plan
    if: ${{ !cancelled() && needs.fuzz-plan.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45 # three targets at FUZZ_TOTAL_TIME=300s, plus a nightly-toolchain build
    # Least-privilege: like the Go fuzz job above, this only reads the repo and
    # runs the bounded fuzzers.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same pinned action as the stable setup in `scan`; the `toolchain` input
      # selects nightly, which cargo-fuzz needs for its -Z sanitizer flags.
      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: nightly

      - name: Cache Cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('daemon/fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Restore cargo-fuzz
        id: cargo-fuzz
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2

      - name: Install cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked # pinned for supply-chain reproducibility

      - name: Save cargo-fuzz
        if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2

      # The coverage-grown corpus persists across runs in its own directory, read
      # alongside the committed seeds (daemon/fuzz/corpus/<target>/) but never
      # written over them — see FUZZ_GROWN_CORPUS in the Makefile. Starts over each
      # month, for the same reason as the Go job's.
      - name: Corpus key
        id: corpus
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore fuzz corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fuzz-corpus-daemon
          key: fuzz-corpus-daemon-${{ steps.corpus.outputs.month }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-daemon-${{ steps.corpus.outputs.month }}-

      # Bounds live in the Makefile (FUZZ_RSS_MB / FUZZ_MAX_LEN); only the
      # per-target wall-clock cap is overridden for the nightly run. Like the
      # Go job, `make` stops at the first failing target, so a red run
      # surfaces one crasher at a time.
      - name: Bounded fuzz (per-target time cap)
        run: make fuzz-daemon FUZZ_TOTAL_TIME=300 FUZZ_GROWN_CORPUS="$HOME/fuzz-corpus-daemon"

      - name: Corpus size
        if: ${{ !cancelled() }}
        run: |
          echo "Rust fuzz corpus (grown): $(find ~/fuzz-corpus-daemon -type f 2>/dev/null | wc -l) inputs" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save fuzz corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fuzz-corpus-daemon
          key: fuzz-corpus-daemon-${{ steps.corpus.outputs.month }}-${{ github.run_id }}

      # Mirror the Go job's reproducer dumping so the crasher survives in the
      # Actions log without adding a new pinned action for artifact upload.
      # base64 (not cat) because libFuzzer reproducers are raw binary.
      - name: Dump any crash reproducers
        if: failure()
        run: |
          echo "Fuzz run failed — reproducers under daemon/fuzz/artifacts (base64):"
          find daemon/fuzz/artifacts -type f -print -exec base64 {} \; || true
