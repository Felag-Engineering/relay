# gitleaks configuration: `make secrets-scan` (ci.yml: the docs job; the full git
# history is scanned nightly). The default rule set, plus the narrowest allowlists that
# clear what was reviewed when the scan was introduced. An allowlist entry names the
# rule it silences and the paths it applies to; never widen one to a whole directory
# without saying why here.
[extend]
useDefault = true

[[allowlists]]
description = "Go test sentinels: fake tokens, token IDs and passwords that redaction and audit tests assert never leak"
targetRules = ["generic-api-key"]
# Named files, not every _test.go: a real key pasted into any other test still fails.
paths = [
  '''^relay/cmd/relay/mcp_elicitation_refusals_e2e_test\.go$''',
  '''^relay/internal/auditsink/auditsink_test\.go$''',
  '''^relay/internal/capability/revoke_reason_test\.go$''',
  '''^relay/internal/controlplane/console/node_test\.go$''',
]

[[allowlists]]
description = "A truncated PEM block the audit sink test holds as a must-never-persist sentinel"
targetRules = ["private-key"]
paths = ['''^relay/internal/auditsink/auditsink_test\.go$''']

[[allowlists]]
description = "GitHub Actions cache keys (`key:` lines), which are cache names, not credentials"
targetRules = ["generic-api-key"]
paths = ['''^\.github/''']
regexTarget = "line"
regexes = ['''^\s*key:\s''']
