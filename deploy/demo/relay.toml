# The Relay's configuration for the demo fleet (deploy/demo) — DEV-ONLY.
#
# Staged root:10001 0640 onto the relay-etc volume by the relay-config one-shot
# (docker/dev-fleet-config.sh); the Relay mounts that volume read-only at /etc/relay. It reads
# every setting from this one file and nothing from its environment (ADR-0043, invariant 11).
# Edit it here and bring the fleet up again: relay-config re-stages it and the Relay restarts.
#
# The approval gate (ADR-0027, ADR-0047) is the [[approval.rules]] sections at the foot of this
# file. It is Relay configuration, not a runtime object, so no Account can loosen it through
# the API, and a malformed rule fails startup. The same rules as the test fleet, answerable
# from an MCP client (docs/operations/demo-fleet.md).
#
# The ca and store paths are fixed by the compose file, and tls.hostname
# by FLEET_HOSTNAME (default `relay`, the name init and the daemons dial): /var/lib/relay is the Relay's only writable volume.

# Node-plane gRPC listener (relay-daemon dial-home).
[node_plane]
listen_address = ":7654"

# Control-plane HTTPS listener (MCP + /api/v1), on a distinct port from the node plane:
# listener separation. Enabled, so execution is on.
[control_plane]
enabled = true
listen_address = ":9443"

[console]
enabled = true

[ca]
dir = "/var/lib/relay/ca"

[store]
path = "/var/lib/relay/store/relay.db"

# Server certificate SAN, verified by the daemons and init. relay-config replaces this exact
# line with FLEET_HOSTNAME when that is set (docker/dev-fleet-config.sh), so keep it as is.
[tls]
hostname = "relay"

[[approval.rules]]
name = "demo-fleet-wide-mutates-need-a-human"
risk_class = "mutate"
min_fan_out = 2
ttl = "1h"

[[approval.rules]]
name = "demo-raw-exec-always-needs-a-human"
raw_exec = true
ttl = "1h"
