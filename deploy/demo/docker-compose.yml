# Relay demo fleet: the Relay and nine relay-daemons, DEV-ONLY
# (docs/operations/demo-fleet.md). Not a deployment: deploy/production is that.
#
# Everything this fleet loads is in this folder: relay.toml is staged
# by the relay-config one-shot, and oauth.yml is the opt-in IdP overlay. `make demo-*` runs it;
# so can any compose tool pointed at this file, Komodo included. The project is fixed by
# `name:` below. One fleet per Docker engine: it publishes the same host ports as
# deploy/test, and the Makefile refuses to start one while the other is up.
#
# Every Relay build names `target: dev-fleet`; the default (last) stage of
# docker/relay.Dockerfile is the fixture-free `runtime` image.
#
# Startup order: relay-config (exit 0) -> relay (healthy) -> init (exit 0) -> daemons. If
# relay-config or init fails, nothing after it starts.
name: relay-demo

# All nine daemon services are byte-identical except for their per-Node
# environment and their private state volume. This anchor factors out
# ONLY the non-mapping fields they share. NOTE: the YAML merge key `<<`
# REPLACES a mapping wholesale (it does not deep-merge), so each daemon's
# `environment:` and `volumes:` are written inline below — they must never
# live in this anchor.
x-daemon-base: &daemon-base
  build:
    context: ../..
    dockerfile: docker/daemon.Dockerfile
  restart: unless-stopped
  depends_on:
    init:
      # Daemons start only after the join string exists on the shared volume,
      # and init exiting non-zero keeps them all down.
      condition: service_completed_successfully
  healthcheck:
    # The daemon writes the `node_id` file only after a successful enrollment
    # (identity.persist_identity), so this gates health on enrollment success.
    #
    # Deliberately NOT extended to also probe the dev-fleet demo service
    # (#389): gating container health on that fixture would make a Node look
    # broken exactly when #622 injects the fault it exists to demonstrate. A
    # down demo service is observed through `dev-fleet-service status`, never
    # through `docker compose ps`.
    test: ["CMD", "test", "-f", "/var/lib/relay-daemon/node_id"]
    interval: 3s
    timeout: 3s
    retries: 20
    start_period: 5s

services:
  # The Relay's configuration, staged onto the relay-etc volume by
  # docker/dev-fleet-config.sh: relay.toml root:10001 0640, from this folder. A named volume is on the
  # engine's own Linux filesystem, which
  # the Relay's start-time check accepts; a bind mount from the checkout carries the
  # developer's uid and mode and, on Docker Desktop, arrives over virtiofs, 9p or FUSE, which
  # it refuses (docs/dev-fleet.md). So the file is mounted here, read-only, and the Relay
  # mounts the staged copy. Root with only CAP_CHOWN (to group the file to 10001 and hand
  # init's volumes to that uid) and CAP_DAC_OVERRIDE (to read a 0600 checkout), no network.
  relay-config:
    build:
      context: ../..
      dockerfile: docker/relay.Dockerfile
      target: dev-fleet
    user: "0:0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - "no-new-privileges:true"
    environment:
      # The name the Relay's certificate carries. Default `relay`, the in-fleet
      # name; set it to a DNS name that resolves to this host to reach the
      # Console and the Control API by that name. dev-fleet-config.sh validates
      # it and writes it into the staged relay.toml as tls.hostname.
      FLEET_HOSTNAME: "${FLEET_HOSTNAME:-relay}"
    entrypoint: ["sh", "/dev-fleet-config.sh"]
    volumes:
      - ../../docker/dev-fleet-config.sh:/dev-fleet-config.sh:ro
      - ./relay.toml:/src/relay.toml:ro
      - relay-etc:/stage
      # init's two output volumes, handed to the Relay's uid (dev-fleet-config.sh).
      - control-credential:/handoff/credential
      - bootstrap-shared:/handoff/bootstrap

  relay:
    build:
      context: ../..
      dockerfile: docker/relay.Dockerfile
      target: dev-fleet
    restart: unless-stopped
    # Unprivileged and capability-free: the Relay's start-time check refuses
    # root and any capability (ADR-0043). Its one writable path is relay-data.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      relay-config:
        # `restart: true` recreates the Relay when the one-shot is re-run, so an edited
        # relay.toml reaches a running fleet on the next `up`.
        condition: service_completed_successfully
        restart: true
    ports:
      # Distinct published host ports: node plane vs control plane, each bound
      # to 127.0.0.1 (loopback) by default and each opted out of it separately.
      # Nothing inside the fleet uses these host ports; daemons and init
      # dial the compose DNS name `relay` over the private network.
      #
      # RELAY_PUBLISH_ADDR publishes the CONTROL plane (MCP, /api/v1, the
      # Console) — what a client on another host needs. It is an execution
      # surface, so anything but loopback makes it network-reachable RCE for
      # whoever holds a credential or the Console password. The
      # init service refuses the committed default password when this is not
      # loopback, and then the fleet does not start: an exposed fleet needs a
      # real CONSOLE_ADMIN_PASSWORD.
      #
      # RELAY_NODE_PUBLISH_ADDR publishes the NODE plane, needed only by a
      # relay-daemon running outside this compose project. Leave it on loopback
      # unless you have one.
      - "${RELAY_NODE_PUBLISH_ADDR:-127.0.0.1}:7654:7654"
      # RELAY_PUBLISH_PORT moves only the host side, for example to 443; the
      # Relay still listens on 9443 inside the container.
      - "${RELAY_PUBLISH_ADDR:-127.0.0.1}:${RELAY_PUBLISH_PORT:-9443}:9443"
    volumes:
      # The Relay's configuration directory, read-only (ADR-0043): relay.toml staged
      # by relay-config. Every setting lives in relay.toml, the approval gate's
      # rules included; the comments in the fixture carry the reasoning.
      - type: volume
        source: relay-etc
        target: /etc/relay
        read_only: true
      # CA state (ca-cert.pem + ca-key.pem) and the SQLite store persist here, so
      # `compose down` / `up` keeps the same Node identities and audit trail.
      - relay-data:/var/lib/relay
    healthcheck:
      # A full TLS 1.3 handshake with each listener, verified against the
      # Relay's CA and the `relay` SAN, then a clean close. A raw TCP connect
      # (the old nc probe) left a "TLS handshake error ... EOF" in the Relay log
      # every interval. The node plane is gRPC, which requires ALPN h2.
      test:
        - "CMD"
        - "sh"
        - "-c"
        - >-
          h="$$(awk '/^\[/ { t = ($$0 ~ /^\[tls\][ \t]*(#.*)?$$/) } ;
          t && /^hostname[ \t]*=/ { if (match($$0, /"[^"]*"/)) print substr($$0, RSTART + 1, RLENGTH - 2); exit }'
          /etc/relay/relay.toml)";
          case "$$h" in
          "")
          echo "tls.hostname is not readable from /etc/relay/relay.toml"; exit 1;;
          relay.example.internal)
          echo "tls.hostname in /etc/relay/relay.toml is still the example placeholder"; exit 1;;
          esac;
          for p in 7654:h2 9443:http/1.1; do
          openssl s_client -quiet -no_ign_eof -tls1_3
          -connect 127.0.0.1:$${p%%:*}
          -servername "$$h" -verify_hostname "$$h"
          -CAfile /var/lib/relay/ca/ca-cert.pem -verify_return_error
          -alpn $${p#*:} </dev/null >/dev/null 2>&1
          || { echo "TLS handshake failed on port $${p%%:*}"; exit 1; }; done
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 3s

  # The dev fleet's one bootstrap one-shot (docker/dev-fleet-init.sh): creates
  # the first admin (the Console admin) with `relay init`, which sets its Console
  # password and mints its first API Token, creates the dev-approver Account (and
  # the IdP user under the OAuth overlay), mints the Enrollment
  # Token naming initial tags and writes its join string for the daemons, then exits. Besides the
  # Relay it is the only service that mounts relay-data, and it mounts it
  # READ-WRITE (`relay init` writes the store). It runs as the Relay's uid and
  # mounts the Relay's own staged configuration read-only, because `relay init`
  # reads relay.toml through the same start-time check as the Relay and so, like
  # the Relay, refuses root. relay-config hands it control-credential and
  # bootstrap-shared owned by that uid. No daemon mounts control-credential or
  # relay-data. A failure here keeps every daemon down.
  init:
    build:
      context: ../..
      dockerfile: docker/relay.Dockerfile
      target: dev-fleet
    user: "10001:10001"
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    depends_on:
      relay:
        condition: service_healthy
    environment:
      CONSOLE_ADMIN_NAME: "${CONSOLE_ADMIN_NAME:-admin}"
      CONSOLE_ADMIN_PASSWORD: "${CONSOLE_ADMIN_PASSWORD:-admin1234567}"
      # So the script can refuse the committed default password once the
      # control plane is published beyond loopback.
      RELAY_PUBLISH_ADDR: "${RELAY_PUBLISH_ADDR:-127.0.0.1}"
      # init dials the Relay as `relay` but verifies its certificate as this.
      FLEET_HOSTNAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_PUBLISH_PORT: "${RELAY_PUBLISH_PORT:-9443}"
    entrypoint: ["sh", "/dev-fleet-init.sh"]
    volumes:
      - ../../docker/dev-fleet-init.sh:/dev-fleet-init.sh:ro
      - type: volume
        source: relay-etc
        target: /etc/relay
        read_only: true
      - relay-data:/var/lib/relay
      - control-credential:/credential
      - bootstrap-shared:/bootstrap

  # daemon-1 and daemon-2 are the `role=web` Nodes: docker/daemon-entrypoint.sh
  # starts the dev-fleet demo service (#389) on each. It binds 127.0.0.1:8080
  # INSIDE its own container only — deliberately not published as a compose
  # `ports:` mapping, so only that Node's own Tasks (via Raw Exec, or
  # `service.restart` through the entrypoint's DEV-ONLY systemctl shim) ever
  # reach it.
  daemon-1:
    <<: *daemon-base
    # Sets the container's kernel hostname, which gather_facts() reads as the
    # authoritative Facts.hostname source (issue #188). The HOSTNAME env var
    # below is now only an explicit fallback for an unreadable /proc.
    hostname: "dev-node-1"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-1"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      # Private per-Node state volume => stable identity across down/up, no
      # re-enrollment storm.
      - daemon1-state:/var/lib/relay-daemon

  daemon-2:
    <<: *daemon-base
    hostname: "dev-node-2"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-2"
      RELAY_NODE_LABELS: "role=web"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon2-state:/var/lib/relay-daemon

  # role=db deliberately diverges from daemon-1/daemon-2: it runs no demo
  # service and its Policy (policy.db.toml) omits the dev-fleet-service
  # raw-exec allow, so deny-by-default refuses the repair here and a
  # fleet-wide Raw Exec returns `success` beside `denied_by_policy` (#389).
  daemon-3:
    <<: *daemon-base
    hostname: "dev-node-3"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.db.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-3"
      RELAY_NODE_LABELS: "role=db"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon3-state:/var/lib/relay-daemon

  # daemon-4 is `role=web, env=prod`: demo
  # service + policy.web.toml, exactly like daemon-1/daemon-2.
  daemon-4:
    <<: *daemon-base
    hostname: "dev-node-4"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-4"
      RELAY_NODE_LABELS: "role=web,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon4-state:/var/lib/relay-daemon

  # daemon-5 is `role=web, env=prod`: demo
  # service + policy.web.toml, exactly like daemon-1/daemon-2/daemon-4.
  daemon-5:
    <<: *daemon-base
    hostname: "dev-node-5"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-5"
      RELAY_NODE_LABELS: "role=web,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon5-state:/var/lib/relay-daemon

  # daemon-6 is `role=web, env=staging`: demo
  # service + policy.web.toml, the same Policy as daemon-1/2/4/5 with a
  # different `env` label.
  daemon-6:
    <<: *daemon-base
    hostname: "dev-node-6"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-6"
      RELAY_NODE_LABELS: "role=web,env=staging"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon6-state:/var/lib/relay-daemon

  # daemon-7 is `role=db, env=prod`: no demo
  # service, policy.db.toml, exactly like daemon-3 with an added `env` label.
  daemon-7:
    <<: *daemon-base
    hostname: "dev-node-7"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.db.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-7"
      RELAY_NODE_LABELS: "role=db,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon7-state:/var/lib/relay-daemon

  # daemon-8 is `role=bastion, env=prod` — THE
  # NARROW NODE the demo's refusal beat depends on: no demo service, and
  # policy.bastion.toml, the strictly-narrowest fixture (exactly one
  # `file.read` path, no `service.restart`, no `[raw_exec]` section at all).
  daemon-8:
    <<: *daemon-base
    hostname: "dev-node-8"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.bastion.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-8"
      RELAY_NODE_LABELS: "role=bastion,env=prod"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon8-state:/var/lib/relay-daemon

  # daemon-9 is `role=web, env=staging`: demo
  # service + policy.web.toml, the same shape as daemon-6.
  daemon-9:
    <<: *daemon-base
    hostname: "dev-node-9"
    environment:
      RELAY_ADDRESS: "https://relay:7654"
      RELAY_SERVER_NAME: "${FLEET_HOSTNAME:-relay}"
      RELAY_STATE_DIR: "/var/lib/relay-daemon"
      RELAY_POLICY_PATH: "/etc/relay-daemon/policy.web.toml"
      RELAY_TEMPLATE_DIR: "/etc/relay-daemon/templates.d"
      HOSTNAME: "dev-node-9"
      RELAY_NODE_LABELS: "role=web,env=staging"
    volumes:
      - bootstrap-shared:/bootstrap:ro
      - daemon9-state:/var/lib/relay-daemon

# All named => persist across `compose down`; wiped only with `compose down -v`.
volumes:
  relay-data:
  # The Relay's staged configuration (see relay-config). Rewritten on every
  # `compose up`; nothing else writes it.
  relay-etc:
  bootstrap-shared:
  # Holds ONLY the control-plane admin credential. Separate from
  # bootstrap-shared so daemons never mount it (see the init service).
  control-credential:
  daemon1-state:
  daemon2-state:
  daemon3-state:
  daemon4-state:
  daemon5-state:
  daemon6-state:
  daemon7-state:
  daemon8-state:
  daemon9-state:
